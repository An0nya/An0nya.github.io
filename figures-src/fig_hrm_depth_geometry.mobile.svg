<svg viewBox="0 0 420 620" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>Depth geometry — 128 unrolled layers</title>
  <desc>Adjacent-layer cosine (left axis, solid) and delta-norm (right axis, dashed) across all 128 unrolled-layer transitions of the baseline HRM forward pass — two cycles, each cycle three L-submodules then H, 16 layers per module. A smooth residual highway sits at cosine 0.85-0.99 through most of the body, punctured by eight sharp dips exactly at the module-boundary transitions (marked with vertical rules), where cosine falls as low as 0.55 and delta-norm spikes as high as 399. A secondary panel below isolates the last pass's H module (16 states) against its last L submodule (16 states): H's per-layer cosine spans a wider range than L's, consistent with H being noisier per layer than L late in the pass.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .cosln{ fill:none; stroke: var(--accent,#4FB2C2); stroke-width:1.3; }
    .dnln { fill:none; stroke: var(--fourth,#6E92C4); stroke-width:1.1; stroke-dasharray:3.5 2; }
    .bnd  { stroke: var(--rule2,#27323D); stroke-width:1; stroke-dasharray:2 3; }
    .axis { stroke: var(--ink2,#A4B0BC); stroke-width:1; }
  </style>

