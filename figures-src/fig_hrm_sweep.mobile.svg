<svg viewBox="0 0 420 550" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>The config sweep — interlingua strength vs battery score</title>
  <desc>Scatter of 29 configs that have both an interlingua measurement and a battery score on disk (of the page's stated 35; six configs — anchor_first, combo, damp_L, damp_native, hh_damp — have no battery file at all, so a 35-config sweep on this axis cannot be drawn). x is each config's peak per-cycle math-interlingua cosine; y is the mean pass-rate across that config's battery items. Points are drawn as circles for configs scored greedily at n=1 and squares for configs whose only on-disk battery file is the later n=3-sampled verification run — a scoring-protocol mix, not a single consistent battery. Under this reading only one config, ext_h3, shows a perfect age-sort score; the three configs the page text calls the champions (rys_l, ratio_hi_l, combo_rys_anchor) are all sampled-run points and do not solve age-sort in the data.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .axis { stroke: var(--ink2,#A4B0BC); stroke-width:1; }
    .grid { stroke: var(--rule2,#27323D); stroke-width:1; stroke-dasharray:2 3; }
  </style>

  <rect x="0" y="0" width="420" height="550" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="20" y="26" font-size="14">The config sweep</text>
  <text class="mut" x="20" y="43" font-size="8.5">29 of 35 stated configs have both files ·</text>
  <text class="mut" x="20" y="56" font-size="8.5">x = peak interlingua cosine · y = mean battery pass-rate</text>

  <g class="grid">
    <line x1="75.82" y1="70" x2="75.82" y2="314"/>
    <line x1="135.45" y1="70" x2="135.45" y2="314"/>
    <line x1="195.09" y1="70" x2="195.09" y2="314"/>
    <line x1="254.73" y1="70" x2="254.73" y2="314"/>
    <line x1="314.36" y1="70" x2="314.36" y2="314"/>
    <line x1="374.0" y1="70" x2="374.0" y2="314"/>
    <line x1="46" y1="314" x2="374" y2="314"/>
    <line x1="46" y1="259.78" x2="374" y2="259.78"/>
    <line x1="46" y1="205.56" x2="374" y2="205.56"/>
    <line x1="46" y1="151.33" x2="374" y2="151.33"/>
    <line x1="46" y1="97.11" x2="374" y2="97.11"/>
  </g>

  <line x1="46" y1="70" x2="46" y2="314" class="axis"/>
  <line x1="46" y1="314" x2="374" y2="314" class="axis"/>

  <g class="mut" font-size="7.5" text-anchor="middle">
    <text x="75.82" y="326">0.0</text>
    <text x="195.09" y="326">0.2</text>
    <text x="314.36" y="326">0.4</text>
    <text x="210" y="342">interlingua strength →</text>
  </g>
  <g class="mut" font-size="7.5" text-anchor="end">
    <text x="41" y="317">0.0</text>
    <text x="41" y="209">0.4</text>
    <text x="41" y="100">0.8</text>
  </g>
  <text x="14" y="194" text-anchor="middle" class="ink2" font-size="8" transform="rotate(-90 14 194)">battery score ↑</text>

  <g fill="var(--accent,#4FB2C2)" fill-opacity="0.8" stroke="var(--accent,#4FB2C2)" stroke-width="1">
    <circle cx="295.88" cy="178.44" r="3.6"/>  <!-- combo_L -->
    <circle cx="187.93" cy="314.00" r="3.6"/>  <!-- combo_anchor_dampH -->
    <circle cx="74.63"  cy="223.63" r="3.6"/>  <!-- combo_rys_dampH -->
    <circle cx="138.44" cy="178.44" r="3.6"/>  <!-- damp_H -->
    <circle cx="99.08"  cy="223.63" r="3.6"/>  <!-- damp_H_a03 -->
    <circle cx="107.43" cy="314.00" r="3.6"/>  <!-- damp_a02 -->
    <circle cx="102.65" cy="223.63" r="3.6"/>  <!-- damp_a03 -->
    <circle cx="284.55" cy="133.26" r="3.6"/>  <!-- damp_a07 -->
    <circle cx="106.83" cy="178.44" r="3.6"/>  <!-- damp_ext_lite -->
    <circle cx="332.25" cy="178.44" r="3.6"/>  <!-- ext_h2_l5 -->
    <circle cx="124.72" cy="88.07"  r="3.6"/>  <!-- ext_h4_dampH -->
    <circle cx="356.71" cy="268.81" r="3.6"/>  <!-- l_h2_l16 -->
    <circle cx="279.77" cy="223.63" r="3.6"/>  <!-- l_h2_l4 -->
    <circle cx="307.80" cy="178.44" r="3.6"/>  <!-- l_h2_l8 -->
    <circle cx="149.77" cy="178.44" r="3.6"/>  <!-- rys_l_heavy -->
    <circle cx="134.86" cy="133.26" r="3.6"/>  <!-- rys_l_late -->
  </g>
  <circle cx="264.27" cy="178.44" r="3.6" fill="var(--accent,#4FB2C2)" fill-opacity="0.8" stroke="var(--accent,#4FB2C2)" stroke-width="1"/> <!-- ext_h3, solved -->

  <g fill="var(--fourth,#6E92C4)" fill-opacity="0.8" stroke="var(--fourth,#6E92C4)" stroke-width="1">
    <rect x="260.77" y="120.72" width="7" height="7"/>  <!-- baseline -->
    <rect x="299.53" y="165.91" width="7" height="7"/>  <!-- combo_rys_anchor -->
    <rect x="198.15" y="147.83" width="7" height="7"/>  <!-- combo_rysl_anchor -->
    <rect x="251.82" y="156.87" width="7" height="7"/>  <!-- combo_rysl_l6 -->
    <rect x="285.22" y="129.76" width="7" height="7"/>  <!-- combo_rysl_rysh -->
    <rect x="275.68" y="102.65" width="7" height="7"/>  <!-- ext_h2_l6 -->
    <rect x="121.22" y="147.83" width="7" height="7"/>  <!-- ext_h3_dampH -->
    <rect x="260.77" y="283.39" width="7" height="7"/>  <!-- ext_h4 -->
    <rect x="341.87" y="120.72" width="7" height="7"/>  <!-- ratio_hi_l -->
    <rect x="224.39" y="129.76" width="7" height="7"/>  <!-- rys_l -->
    <rect x="242.88" y="165.91" width="7" height="7"/>  <!-- rys_l_1234 -->
    <rect x="297.15" y="120.72" width="7" height="7"/>  <!-- rys_l_345 -->
  </g>

  <circle cx="264.27" cy="178.44" r="7" fill="none" stroke="var(--cause,#E3C24A)" stroke-width="1.5"/>

  <!-- leaders: baseline / combo_rys_anchor / ext_h3 pulled clear of neighboring same-shape markers -->
  <g stroke="var(--muted,#6F7C88)" stroke-width="0.75">
    <line x1="264.27" y1="124.22" x2="241.37" y2="101.36"/>
    <line x1="303.03" y1="169.41" x2="329.83" y2="207.63"/>
    <line x1="264.27" y1="178.44" x2="216.83" y2="219.14"/>
  </g>

  <g font-size="7.5" class="ink2">
    <text x="235" y="95" text-anchor="middle">baseline</text>
    <text x="224.39" y="122" text-anchor="middle">rys_l</text>
    <text x="341.87" y="112" text-anchor="middle">ratio_hi_l</text>
    <text x="335" y="215" text-anchor="middle">combo_rys_anchor</text>
    <text x="210" y="225" text-anchor="middle" fill="var(--cause,#E3C24A)">ext_h3 ✓</text>
  </g>

  <g font-size="8">
    <circle cx="60" cy="370" r="3.6" fill="var(--accent,#4FB2C2)" fill-opacity="0.8" stroke="var(--accent,#4FB2C2)"/>
    <text x="70" y="373" class="ink2">greedy, n=1 (original sweep)</text>
    <rect x="56" y="382" width="7" height="7" fill="var(--fourth,#6E92C4)" fill-opacity="0.8" stroke="var(--fourth,#6E92C4)"/>
    <text x="70" y="388" class="ink2">sampled, n=3 (§5 verification file)</text>
    <circle cx="60" cy="400" r="6" fill="none" stroke="var(--cause,#E3C24A)" stroke-width="1.4"/>
    <text x="70" y="404" class="ink2">age_sort solved (rate/pass = 1.0)</text>
  </g>

  <line x1="20" y1="430" x2="400" y2="430" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <text x="20" y="448" class="ink2" font-size="9">Solved configs scatter across x — decoupling holds. But rys_l,</text>
  <text x="20" y="464" class="ink2" font-size="9">ratio_hi_l, combo_rys_anchor only have <tspan fill="var(--fourth,#6E92C4)">verification-run</tspan> files on</text>
  <text x="20" y="480" class="ink2" font-size="9">disk, and none solve age-sort there.</text>
  <text x="20" y="500" class="mut" font-size="8">Battery item sets differ: 6-item configs (greedy) vs 10-item</text>
  <text x="20" y="514" class="mut" font-size="8">(sampled, +runners/ seating/meetday/bus) — y is the mean over</text>
  <text x="20" y="528" class="mut" font-size="8">whatever items that config's file has.</text>
</svg>
