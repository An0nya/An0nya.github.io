<svg viewBox="0 0 420 620" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>The config sweep — interlingua strength vs battery score</title>
  <desc>Scatter of 29 configs that have both an interlingua measurement and a battery score on disk (of the page's stated 35; six configs — anchor_first, combo, damp_L, damp_native, hh_damp — have no battery file at all, so a 35-config sweep on this axis cannot be drawn). x is each config's peak per-cycle math-interlingua cosine; y is the mean pass-rate across that config's battery items. Points are drawn as circles for configs scored greedily at n=1 and squares for configs whose only on-disk battery file is the later n=3-sampled verification run — a scoring-protocol mix, not a single consistent battery. Under this reading only one config, ext_h3, shows a perfect age-sort score; the three configs the page text calls the champions (rys_l, ratio_hi_l, combo_rys_anchor) are all sampled-run points and do not solve age-sort in the data.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .axis { stroke: var(--ink2,#A4B0BC); stroke-width:1; }
    .grid { stroke: var(--rule2,#27323D); stroke-width:1; stroke-dasharray:2 3; }
  </style>

  <rect x="0" y="0" width="420" height="620" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="20" y="26" font-size="14">The config sweep</text>
  <text class="mut" x="20" y="42" font-size="8.5">29 of 35 stated configs have both files · x = peak interlingua cosine · y = mean battery pass-rate</text>

  <g class="grid">
    <line x1="75.82" y1="56" x2="75.82" y2="300"/>
    <line x1="135.45" y1="56" x2="135.45" y2="300"/>
    <line x1="195.09" y1="56" x2="195.09" y2="300"/>
    <line x1="254.73" y1="56" x2="254.73" y2="300"/>
    <line x1="314.36" y1="56" x2="314.36" y2="300"/>
    <line x1="374.0" y1="56" x2="374.0" y2="300"/>
    <line x1="46" y1="300" x2="374" y2="300"/>
    <line x1="46" y1="245.78" x2="374" y2="245.78"/>
    <line x1="46" y1="191.56" x2="374" y2="191.56"/>
    <line x1="46" y1="137.33" x2="374" y2="137.33"/>
    <line x1="46" y1="83.11" x2="374" y2="83.11"/>
  </g>

  <line x1="46" y1="56" x2="46" y2="300" class="axis"/>
  <line x1="46" y1="300" x2="374" y2="300" class="axis"/>

  <g class="mut" font-size="7.5" text-anchor="middle">
    <text x="75.82" y="312">0.0</text>
    <text x="195.09" y="312">0.2</text>
    <text x="314.36" y="312">0.4</text>
    <text x="210" y="328">interlingua strength →</text>
  </g>
  <g class="mut" font-size="7.5" text-anchor="end">
    <text x="41" y="303">0.0</text>
    <text x="41" y="195">0.4</text>
    <text x="41" y="86">0.8</text>
  </g>
  <text x="14" y="180" text-anchor="middle" class="ink2" font-size="8" transform="rotate(-90 14 180)">battery score ↑</text>

  <g fill="var(--accent,#4FB2C2)" fill-opacity="0.8" stroke="var(--accent,#4FB2C2)" stroke-width="1">
    <circle cx="295.88" cy="164.44" r="3.6"/>  <!-- combo_L -->
    <circle cx="187.93" cy="300.00" r="3.6"/>  <!-- combo_anchor_dampH -->
    <circle cx="74.63"  cy="209.63" r="3.6"/>  <!-- combo_rys_dampH -->
    <circle cx="138.44" cy="164.44" r="3.6"/>  <!-- damp_H -->
    <circle cx="99.08"  cy="209.63" r="3.6"/>  <!-- damp_H_a03 -->
    <circle cx="107.43" cy="300.00" r="3.6"/>  <!-- damp_a02 -->
    <circle cx="102.65" cy="209.63" r="3.6"/>  <!-- damp_a03 -->
    <circle cx="284.55" cy="119.26" r="3.6"/>  <!-- damp_a07 -->
    <circle cx="106.83" cy="164.44" r="3.6"/>  <!-- damp_ext_lite -->
    <circle cx="332.25" cy="164.44" r="3.6"/>  <!-- ext_h2_l5 -->
    <circle cx="124.72" cy="74.07"  r="3.6"/>  <!-- ext_h4_dampH -->
    <circle cx="356.71" cy="254.81" r="3.6"/>  <!-- l_h2_l16 -->
    <circle cx="279.77" cy="209.63" r="3.6"/>  <!-- l_h2_l4 -->
    <circle cx="307.80" cy="164.44" r="3.6"/>  <!-- l_h2_l8 -->
    <circle cx="149.77" cy="164.44" r="3.6"/>  <!-- rys_l_heavy -->
    <circle cx="134.86" cy="119.26" r="3.6"/>  <!-- rys_l_late -->
  </g>
  <circle cx="264.27" cy="164.44" r="3.6" fill="var(--accent,#4FB2C2)" fill-opacity="0.8" stroke="var(--accent,#4FB2C2)" stroke-width="1"/> <!-- ext_h3, solved -->

  <g fill="var(--fourth,#6E92C4)" fill-opacity="0.8" stroke="var(--fourth,#6E92C4)" stroke-width="1">
    <rect x="260.77" y="106.72" width="7" height="7"/>  <!-- baseline -->
    <rect x="299.53" y="151.91" width="7" height="7"/>  <!-- combo_rys_anchor -->
    <rect x="198.15" y="133.83" width="7" height="7"/>  <!-- combo_rysl_anchor -->
    <rect x="251.82" y="142.87" width="7" height="7"/>  <!-- combo_rysl_l6 -->
    <rect x="285.22" y="115.76" width="7" height="7"/>  <!-- combo_rysl_rysh -->
    <rect x="275.68" y="88.65"  width="7" height="7"/>  <!-- ext_h2_l6 -->
    <rect x="121.22" y="133.83" width="7" height="7"/>  <!-- ext_h3_dampH -->
    <rect x="260.77" y="269.39" width="7" height="7"/>  <!-- ext_h4 -->
    <rect x="341.87" y="106.72" width="7" height="7"/>  <!-- ratio_hi_l -->
    <rect x="224.39" y="115.76" width="7" height="7"/>  <!-- rys_l -->
    <rect x="242.88" y="151.91" width="7" height="7"/>  <!-- rys_l_1234 -->
    <rect x="297.15" y="106.72" width="7" height="7"/>  <!-- rys_l_345 -->
  </g>

  <circle cx="264.27" cy="164.44" r="7" fill="none" stroke="var(--cause,#E3C24A)" stroke-width="1.5"/>

  <g font-size="7.5" class="ink2">
    <text x="264.27" y="88" text-anchor="middle">baseline</text>
    <text x="224.39" y="108" text-anchor="middle">rys_l</text>
    <text x="341.87" y="98" text-anchor="middle">ratio_hi_l</text>
    <text x="299.53" y="177" text-anchor="middle">combo_rys_anchor</text>
    <text x="252.27" y="196" text-anchor="middle" fill="var(--cause,#E3C24A)">ext_h3 ✓</text>
  </g>

  <g font-size="8">
    <circle cx="60" cy="356" r="3.6" fill="var(--accent,#4FB2C2)" fill-opacity="0.8" stroke="var(--accent,#4FB2C2)"/>
    <text x="70" y="359" class="ink2">greedy, n=1 (original sweep)</text>
    <rect x="56" y="368" width="7" height="7" fill="var(--fourth,#6E92C4)" fill-opacity="0.8" stroke="var(--fourth,#6E92C4)"/>
    <text x="70" y="374" class="ink2">sampled, n=3 (§5 verification file)</text>
    <circle cx="60" cy="386" r="6" fill="none" stroke="var(--cause,#E3C24A)" stroke-width="1.4"/>
    <text x="70" y="390" class="ink2">age_sort solved (rate/pass = 1.0)</text>
  </g>

  <line x1="20" y1="416" x2="400" y2="416" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <text x="20" y="434" class="ink2" font-size="9">Solved configs scatter across x —</text>
  <text x="20" y="450" class="ink2" font-size="9">decoupling holds. But rys_l, ratio_hi_l,</text>
  <text x="20" y="466" class="ink2" font-size="9">combo_rys_anchor only have <tspan fill="var(--fourth,#6E92C4)">verification-run</tspan></text>
  <text x="20" y="482" class="ink2" font-size="9">files on disk, and none solve age-sort there.</text>
  <text x="20" y="502" class="mut" font-size="8">Battery item sets differ: 6-item configs</text>
  <text x="20" y="516" class="mut" font-size="8">(greedy) vs 10-item (sampled, +runners/</text>
  <text x="20" y="530" class="mut" font-size="8">seating/meetday/bus) — y is the mean over</text>
  <text x="20" y="544" class="mut" font-size="8">whatever items that config's file has.</text>
</svg>
