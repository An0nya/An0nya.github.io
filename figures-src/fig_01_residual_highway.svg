<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .normlab { fill: var(--accent,#4FB2C2); }
    .enlab   { fill: var(--cause,#E3C24A); }
    .normline { stroke: var(--accent,#4FB2C2); fill: none; }
    .normdot  { fill: var(--accent,#4FB2C2); }
    .enline   { stroke: var(--cause,#E3C24A); fill: none; }
    .endot    { fill: var(--cause,#E3C24A); }
  </style>

  <rect x="0" y="0" width="720" height="500" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="40" y="30" font-size="18">The residual-norm highway</text>
  <text class="mut" x="40" y="49" font-size="10">MiniCPM5-1B &#183; last-token residual &#183; norm log-climb (left) + top-1 energy share (right) &#183; 4 crosslang probes avg</text>

  <!-- gridlines (norm decades) -->
  <g stroke="var(--rule2,#27323D)" stroke-width="1">
    <line x1="70" y1="80" x2="640" y2="80"/>
    <line x1="70" y1="162.5" x2="640" y2="162.5"/>
    <line x1="70" y1="245" x2="640" y2="245"/>
    <line x1="70" y1="327.5" x2="640" y2="327.5"/>
  </g>

  <!-- left (norm) axis -->
  <line x1="70" y1="80" x2="70" y2="410" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <g class="normlab" font-size="9" text-anchor="end">
    <text x="64" y="83">316</text><text x="64" y="165.5">100</text><text x="64" y="248">32</text><text x="64" y="330.5">10</text><text x="64" y="413">3</text>
  </g>
  <text x="26" y="245" transform="rotate(-90 26 245)" text-anchor="middle" class="normlab" font-size="10">residual L2 norm &#8212; log</text>

  <!-- right (energy) axis -->
  <line x1="640" y1="80" x2="640" y2="410" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <g class="enlab" font-size="9" text-anchor="start">
    <text x="646" y="108">0.6</text><text x="646" y="210">0.4</text><text x="646" y="311.5">0.2</text><text x="646" y="413">0</text>
  </g>
  <text x="706" y="245" transform="rotate(90 706 245)" text-anchor="middle" class="enlab" font-size="10">top-1 single-dim energy share</text>

  <!-- x axis -->
  <line x1="70" y1="410" x2="640" y2="410" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <g class="mut" font-size="9" text-anchor="middle">
    <text x="90" y="425">emb</text><text x="112" y="425">L0</text><text x="203.8" y="425">L4</text><text x="295.7" y="425">L8</text><text x="387.5" y="425">L12</text><text x="479.3" y="425">L16</text><text x="571.1" y="425">L20</text><text x="640" y="425">L23</text>
  </g>
  <text x="355" y="441" text-anchor="middle" class="mut" font-size="10">layer index (residual leaving layer i)</text>

  <!-- L1 marker: this page's layer -->
  <line x1="134.96" y1="70" x2="134.96" y2="410" stroke="var(--ink2,#A4B0BC)" stroke-width="0.8" stroke-dasharray="2 3"/>
  <text class="ink2" x="138" y="75" font-size="8.5">L1 &#8212; this page&#8217;s layer</text>

  <!-- NORM series: cyan solid + circles -->
  <polyline class="normline" stroke-width="2"
    points="112.00,399.08 134.96,376.07 157.91,347.71 180.87,323.74 203.83,313.21 226.78,297.83 249.74,290.79 272.70,269.83 295.65,271.7 318.61,254.95 341.57,240.42 364.52,232.37 387.48,218.82 410.43,208.3 433.39,196.43 456.35,182.99 479.30,167.5 502.26,155.43 525.22,141.79 548.17,130.96 571.13,124.16 594.09,111.48 617.04,103.28 640.00,98.27"/>
  <g class="normdot">
    <circle cx="112.00" cy="399.08" r="2.2"/><circle cx="134.96" cy="376.07" r="2.2"/><circle cx="157.91" cy="347.71" r="2.2"/><circle cx="180.87" cy="323.74" r="2.2"/><circle cx="203.83" cy="313.21" r="2.2"/><circle cx="226.78" cy="297.83" r="2.2"/><circle cx="249.74" cy="290.79" r="2.2"/><circle cx="272.70" cy="269.83" r="2.2"/><circle cx="295.65" cy="271.7" r="2.2"/><circle cx="318.61" cy="254.95" r="2.2"/><circle cx="341.57" cy="240.42" r="2.2"/><circle cx="364.52" cy="232.37" r="2.2"/><circle cx="387.48" cy="218.82" r="2.2"/><circle cx="410.43" cy="208.3" r="2.2"/><circle cx="433.39" cy="196.43" r="2.2"/><circle cx="456.35" cy="182.99" r="2.2"/><circle cx="479.30" cy="167.5" r="2.2"/><circle cx="502.26" cy="155.43" r="2.2"/><circle cx="525.22" cy="141.79" r="2.2"/><circle cx="548.17" cy="130.96" r="2.2"/><circle cx="571.13" cy="124.16" r="2.2"/><circle cx="594.09" cy="111.48" r="2.2"/><circle cx="617.04" cy="103.28" r="2.2"/><circle cx="640.00" cy="98.27" r="2.2"/>
  </g>

  <!-- ENERGY series: citron dashed + squares -->
  <polyline class="enline" stroke-width="2" stroke-dasharray="6 4"
    points="112.00,104.62 134.96,168.69 157.91,189.97 180.87,212.0 203.83,263.99 226.78,315.16 249.74,387.71 272.70,361.26 295.65,368.57 318.61,351.36 341.57,352.33 364.52,341.21 387.48,373.9 410.43,365.32 433.39,352.63 456.35,322.47 479.30,291.25 502.26,311.15 525.22,289.47 548.17,264.8 571.13,249.32 594.09,213.78 617.04,213.12 640.00,328.72"/>
  <g class="endot">
    <rect x="110.00" y="102.62" width="4" height="4"/><rect x="132.96" y="166.69" width="4" height="4"/><rect x="155.91" y="187.97" width="4" height="4"/><rect x="178.87" y="210.00" width="4" height="4"/><rect x="201.83" y="261.99" width="4" height="4"/><rect x="224.78" y="313.16" width="4" height="4"/><rect x="247.74" y="385.71" width="4" height="4"/><rect x="270.70" y="359.26" width="4" height="4"/><rect x="293.65" y="366.57" width="4" height="4"/><rect x="316.61" y="349.36" width="4" height="4"/><rect x="339.57" y="350.33" width="4" height="4"/><rect x="362.52" y="339.21" width="4" height="4"/><rect x="385.48" y="371.90" width="4" height="4"/><rect x="408.43" y="363.32" width="4" height="4"/><rect x="431.39" y="350.63" width="4" height="4"/><rect x="454.35" y="320.47" width="4" height="4"/><rect x="477.30" y="289.25" width="4" height="4"/><rect x="500.26" y="309.15" width="4" height="4"/><rect x="523.22" y="287.47" width="4" height="4"/><rect x="546.17" y="262.80" width="4" height="4"/><rect x="569.13" y="247.32" width="4" height="4"/><rect x="592.09" y="211.78" width="4" height="4"/><rect x="615.04" y="211.12" width="4" height="4"/><rect x="638.00" y="326.72" width="4" height="4"/>
  </g>

  <!-- emb energy point + leap connector to L0 (the corrected thesis) -->
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--cause,#E3C24A)"/>
    </marker>
  </defs>
  <line x1="90" y1="402.84" x2="110" y2="112" class="enline" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#up)"/>
  <rect class="endot" x="88" y="400.84" width="4" height="4"/>
  <text class="enlab" x="84" y="398" font-size="8.5" text-anchor="end">0.01</text>
  <text class="enlab" x="118" y="103" font-size="9">0.60 &#8212; massive activation born at L0</text>

  <!-- norm climb annotation -->
  <text class="normlab" x="300" y="120" font-size="9.5">norm: 3.7 &#8594; 245 over L0&#8594;L23</text>
  <text class="normlab" x="300" y="133" font-size="9.5">&#8776; 66&#215;, near-log-linear climb</text>

  <!-- massive-activation dim switch -->
  <text class="mut" x="256" y="334" font-size="8">top dim 745&#8594;288 @ L7</text>

  <!-- energy floor + re-concentration -->
  <text class="enlab" x="252" y="402" font-size="8" text-anchor="middle">floor 0.04 @ L6</text>
  <text class="enlab" x="600" y="200" font-size="8">re-conc. &#8594; 0.39 @L22</text>

  <!-- L23 output gate -->
  <text class="normlab" x="636" y="92" font-size="9" text-anchor="end">L23 output &#183; &#916;/resid 0.96</text>

  <!-- legend -->
  <g font-size="9">
    <line x1="430" y1="383" x2="456" y2="383" class="normline" stroke-width="2"/>
    <circle cx="443" cy="383" r="2.2" class="normdot"/>
    <text x="462" y="386" class="ink2">residual L2 norm (log, left axis)</text>
    <line x1="430" y1="399" x2="456" y2="399" class="enline" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="441" y="397" width="4" height="4" class="endot"/>
    <text x="462" y="402" class="ink2">top-1 energy share (right axis)</text>
  </g>

  <!-- takeaway -->
  <line x1="40" y1="458" x2="680" y2="458" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <text x="40" y="478" class="ink2" font-size="11">A vanilla-Llama highway: residual norm climbs <tspan class="normlab">~66&#215;</tspan> (3.7&#8594;245); one dim holds <tspan class="enlab">60%</tspan> of L0&#8217;s energy.</text>
  <text x="40" y="493" class="ink2" font-size="11">The embedding is diffuse (0.01) &#8212; the massive activation is <tspan class="enlab">born at layer 0</tspan>, not carried in the embedding.</text>
</svg>
