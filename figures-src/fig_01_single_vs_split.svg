<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .obs  { stroke: var(--accent,#4FB2C2); fill: var(--accent,#4FB2C2); }
    .foil { stroke: var(--cause,#E3C24A); fill: var(--cause,#E3C24A); }
    .stk  { stroke: var(--neg,#B98AD6); fill: var(--neg,#B98AD6); }
  </style>

  <rect x="0" y="0" width="720" height="500" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="40" y="30" font-size="18">One pass can&#8217;t buy what splitting buys</text>
  <text class="mut" x="40" y="49" font-size="10">MiniCPM5-1B &#183; L1 &#183; &#916; strict-math vs own baseline &#183; 18 shared math probes &#183; each config against its own file baseline</text>

  <!-- gridlines -->
  <g stroke="var(--rule2,#27323D)" stroke-width="1">
    <line x1="70" y1="102" x2="660" y2="102"/>
    <line x1="70" y1="157" x2="660" y2="157"/>
    <line x1="70" y1="212" x2="660" y2="212"/>
    <line x1="70" y1="322" x2="660" y2="322"/>
    <line x1="70" y1="377" x2="660" y2="377"/>
  </g>

  <!-- y axis + labels -->
  <line x1="70" y1="80" x2="70" y2="410" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <g class="mut" font-size="9" text-anchor="end">
    <text x="64" y="105">+.15</text><text x="64" y="160">+.10</text><text x="64" y="215">+.05</text>
    <text x="64" y="270">0</text><text x="64" y="325">&#8722;.05</text><text x="64" y="380">&#8722;.10</text>
  </g>
  <text x="26" y="245" transform="rotate(-90 26 245)" text-anchor="middle" class="mut" font-size="10">&#916; strict-math vs baseline</text>

  <!-- baseline zero (meaningful) -->
  <line x1="70" y1="267" x2="660" y2="267" stroke="var(--ink2,#A4B0BC)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="mut" x="656" y="263" text-anchor="end" font-size="8.5">baseline (&#916; = 0)</text>

  <!-- x axis + labels -->
  <line x1="70" y1="410" x2="660" y2="410" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <g class="mut" font-size="9" text-anchor="middle">
    <text x="101" y="425">0.5</text><text x="256.3" y="425">1.0</text><text x="411.6" y="425">1.5</text><text x="566.8" y="425">2.0</text>
  </g>
  <text x="365" y="441" text-anchor="middle" class="mut" font-size="10">&#931;&#945;  (cumulative alpha on L1)</text>

  <!-- single damped pass (foil): citron dashed, hollow circles -->
  <polyline class="foil" style="fill:none" stroke-width="2" stroke-dasharray="6 4"
    points="101.05,270.85 132.1,236.4 163.2,240.3 194.2,255.5 225.3,251.7 256.3,270.85 287.4,301.4 349.5,354.9 411.6,393.0"/>
  <g class="foil">
    <circle cx="101.05" cy="270.85" r="2.6"/><circle cx="132.1" cy="236.4" r="2.6"/><circle cx="163.2" cy="240.3" r="2.6"/><circle cx="194.2" cy="255.5" r="2.6"/><circle cx="225.3" cy="251.7" r="2.6"/><circle cx="256.3" cy="270.85" r="2.6"/><circle cx="287.4" cy="301.4" r="2.6"/><circle cx="349.5" cy="354.9" r="2.6"/><circle cx="411.6" cy="393.0" r="2.6"/>
  </g>
  <text class="foil" x="132.1" y="228" text-anchor="middle" font-size="8.5" stroke="none">+.028</text>

  <!-- split k=2 (hero): cyan solid, filled circles -->
  <polyline class="obs" style="fill:none" stroke-width="2"
    points="194.2,171.5 225.3,167.7 256.3,167.7 287.4,163.8 318.4,160.1 334.0,171.5 349.5,171.5 380.5,175.4 411.6,186.8 442.6,202.1 473.7,202.1 489.2,205.8 504.7,209.7 535.8,251.7 566.8,263.2 597.9,282.3 628.9,331.9"/>
  <g class="obs">
    <circle cx="194.2" cy="171.5" r="2.6"/><circle cx="225.3" cy="167.7" r="2.6"/><circle cx="256.3" cy="167.7" r="2.6"/><circle cx="287.4" cy="163.8" r="2.6"/><circle cx="318.4" cy="160.1" r="2.6"/><circle cx="334.0" cy="171.5" r="2.6"/><circle cx="349.5" cy="171.5" r="2.6"/><circle cx="380.5" cy="175.4" r="2.6"/><circle cx="411.6" cy="186.8" r="2.6"/><circle cx="442.6" cy="202.1" r="2.6"/><circle cx="473.7" cy="202.1" r="2.6"/><circle cx="489.2" cy="205.8" r="2.6"/><circle cx="504.7" cy="209.7" r="2.6"/><circle cx="535.8" cy="251.7" r="2.6"/><circle cx="566.8" cy="263.2" r="2.6"/><circle cx="597.9" cy="282.3" r="2.6"/><circle cx="628.9" cy="331.9" r="2.6"/>
  </g>

  <!-- stacks (violet, marker-only, shape-coded) -->
  <g class="stk" stroke="none">
    <!-- k=3 square @ S1.5 -->
    <rect x="407.6" y="163.7" width="8" height="8"/>
    <!-- k=4 triangle @ S1.25 and S1.5 -->
    <polygon points="334,118.65 328,130.65 340,130.65"/>
    <polygon points="411.6,91.9 405.6,103.9 417.6,103.9"/>
    <!-- k=6 diamond @ S1.25 -->
    <polygon points="334,99.6 341,106.6 334,113.6 327,106.6"/>
  </g>

  <!-- same-dose swing arrow @ Sigma 1.5 -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink2,#A4B0BC)"/>
    </marker>
  </defs>
  <line x1="411.6" y1="98.9" x2="411.6" y2="393.0" stroke="var(--ink2,#A4B0BC)" stroke-width="1.3"
        marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text class="ink2" x="424" y="234" font-size="9.5">same &#931;&#945; = 1.5</text>
  <text class="ink2" x="424" y="247" font-size="9.5">&#916;-swing <tspan class="obs" stroke="none">+0.27</tspan></text>
  <text class="mut" x="424" y="290" font-size="8">single &#8722;.115 &#8594; split +.153</text>

  <!-- legend (lower-left, empty quadrant) -->
  <g font-size="9">
    <line x1="92" y1="318" x2="118" y2="318" class="foil" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="105" cy="318" r="2.6" class="foil" stroke="none"/>
    <text x="124" y="321" class="ink2">single damped pass (&#931;&#945; = &#945;)</text>
    <line x1="92" y1="334" x2="118" y2="334" class="obs" stroke-width="2"/>
    <circle cx="105" cy="334" r="2.6" class="obs" stroke="none"/>
    <text x="124" y="337" class="ink2">split, k = 2 (&#931;&#945; sweep)</text>
    <g class="stk" stroke="none">
      <rect x="98" y="346" width="8" height="8"/>
      <polygon points="148,346 143,355 153,355"/>
      <polygon points="190,350.5 195,346 200,350.5 195,355"/>
    </g>
    <text x="124" y="353" class="ink2" font-size="8.5">k3</text>
    <text x="171" y="353" class="ink2" font-size="8.5">k4</text>
    <text x="206" y="353" class="ink2" font-size="8.5">k6 (stacks)</text>
  </g>

  <!-- takeaway -->
  <line x1="40" y1="458" x2="680" y2="458" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <text x="40" y="478" class="ink2" font-size="11">Same budget, opposite outcomes. A single &#945; buys at most +0.03 and turns <tspan class="foil" stroke="none">harmful</tspan> when amplified.</text>
  <text x="40" y="493" class="ink2" font-size="11">Splitting the same &#931;&#945; across re-evaluated passes <tspan class="obs" stroke="none">holds +0.15</tspan> &#8212; a place a single &#945; can&#8217;t reach.</text>
</svg>
