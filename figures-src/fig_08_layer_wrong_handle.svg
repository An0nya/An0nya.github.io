<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>The layer is the wrong handle on a Mixture-of-Experts model</title>
  <desc>Two diagrams. On a dense model, duplicating a layer amplifies a unit of computation and capability shifts. On a mixture-of-experts model, the layer is a router selecting a few of many experts; duplicating the whole layer re-runs the router on a shifted input, mis-fires the expert selection, and breaks the output. The operable unit on an MoE is the expert, not the layer.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .ok   { fill: var(--accent,#4FB2C2); }
    .bad  { fill: var(--neg,#B98AD6); }
    .lyr  { fill: var(--bg2,#141D26); stroke: var(--rule2,#27323D); stroke-width: 1.2; }
    .lyrhi{ fill: none; stroke: var(--accent,#4FB2C2); stroke-width: 2; }
    .exp  { fill: var(--bg2,#141D26); stroke: var(--rule2,#27323D); stroke-width: 0.8; }
    .explit { fill: var(--accent,#4FB2C2); stroke: var(--accent,#4FB2C2); }
    .expmis { fill: none; stroke: var(--neg,#B98AD6); stroke-width: 1; }
    .gd   { stroke: var(--ink2,#A4B0BC); fill: none; }
    .gdbad{ stroke: var(--neg,#B98AD6); fill: none; }
  </style>

  <rect x="0" y="0" width="720" height="500" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="40" y="32" font-size="18">The layer is the wrong handle</text>
  <text class="mut" x="40" y="51" font-size="10">A layer is a computation you can repeat. An expert bank is a routed lookup you can&#8217;t repeat without breaking the route.</text>

  <line x1="360" y1="72" x2="360" y2="452" stroke="var(--rule2,#27323D)" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ===================== LEFT: DENSE ===================== -->
  <text class="ink2" x="40" y="88" font-size="12" font-family="var(--font-serif,'Newsreader',Georgia,serif)">Dense &#183; duplicate a layer &#8594; amplify</text>

  <!-- original stack -->
  <g>
    <rect class="lyr" x="70"  y="110" width="120" height="26" rx="3"/>
    <rect class="lyr" x="70"  y="142" width="120" height="26" rx="3"/>
    <rect class="lyrhi" x="70" y="174" width="120" height="26" rx="3"/>
    <rect class="lyr" x="70"  y="206" width="120" height="26" rx="3"/>
    <rect class="lyr" x="70"  y="238" width="120" height="26" rx="3"/>
    <text class="ok" x="130" y="191" font-size="9" text-anchor="middle">layer L</text>
  </g>

  <!-- duplicate arrow -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#4FB2C2)"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--neg,#B98AD6)"/>
    </marker>
  </defs>
  <line x1="196" y1="187" x2="244" y2="187" class="gd" stroke-width="1.4" marker-end="url(#ar)"/>
  <text class="ok" x="220" y="180" font-size="8.5" text-anchor="middle">dup</text>

  <!-- amplified stack: L duplicated -->
  <g>
    <rect class="lyr" x="250" y="110" width="120" height="26" rx="3"/>
    <rect class="lyr" x="250" y="142" width="120" height="26" rx="3"/>
    <rect class="lyrhi" x="250" y="174" width="120" height="26" rx="3"/>
    <rect class="lyrhi" x="250" y="206" width="120" height="26" rx="3"/>
    <rect class="lyr" x="250" y="238" width="120" height="26" rx="3"/>
    <rect class="lyr" x="250" y="270" width="120" height="26" rx="3"/>
    <text class="ok" x="310" y="191" font-size="9" text-anchor="middle">L</text>
    <text class="ok" x="310" y="223" font-size="9" text-anchor="middle">L&#8242; (copy)</text>
  </g>

  <text class="ok" x="130" y="330" font-size="11" text-anchor="middle">&#10003; capability shifts</text>
  <text class="mut" x="200" y="350" font-size="9" text-anchor="middle">the unit of compute is repeated &#8212;</text>
  <text class="mut" x="200" y="363" font-size="9" text-anchor="middle">a layer can be amplified.</text>

  <!-- ===================== RIGHT: MoE ===================== -->
  <!-- shifted right so the inter-panel gap (58px) ≈ the dense panel's internal stack gap (60px) -->
  <g transform="translate(56,0)">
  <text class="ink2" x="380" y="88" font-size="12" font-family="var(--font-serif,'Newsreader',Georgia,serif)">MoE &#183; the same dup re-runs the router</text>

  <!-- input residual -->
  <text class="mut" x="400" y="120" font-size="9">residual in</text>
  <line x1="400" y1="126" x2="400" y2="150" class="gd" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- router node -->
  <rect x="372" y="150" width="56" height="22" rx="3" fill="var(--bg2,#141D26)" stroke="var(--accent,#4FB2C2)" stroke-width="1.5"/>
  <text class="ok" x="400" y="165" font-size="9" text-anchor="middle">router</text>

  <!-- expert bank: 8 cols x 4 rows = 32 shown, "of ~128"; ~8 lit -->
  <g>
    <!-- row template; lit ones get .explit -->
    <!-- we lay 32 experts; mark 8 lit (the routed top-k) -->
    <rect class="explit" x="372" y="190" width="12" height="12" rx="2"/>
    <rect class="exp" x="388" y="190" width="12" height="12" rx="2"/>
    <rect class="exp" x="404" y="190" width="12" height="12" rx="2"/>
    <rect class="explit" x="420" y="190" width="12" height="12" rx="2"/>
    <rect class="exp" x="436" y="190" width="12" height="12" rx="2"/>
    <rect class="exp" x="452" y="190" width="12" height="12" rx="2"/>
    <rect class="exp" x="468" y="190" width="12" height="12" rx="2"/>
    <rect class="explit" x="484" y="190" width="12" height="12" rx="2"/>

    <rect class="exp" x="372" y="206" width="12" height="12" rx="2"/>
    <rect class="exp" x="388" y="206" width="12" height="12" rx="2"/>
    <rect class="explit" x="404" y="206" width="12" height="12" rx="2"/>
    <rect class="exp" x="420" y="206" width="12" height="12" rx="2"/>
    <rect class="exp" x="436" y="206" width="12" height="12" rx="2"/>
    <rect class="explit" x="452" y="206" width="12" height="12" rx="2"/>
    <rect class="exp" x="468" y="206" width="12" height="12" rx="2"/>
    <rect class="exp" x="484" y="206" width="12" height="12" rx="2"/>

    <rect class="exp" x="372" y="222" width="12" height="12" rx="2"/>
    <rect class="explit" x="388" y="222" width="12" height="12" rx="2"/>
    <rect class="exp" x="404" y="222" width="12" height="12" rx="2"/>
    <rect class="exp" x="420" y="222" width="12" height="12" rx="2"/>
    <rect class="exp" x="436" y="222" width="12" height="12" rx="2"/>
    <rect class="exp" x="452" y="222" width="12" height="12" rx="2"/>
    <rect class="explit" x="468" y="222" width="12" height="12" rx="2"/>
    <rect class="exp" x="484" y="222" width="12" height="12" rx="2"/>

    <rect class="exp" x="372" y="238" width="12" height="12" rx="2"/>
    <rect class="exp" x="388" y="238" width="12" height="12" rx="2"/>
    <rect class="exp" x="404" y="238" width="12" height="12" rx="2"/>
    <rect class="exp" x="420" y="238" width="12" height="12" rx="2"/>
    <rect class="exp" x="436" y="238" width="12" height="12" rx="2"/>
    <rect class="exp" x="452" y="238" width="12" height="12" rx="2"/>
    <rect class="exp" x="468" y="238" width="12" height="12" rx="2"/>
    <rect class="exp" x="484" y="238" width="12" height="12" rx="2"/>
  </g>
  <text class="mut" x="510" y="200" font-size="8.5">&#9632; ~8 of ~128</text>
  <text class="mut" x="510" y="212" font-size="8.5">experts lit</text>
  <text class="mut" x="510" y="224" font-size="8.5">per token</text>

  <!-- duplicate the whole layer -> shifted input -->
  <line x1="400" y1="252" x2="400" y2="284" class="gdbad" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arb)"/>
  <text class="bad" x="408" y="272" font-size="8.5">dup &#8594; router re-runs on</text>
  <text class="bad" x="408" y="283" font-size="8.5">an uncalibrated residual</text>

  <!-- second router on shifted input: mis-fires -->
  <rect x="372" y="288" width="56" height="22" rx="3" fill="var(--bg2,#141D26)" stroke="var(--neg,#B98AD6)" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text class="bad" x="400" y="303" font-size="9" text-anchor="middle">router&#8242;</text>

  <!-- mis-fired selection: different + sparse, dashed outline -->
  <g>
    <rect class="expmis" x="372" y="326" width="12" height="12" rx="2" stroke-dasharray="2 1.5"/>
    <rect class="exp" x="388" y="326" width="12" height="12" rx="2"/>
    <rect class="exp" x="404" y="326" width="12" height="12" rx="2"/>
    <rect class="exp" x="420" y="326" width="12" height="12" rx="2"/>
    <rect class="expmis" x="436" y="326" width="12" height="12" rx="2" stroke-dasharray="2 1.5"/>
    <rect class="exp" x="452" y="326" width="12" height="12" rx="2"/>
    <rect class="expmis" x="468" y="326" width="12" height="12" rx="2" stroke-dasharray="2 1.5"/>
    <rect class="exp" x="484" y="326" width="12" height="12" rx="2"/>
  </g>
  <text class="bad" x="510" y="336" font-size="8.5">wrong experts &#8212;</text>
  <text class="bad" x="510" y="348" font-size="8.5">null rates explode</text>

  <text class="bad" x="400" y="378" font-size="11" text-anchor="middle">&#10007; routing breaks</text>
  <text class="mut" x="500" y="398" font-size="9" text-anchor="middle">the route can&#8217;t be repeated &#8212; the</text>
  <text class="mut" x="500" y="411" font-size="9" text-anchor="middle">operable unit is the <tspan class="ok">expert</tspan>, not the layer.</text>
  </g>

  <!-- takeaway -->
  <line x1="40" y1="430" x2="680" y2="430" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <text x="40" y="452" class="ink2" font-size="11">Dense surgery works because a layer is a <tspan class="ok">unit of computation</tspan> you can duplicate. On an MoE the layer is a <tspan class="ok">router</tspan> +</text>
  <text x="40" y="468" class="ink2" font-size="11">expert bank; duplicating it re-runs the router on a shifted residual, <tspan class="bad">mis-fires selection, and breaks the output</tspan>.</text>
  <text x="40" y="486" class="mut" font-size="10">To touch what the model knows, operate on the <tspan class="ok">expert</tspan> &#8212; the unit of capacity &#8212; not the layer.</text>
</svg>
