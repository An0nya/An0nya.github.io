<svg viewBox="0 0 400 720" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .ln   { fill: none; stroke: var(--accent,#4FB2C2); stroke-width: 2; }
    .mk   { fill: var(--bg,#0E141A); stroke: var(--accent,#4FB2C2); stroke-width: 1.8; }
  </style>

  <rect x="0" y="0" width="400" height="720" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="20" y="32" font-size="18">The arithmetic cliff —</text>
  <text class="ttl" x="20" y="54" font-size="18">where each operation breaks</text>
  <text class="mut" x="20" y="74" font-size="10">Baseline strict-correct vs difficulty. Shaded = 0.3–0.7 band.</text>

  <!-- ===== ROW 1 ===== -->
  <!-- PANEL add (TL) -->
  <g>
    <rect x="50" y="162" width="130" height="56" fill="var(--accent,#4FB2C2)" opacity="0.06"/>
    <line x1="50" y1="120" x2="50" y2="260" stroke="var(--rule2,#27323D)" stroke-width="1"/>
    <line x1="50" y1="260" x2="180" y2="260" stroke="var(--rule2,#27323D)" stroke-width="1"/>
    <text x="115" y="112" text-anchor="middle" class="ink2" font-size="11">add · gentle</text>
    <g class="mut" font-size="8" text-anchor="end"><text x="46" y="123">1</text><text x="46" y="193">.5</text><text x="46" y="263">0</text></g>
    <polyline class="ln" points="65,120 115,192.8 165,229.2"/>
    <circle class="mk" cx="65" cy="120" r="3.4"/>
    <circle cx="115" cy="192.8" r="4.4" fill="var(--bg,#0E141A)" stroke="var(--cause,#E3C24A)" stroke-width="2.2"/>
    <circle class="mk" cx="165" cy="229.2" r="3.4"/>
    <g class="mut" font-size="8.5" text-anchor="middle"><text x="65" y="275">d2</text><text x="115" y="275">d5</text><text x="165" y="275">d7</text></g>
  </g>
  <!-- PANEL sub (TR) -->
  <g>
    <rect x="220" y="162" width="130" height="56" fill="var(--accent,#4FB2C2)" opacity="0.06"/>
    <line x1="220" y1="120" x2="220" y2="260" stroke="var(--rule2,#27323D)" stroke-width="1"/>
    <line x1="220" y1="260" x2="350" y2="260" stroke="var(--rule2,#27323D)" stroke-width="1"/>
    <text x="285" y="112" text-anchor="middle" class="ink2" font-size="11">sub · monotone</text>
    <polyline class="ln" points="235,135.4 268,176 301,218 334,236.2"/>
    <g class="mk"><rect x="231.6" y="131.8" width="6.8" height="6.8"/><rect x="264.6" y="172.6" width="6.8" height="6.8"/><rect x="297.6" y="214.6" width="6.8" height="6.8"/><rect x="330.6" y="232.8" width="6.8" height="6.8"/></g>
    <g class="mut" font-size="8.5" text-anchor="middle"><text x="235" y="275">d2</text><text x="268" y="275">d3</text><text x="301" y="275">d4</text><text x="334" y="275">d5</text></g>
  </g>

  <!-- ===== ROW 2 ===== -->
  <!-- PANEL mul (BL) -->
  <g>
    <rect x="50" y="402" width="130" height="56" fill="var(--accent,#4FB2C2)" opacity="0.06"/>
    <line x1="50" y1="360" x2="50" y2="500" stroke="var(--rule2,#27323D)" stroke-width="1"/>
    <line x1="50" y1="500" x2="180" y2="500" stroke="var(--rule2,#27323D)" stroke-width="1"/>
    <text x="115" y="352" text-anchor="middle" class="ink2" font-size="11">mul · razor cliff</text>
    <g class="mut" font-size="8" text-anchor="end"><text x="46" y="363">1</text><text x="46" y="433">.5</text><text x="46" y="503">0</text></g>
    <polyline class="ln" points="65,388 115,431.4 165,494.4"/>
    <polygon class="mk" points="65,383.4 61,391 69,391"/>
    <polygon points="115,425.8 110.4,435 119.6,435" fill="var(--bg,#0E141A)" stroke="var(--cause,#E3C24A)" stroke-width="2.2"/>
    <polygon class="mk" points="165,489.8 161,497.4 169,497.4"/>
    <g class="mut" font-size="8.5" text-anchor="middle"><text x="65" y="515">2×2</text><text x="115" y="515">3×2</text><text x="165" y="515">3×3</text></g>
  </g>
  <!-- PANEL div (BR) -->
  <g>
    <rect x="220" y="402" width="130" height="56" fill="var(--accent,#4FB2C2)" opacity="0.06"/>
    <line x1="220" y1="360" x2="220" y2="500" stroke="var(--rule2,#27323D)" stroke-width="1"/>
    <line x1="220" y1="500" x2="350" y2="500" stroke="var(--rule2,#27323D)" stroke-width="1"/>
    <text x="285" y="352" text-anchor="middle" class="ink2" font-size="11">div · broad</text>
    <polyline class="ln" points="235,362.8 285,399.2 335,460.8"/>
    <polygon class="mk" points="235,358.2 230.4,362.8 235,367.4 239.6,362.8"/>
    <polygon class="mk" points="285,394.6 280.4,399.2 285,403.8 289.6,399.2"/>
    <polygon class="mk" points="335,456.2 330.4,460.8 335,465.4 339.6,460.8"/>
    <g class="mut" font-size="8.5" text-anchor="middle"><text x="235" y="515">1×2</text><text x="285" y="515">2×2</text><text x="335" y="515">2×3</text></g>
  </g>

  <!-- caption -->
  <text x="20" y="560" text-anchor="start" font-size="9" fill="var(--cause,#E3C24A)">◦ bullseye = best-resolution rung (add d5, mul 3×2)</text>
  <text x="20" y="586" class="ink2" font-size="10.5">In-band set sits at p 0.28–0.72, baseline ≈ 0.48 —</text>
  <text x="20" y="602" class="ink2" font-size="10.5">a ruler that can win or lose visibly.</text>
  <text x="20" y="624" class="mut" font-size="9.5">Lesson: n=4 per rung is a lottery; use ≥12,</text>
  <text x="20" y="639" class="mut" font-size="9.5">all operands controlled.</text>

  <!-- legend -->
  <g transform="translate(20,672)" font-size="9.5">
    <circle cx="6" cy="-3" r="3.4" class="mk"/><text x="16" y="0" class="mut">add</text>
    <rect x="58" y="-6.4" width="6.8" height="6.8" class="mk"/><text x="72" y="0" class="mut">sub</text>
    <polygon points="116,-7 112,0 120,0" class="mk"/><text x="128" y="0" class="mut">mul</text>
    <polygon points="172,-7 167.4,-3 172,1 176.6,-3" class="mk"/><text x="184" y="0" class="mut">div</text>
  </g>
  <g transform="translate(20,696)" font-size="9.5">
    <rect x="0" y="-9" width="14" height="11" fill="var(--accent,#4FB2C2)" opacity="0.10"/><text x="20" y="0" class="mut">usable band 0.3–0.7</text>
  </g>
</svg>
