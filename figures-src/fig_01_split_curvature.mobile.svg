<svg viewBox="0 0 400 900" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .k2 { stroke: var(--accent,#4FB2C2); fill: var(--accent,#4FB2C2); }
    .k3 { stroke: var(--neg,#B98AD6);   fill: var(--neg,#B98AD6); }
    .k4 { stroke: var(--fourth,#6E92C4);fill: var(--fourth,#6E92C4); }
    .k6 { stroke: var(--cause,#E3C24A); fill: var(--cause,#E3C24A); }
    /* keep stroke weights at their authored px regardless of group scaling */
    .nss line, .nss polyline, .nss polygon, .nss circle, .nss rect { vector-effect: non-scaling-stroke; }
  </style>
  <defs>
    <marker id="cvahM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink2,#A4B0BC)"/>
    </marker>
    <pattern id="s10HatchM" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="var(--accent,#4FB2C2)" opacity="0.14"/>
      <path d="M0,5 L5,0" stroke="var(--accent,#4FB2C2)" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="400" height="900" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="16" y="29" font-size="15">One pass and a split pass</text>
  <text class="ttl" x="16" y="47" font-size="15">at equal &#931;&#945; don&#8217;t coincide</text>
  <text class="mut" x="16" y="68" font-size="8.5">MiniCPM5-1B &#183; L1 residual at the answer token</text>
  <text class="mut" x="16" y="79" font-size="8.5">probe &#8220;4827 + 3596&#8221; &#183; &#931;&#945;=1.5 &#183; split re-evaluates per step</text>

  <!-- ===================== PANEL A: trajectory ===================== -->
  <g transform="translate(0,16)">
  <text class="ink2" x="16" y="90" font-size="10">&#9312; one shove vs split &#8212; the paths peel apart</text>
  <!-- panel A geometry uniformly scaled x1.156 about (48,100) to match panels 2/3 width -->
  <g class="nss" transform="translate(-7.49,-15.6) scale(1.156)">
  <line x1="48" y1="100" x2="48" y2="255" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <line x1="48" y1="255" x2="335" y2="255" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <text x="190" y="268" text-anchor="middle" class="mut" font-size="8.5">PC1 (residual at answer token)</text>
  <text x="40" y="177" transform="rotate(-90 40 177)" text-anchor="middle" class="mut" font-size="8.5">PC2</text>

  <line x1="52.1" y1="161.5" x2="302.4" y2="251.2" stroke="var(--ink2,#A4B0BC)" stroke-width="1.6"
        stroke-dasharray="5 3"/>
  <polyline class="k4" style="fill:none" stroke-width="1.6" points="52.1,161.5 114.6,183.9 176.5,180.0 243.6,157.2 322.3,115.1"/>
  <polyline class="k3" style="fill:none" stroke-width="1.6" points="52.1,161.5 135.8,191.4 217.8,177.0 310.9,133.2"/>
  <polyline class="k2" style="fill:none" stroke-width="1.6" points="52.1,161.5 177.4,206.4 301.1,162.1"/>
  <g class="k2"><circle cx="177.4" cy="206.4" r="2.6"/></g>
  <g class="k3"><rect x="132.8" y="188.4" width="6" height="6"/><rect x="214.8" y="174.0" width="6" height="6"/></g>
  <g class="k4"><polygon points="114.6,179.9 110.6,186.9 118.6,186.9"/><polygon points="176.5,176.0 172.5,183.0 180.5,183.0"/><polygon points="243.6,153.2 239.6,160.2 247.6,160.2"/></g>
  <circle cx="301.1" cy="162.1" r="4.2" fill="none" stroke="var(--accent,#4FB2C2)" stroke-width="1.6"/>
  <rect x="307.4" y="129.7" width="8" height="8" fill="none" stroke="var(--neg,#B98AD6)" stroke-width="1.6"/>
  <polygon points="322.3,110.1 316.3,119.1 328.3,119.1" fill="none" stroke="var(--fourth,#6E92C4)" stroke-width="1.6"/>
  <g stroke="var(--ink2,#A4B0BC)" stroke-width="1.6" fill="none">
    <circle cx="52.1" cy="161.5" r="6.2"/>
    <line x1="49.3" y1="158.7" x2="54.9" y2="164.3"/><line x1="54.9" y1="158.7" x2="49.3" y2="164.3"/>
  </g>
  <g stroke="var(--ink2,#A4B0BC)" stroke-width="1.3" fill="none">
    <circle cx="219.1" cy="221.3" r="4.6"/>
    <line x1="215.5" y1="221.3" x2="222.7" y2="221.3"/><line x1="219.1" y1="217.7" x2="219.1" y2="224.9"/>
  </g>
  <text class="ink2" x="229" y="221" font-size="8">baseline &#945;=1</text>
  <polygon points="302.4,244.6 296.4,255 308.4,255" fill="none" stroke="var(--ink2,#A4B0BC)" stroke-width="1.4"/>
  <text class="ink2" x="338" y="240" font-size="8" text-anchor="end">single &#945;=1.5</text>
  </g>

  </g>
  <!-- ===================== PANEL B: opinion rotation ===================== -->
  <g transform="translate(0,62)">
  <text class="ink2" x="16" y="274" font-size="10">&#9313; opinion rotates per sub-step</text>
  <text class="mut" x="378" y="319" text-anchor="end" font-size="8">avg cos(&#916;&#8321;,&#916;&#8320;) = 0.745</text>
  <!-- panel B plot geometry stretched x1.25 vertically about y=293 (top of value axis) -->
  <g class="nss" transform="translate(0,-73.25) scale(1,1.25)">
  <g stroke="var(--rule2,#27323D)" stroke-width="1">
    <line x1="55" y1="321.7" x2="380" y2="321.7"/>
    <line x1="55" y1="349.8" x2="380" y2="349.8"/>
    <line x1="55" y1="377.8" x2="380" y2="377.8"/>
    <line x1="55" y1="405.9" x2="380" y2="405.9"/>
  </g>
  <line x1="55" y1="289" x2="55" y2="420" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <line x1="55" y1="420" x2="380" y2="420" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  </g>
  <g class="mut" font-size="8" text-anchor="end">
    <text x="51" y="297.5">1.0</text><text x="51" y="332.6">0.9</text><text x="51" y="367.8">0.8</text><text x="51" y="402.8">0.7</text><text x="51" y="437.9">0.6</text>
  </g>
  <g class="mut" font-size="8.5" text-anchor="middle">
    <text x="55" y="464">0</text><text x="120" y="464">1</text><text x="185" y="464">2</text><text x="250" y="464">3</text><text x="315" y="464">4</text><text x="380" y="464">5</text>
  </g>
  <text x="217" y="476" text-anchor="middle" class="mut" font-size="8.5">sub-step i</text>

  <g class="nss" transform="translate(0,-73.25) scale(1,1.25)">
  <polyline class="k6" style="fill:none" stroke-width="1.6" points="55,293.6 120,306.5 185,329.8 250,355.7 315,382.6 380,408.5"/>
  <polyline class="k4" style="fill:none" stroke-width="1.6" points="55,293.6 120,318.9 185,354.6 250,389.1"/>
  <polyline class="k3" style="fill:none" stroke-width="1.6" points="55,293.6 120,332.9 185,375.6"/>
  <polyline class="k2" style="fill:none" stroke-width="1.6" points="55,293.6 120,360.5"/>
  </g>
  <!-- markers kept unscaled (true shape) at the stretched vertex y = 1.25*y - 73.25 -->
  <g class="k2"><circle cx="55" cy="293.75" r="2.6"/><circle cx="120" cy="377.375" r="2.6"/></g>
  <g class="k3"><rect x="52" y="290.75" width="6" height="6"/><rect x="117" y="339.875" width="6" height="6"/><rect x="182" y="393.25" width="6" height="6"/></g>
  <g class="k4"><polygon points="120,321.375 116,328.375 124,328.375"/><polygon points="185,366.0 181,373.0 189,373.0"/><polygon points="250,409.125 246,416.125 254,416.125"/></g>
  <g class="k6"><polygon points="120,305.875 124,309.875 120,313.875 116,309.875"/><polygon points="185,335.0 189,339.0 185,343.0 181,339.0"/><polygon points="250,367.375 254,371.375 250,375.375 246,371.375"/><polygon points="315,401.0 319,405.0 315,409.0 311,405.0"/><polygon points="380,433.375 384,437.375 380,441.375 376,437.375"/></g>

  </g>
  <!-- ===================== PANEL C: gap_frac bars ===================== -->
  <g transform="translate(0,124)">
  <text class="ink2" x="16" y="440" font-size="10">&#9314; gap grows with splitting</text>
  <!-- panel C plot geometry stretched x1.35 vertically about y=458 (top of value axis) -->
  <g class="nss" transform="translate(0,-160.3) scale(1,1.35)">
  <g stroke="var(--rule2,#27323D)" stroke-width="1">
    <line x1="55" y1="526" x2="380" y2="526"/>
    <line x1="55" y1="492" x2="380" y2="492"/>
    <line x1="55" y1="458" x2="380" y2="458"/>
  </g>
  <line x1="55" y1="454" x2="55" y2="560" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <line x1="55" y1="560" x2="380" y2="560" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  </g>
  <g class="mut" font-size="8" text-anchor="end">
    <text x="51" y="600">0</text><text x="51" y="554">.2</text><text x="51" y="508">.4</text><text x="51" y="462">.6</text>
  </g>
  <g class="nss" transform="translate(0,-160.3) scale(1,1.35)">
  <rect x="97"  y="514.4" width="22" height="45.6" fill="url(#s10HatchM)" stroke="var(--accent,#4FB2C2)" stroke-width="0.8"/>
  <rect x="121" y="499"   width="22" height="61"   fill="var(--accent,#4FB2C2)"/>
  <rect x="187" y="501.7" width="22" height="58.3" fill="url(#s10HatchM)" stroke="var(--accent,#4FB2C2)" stroke-width="0.8"/>
  <rect x="211" y="481.6" width="22" height="78.4" fill="var(--accent,#4FB2C2)"/>
  <rect x="277" y="494.9" width="22" height="65.1" fill="url(#s10HatchM)" stroke="var(--accent,#4FB2C2)" stroke-width="0.8"/>
  <rect x="301" y="469.6" width="22" height="90.4" fill="var(--accent,#4FB2C2)"/>
  </g>
  <g class="mut" font-size="8.5" text-anchor="middle">
    <text x="120" y="610">k=2</text><text x="210" y="610">k=3</text><text x="300" y="610">k=4</text>
  </g>
  <rect x="246" y="451.5" width="11" height="9" fill="url(#s10HatchM)" stroke="var(--accent,#4FB2C2)" stroke-width="0.8"/>
  <text x="261" y="459.5" class="ink2" font-size="8">&#931;&#945;=1.0</text>
  <rect x="312" y="451.5" width="11" height="9" fill="var(--accent,#4FB2C2)"/>
  <text x="327" y="459.5" class="ink2" font-size="8">&#931;&#945;=1.5</text>

  </g>
  <!-- ===================== legend + takeaway ===================== -->
  <g transform="translate(0,166)">
  <text x="16" y="596" class="mut" font-size="8">closed form: single &#8722; split = (&#931;&#945;/k)&#183;&#931;&#7522;(&#916;(x)&#8722;&#916;(x&#7522;)) &#8212; held to 1.6%</text>
  <line x1="16" y1="608" x2="384" y2="608" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <g font-size="8.5">
    <circle cx="22" cy="626" r="2.6" class="k2" stroke="none"/><text x="30" y="629" class="ink2">k2</text>
    <rect x="58" y="623" width="6" height="6" class="k3" stroke="none"/><text x="70" y="629" class="ink2">k3</text>
    <polygon points="104,623 100,630 108,630" class="k4" stroke="none"/><text x="112" y="629" class="ink2">k4</text>
    <polygon points="148,623 152,627 148,631 144,627" class="k6" stroke="none"/><text x="158" y="629" class="ink2">k6</text>
    <g stroke="var(--ink2,#A4B0BC)" stroke-width="1.4"><line x1="196" y1="626" x2="210" y2="626" stroke-dasharray="5 3"/></g>
    <polygon points="210,622.5 206,629.5 214,629.5" fill="none" stroke="var(--ink2,#A4B0BC)" stroke-width="1.2"/>
    <text x="220" y="629" class="ink2">single shove</text>
    <!-- baseline + origin share the second line -->
    <g stroke="var(--ink2,#A4B0BC)" stroke-width="1.3" fill="none"><circle cx="22" cy="646" r="4.6"/><line x1="18.4" y1="646" x2="25.6" y2="646"/><line x1="22" y1="642.4" x2="22" y2="649.6"/></g>
    <text x="32" y="649" class="ink2">baseline &#945;=1</text>
    <g stroke="var(--ink2,#A4B0BC)" stroke-width="1.5" fill="none"><circle cx="120" cy="646" r="4.6"/><line x1="116.8" y1="642.8" x2="123.2" y2="649.2"/><line x1="123.2" y1="642.8" x2="116.8" y2="649.2"/></g>
    <text x="130" y="649" class="ink2">x (L1 in) &#183; origin</text>
  </g>
  <text x="16" y="684" class="ink2" font-size="9.5">A single damped pass can only slide the residual along</text>
  <text x="16" y="698" class="ink2" font-size="9.5">&#916;(x); the split steps off it &#8212; the layer re-reads the</text>
  <text x="16" y="712" class="ink2" font-size="9.5">moved stream, landing further off with every sub-step.</text>
  </g>
</svg>
