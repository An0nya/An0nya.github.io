<svg viewBox="0 0 400 730" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
  </style>

  <rect x="0" y="0" width="400" height="730" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="20" y="32" font-size="17">Raw averages lie: the ranking</text>
  <text class="ttl" x="20" y="52" font-size="17">reorders once you normalize</text>
  <text class="mut" x="20" y="70" font-size="10">31 rank-eligible summarizers · same models, both rails</text>

  <!-- rails -->
  <line x1="120" y1="118" x2="120" y2="612" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <line x1="280" y1="118" x2="280" y2="612" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <text x="120" y="108" text-anchor="middle" class="ink2" font-size="10" letter-spacing="0.5">BY RAW MEAN</text>
  <text x="280" y="108" text-anchor="middle" class="ink2" font-size="10" letter-spacing="0.5">BY z-SCORE</text>

  <!-- muted connectors (28) -->
  <g stroke="var(--muted,#6F7C88)" stroke-width="1" opacity="0.30" fill="none">
    <line x1="120" y1="165" x2="280" y2="180"/>
    <line x1="120" y1="180" x2="280" y2="210"/>
    <line x1="120" y1="210" x2="280" y2="255"/>
    <line x1="120" y1="225" x2="280" y2="195"/>
    <line x1="120" y1="240" x2="280" y2="285"/>
    <line x1="120" y1="255" x2="280" y2="225"/>
    <line x1="120" y1="270" x2="280" y2="240"/>
    <line x1="120" y1="285" x2="280" y2="330"/>
    <line x1="120" y1="300" x2="280" y2="270"/>
    <line x1="120" y1="315" x2="280" y2="315"/>
    <line x1="120" y1="330" x2="280" y2="585"/>
    <line x1="120" y1="345" x2="280" y2="375"/>
    <line x1="120" y1="375" x2="280" y2="345"/>
    <line x1="120" y1="390" x2="280" y2="450"/>
    <line x1="120" y1="405" x2="280" y2="360"/>
    <line x1="120" y1="420" x2="280" y2="390"/>
    <line x1="120" y1="435" x2="280" y2="405"/>
    <line x1="120" y1="450" x2="280" y2="465"/>
    <line x1="120" y1="465" x2="280" y2="435"/>
    <line x1="120" y1="480" x2="280" y2="495"/>
    <line x1="120" y1="495" x2="280" y2="480"/>
    <line x1="120" y1="510" x2="280" y2="570"/>
    <line x1="120" y1="525" x2="280" y2="540"/>
    <line x1="120" y1="540" x2="280" y2="300"/>
    <line x1="120" y1="555" x2="280" y2="555"/>
    <line x1="120" y1="570" x2="280" y2="420"/>
    <line x1="120" y1="585" x2="280" y2="600"/>
    <line x1="120" y1="600" x2="280" y2="510"/>
  </g>

  <!-- rail nodes -->
  <g fill="var(--muted,#6F7C88)">
    <circle cx="120" cy="150" r="1.6"/><circle cx="120" cy="165" r="1.6"/><circle cx="120" cy="180" r="1.6"/><circle cx="120" cy="195" r="1.6"/><circle cx="120" cy="210" r="1.6"/><circle cx="120" cy="225" r="1.6"/><circle cx="120" cy="240" r="1.6"/><circle cx="120" cy="255" r="1.6"/><circle cx="120" cy="270" r="1.6"/><circle cx="120" cy="285" r="1.6"/><circle cx="120" cy="300" r="1.6"/><circle cx="120" cy="315" r="1.6"/><circle cx="120" cy="330" r="1.6"/><circle cx="120" cy="345" r="1.6"/><circle cx="120" cy="360" r="1.6"/><circle cx="120" cy="375" r="1.6"/><circle cx="120" cy="390" r="1.6"/><circle cx="120" cy="405" r="1.6"/><circle cx="120" cy="420" r="1.6"/><circle cx="120" cy="435" r="1.6"/><circle cx="120" cy="450" r="1.6"/><circle cx="120" cy="465" r="1.6"/><circle cx="120" cy="480" r="1.6"/><circle cx="120" cy="495" r="1.6"/><circle cx="120" cy="510" r="1.6"/><circle cx="120" cy="525" r="1.6"/><circle cx="120" cy="540" r="1.6"/><circle cx="120" cy="555" r="1.6"/><circle cx="120" cy="570" r="1.6"/><circle cx="120" cy="585" r="1.6"/><circle cx="120" cy="600" r="1.6"/>
    <circle cx="280" cy="150" r="1.6"/><circle cx="280" cy="165" r="1.6"/><circle cx="280" cy="180" r="1.6"/><circle cx="280" cy="195" r="1.6"/><circle cx="280" cy="210" r="1.6"/><circle cx="280" cy="225" r="1.6"/><circle cx="280" cy="240" r="1.6"/><circle cx="280" cy="255" r="1.6"/><circle cx="280" cy="270" r="1.6"/><circle cx="280" cy="285" r="1.6"/><circle cx="280" cy="300" r="1.6"/><circle cx="280" cy="315" r="1.6"/><circle cx="280" cy="330" r="1.6"/><circle cx="280" cy="345" r="1.6"/><circle cx="280" cy="360" r="1.6"/><circle cx="280" cy="375" r="1.6"/><circle cx="280" cy="390" r="1.6"/><circle cx="280" cy="405" r="1.6"/><circle cx="280" cy="420" r="1.6"/><circle cx="280" cy="435" r="1.6"/><circle cx="280" cy="450" r="1.6"/><circle cx="280" cy="465" r="1.6"/><circle cx="280" cy="480" r="1.6"/><circle cx="280" cy="495" r="1.6"/><circle cx="280" cy="510" r="1.6"/><circle cx="280" cy="525" r="1.6"/><circle cx="280" cy="540" r="1.6"/><circle cx="280" cy="555" r="1.6"/><circle cx="280" cy="570" r="1.6"/><circle cx="280" cy="585" r="1.6"/><circle cx="280" cy="600" r="1.6"/>
  </g>

  <!-- TOP anchor: #1 -> #1 -->
  <line x1="120" y1="150" x2="280" y2="150" stroke="var(--cause,#E3C24A)" stroke-width="1.5" opacity="0.75" stroke-dasharray="2 3"/>
  <text x="286" y="153" class="mut" font-size="8.5">#1→#1</text>

  <!-- PLUNGE: os-auto-thinking #4 -> #26 -->
  <line x1="120" y1="195" x2="280" y2="525" stroke="var(--neg,#B98AD6)" stroke-width="2.6" stroke-dasharray="7 4"/>
  <circle cx="120" cy="195" r="4.6" fill="var(--bg,#0E141A)" stroke="var(--neg,#B98AD6)" stroke-width="2"/>
  <circle cx="280" cy="525" r="4.6" fill="var(--bg,#0E141A)" stroke="var(--neg,#B98AD6)" stroke-width="2"/>
  <text x="112" y="198" text-anchor="end" font-size="11" fill="var(--neg,#B98AD6)">#4</text>
  <text x="288" y="528" font-size="11" fill="var(--neg,#B98AD6)">#26</text>

  <!-- CLIMB: iq2-m #15 -> #2 -->
  <line x1="120" y1="360" x2="280" y2="165" stroke="var(--accent,#4FB2C2)" stroke-width="2.6"/>
  <polygon points="120,354.5 115.2,363 124.8,363" fill="var(--accent,#4FB2C2)"/>
  <polygon points="280,159.5 275.2,168 284.8,168" fill="var(--accent,#4FB2C2)"/>
  <text x="112" y="363" text-anchor="end" font-size="11" fill="var(--accent,#4FB2C2)">#15</text>
  <text x="288" y="168" font-size="11" fill="var(--accent,#4FB2C2)">#2</text>

  <!-- callout (names out of the gutters) -->
  <g transform="translate(20,648)">
    <line x1="0" y1="-3" x2="24" y2="-3" stroke="var(--neg,#B98AD6)" stroke-width="2.4" stroke-dasharray="7 4"/>
    <circle cx="12" cy="-3" r="4" fill="var(--bg,#0E141A)" stroke="var(--neg,#B98AD6)" stroke-width="2"/>
    <text x="32" y="0" font-size="9.5" fill="var(--neg,#B98AD6)">qwen35-9b-os-auto-thinking</text>
    <text x="32" y="12" class="mut" font-size="9">#4 → #26 · n=7, easy mix</text>
  </g>
  <g transform="translate(20,684)">
    <line x1="0" y1="-3" x2="24" y2="-3" stroke="var(--accent,#4FB2C2)" stroke-width="2.4"/>
    <polygon points="12,-8 7.2,0 16.8,0" fill="var(--accent,#4FB2C2)"/>
    <text x="32" y="0" font-size="9.5" fill="var(--accent,#4FB2C2)">qwen3-6-27b-iq2-m</text>
    <text x="32" y="12" class="mut" font-size="9">#15 → #2 · n=10, harder mix · 2-bit</text>
  </g>

  <text x="20" y="712" class="ink2" font-size="9.5">Bigger cross = the raw average was lying harder.</text>
</svg>
