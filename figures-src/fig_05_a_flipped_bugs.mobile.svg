<svg viewBox="0 0 400 720" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>Capability is a few flipped bugs, not a risen tide</title>
  <desc>A per-probe strip: each metastable math probe's baseline rate, stuck at deterministic failure, beside its best fixer's rate, next to a log bar of how many configs fix that probe. The counts split bimodally — easy probes fixed by many configs, rare-fix specialists by only a handful — so capability moves as discrete bug-flips that a probe-set average hides.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
  </style>

  <rect x="0" y="0" width="400" height="720" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="20" y="32" font-size="18">Capability is a few flipped</text>
  <text class="ttl" x="20" y="54" font-size="18">bugs, not a risen tide</text>
  <text class="mut" x="20" y="74" font-size="9">Granite-4.1-3B · no-CoT math, strict per-probe success.</text>
  <text class="mut" x="20" y="88" font-size="9">The baseline fails certain probes every run; a winning</text>
  <text class="mut" x="20" y="102" font-size="9">surgery flips a few. The 49-probe average hides it.</text>

  <!-- ============ PANEL 1: flip strip ============ -->
  <text x="20" y="128" class="ink2" font-size="10.5">broken ○ → flipped ●  (strict success)</text>
  <line x1="130" y1="140" x2="130" y2="298" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <line x1="300" y1="140" x2="300" y2="298" stroke="var(--rule2,#27323D)" stroke-width="1" stroke-dasharray="2 3" opacity="0.7"/>

  <g font-size="9">
    <!-- r1 add_d3_05 8/15 -> 12/12 -->
    <text x="20" y="153" class="mut">add_d3_05</text>
    <line x1="220.7" y1="150" x2="295" y2="150" stroke="var(--cause,#E3C24A)" stroke-width="1.4" opacity="0.55"/>
    <polygon points="300,150 293,147 293,153" fill="var(--cause,#E3C24A)" opacity="0.7"/>
    <circle cx="220.7" cy="150" r="3.2" fill="var(--bg,#0E141A)" stroke="var(--muted,#6F7C88)" stroke-width="1.6"/>
    <circle cx="300" cy="150" r="3.4" fill="var(--accent,#4FB2C2)" stroke="var(--accent,#4FB2C2)"/>
    <!-- r2 div_1x2_01 6/15 -> 12/12 -->
    <text x="20" y="173" class="mut">div_1x2_01</text>
    <line x1="198" y1="170" x2="295" y2="170" stroke="var(--cause,#E3C24A)" stroke-width="1.4" opacity="0.55"/>
    <polygon points="300,170 293,167 293,173" fill="var(--cause,#E3C24A)" opacity="0.7"/>
    <circle cx="198" cy="170" r="3.2" fill="var(--bg,#0E141A)" stroke="var(--muted,#6F7C88)" stroke-width="1.6"/>
    <circle cx="300" cy="170" r="3.4" fill="var(--accent,#4FB2C2)" stroke="var(--accent,#4FB2C2)"/>
    <!-- r3 div_1x2_06 0 -> 11/12 -->
    <text x="20" y="193" class="mut">div_1x2_06</text>
    <line x1="135" y1="190" x2="280.8" y2="190" stroke="var(--cause,#E3C24A)" stroke-width="1.4" opacity="0.55"/>
    <polygon points="285.8,190 278.8,187 278.8,193" fill="var(--cause,#E3C24A)" opacity="0.7"/>
    <circle cx="130" cy="190" r="3.2" fill="var(--bg,#0E141A)" stroke="var(--muted,#6F7C88)" stroke-width="1.6"/>
    <circle cx="285.8" cy="190" r="3.4" fill="var(--accent,#4FB2C2)" stroke="var(--accent,#4FB2C2)"/>
    <!-- r4 add_d3_02 0 -> 11/12 -->
    <text x="20" y="213" class="mut">add_d3_02</text>
    <line x1="135" y1="210" x2="280.8" y2="210" stroke="var(--cause,#E3C24A)" stroke-width="1.4" opacity="0.55"/>
    <polygon points="285.8,210 278.8,207 278.8,213" fill="var(--cause,#E3C24A)" opacity="0.7"/>
    <circle cx="130" cy="210" r="3.2" fill="var(--bg,#0E141A)" stroke="var(--muted,#6F7C88)" stroke-width="1.6"/>
    <circle cx="285.8" cy="210" r="3.4" fill="var(--accent,#4FB2C2)" stroke="var(--accent,#4FB2C2)"/>
    <!-- r5 mul_2x1_06 0 -> 11/12 -->
    <text x="20" y="233" class="mut">mul_2x1_06</text>
    <line x1="135" y1="230" x2="280.8" y2="230" stroke="var(--cause,#E3C24A)" stroke-width="1.4" opacity="0.55"/>
    <polygon points="285.8,230 278.8,227 278.8,233" fill="var(--cause,#E3C24A)" opacity="0.7"/>
    <circle cx="130" cy="230" r="3.2" fill="var(--bg,#0E141A)" stroke="var(--muted,#6F7C88)" stroke-width="1.6"/>
    <circle cx="285.8" cy="230" r="3.4" fill="var(--accent,#4FB2C2)" stroke="var(--accent,#4FB2C2)"/>
    <!-- r6 sub_d3_00 0 -> 12/12 HEADLINE -->
    <text x="18" y="253" fill="var(--cause,#E3C24A)" text-anchor="end" font-size="8.5">◆</text>
    <text x="22" y="253" fill="var(--ink2,#A4B0BC)">sub_d3_00</text>
    <line x1="135" y1="250" x2="295" y2="250" stroke="var(--cause,#E3C24A)" stroke-width="1.6"/>
    <polygon points="300,250 293,247 293,253" fill="var(--cause,#E3C24A)"/>
    <circle cx="130" cy="250" r="3.4" fill="var(--bg,#0E141A)" stroke="var(--muted,#6F7C88)" stroke-width="1.8"/>
    <circle cx="300" cy="250" r="3.8" fill="var(--accent,#4FB2C2)" stroke="var(--accent,#4FB2C2)"/>
    <!-- r7 mul_2x1_02 0 -> 8/12 -->
    <text x="18" y="273" fill="var(--cause,#E3C24A)" text-anchor="end" font-size="8.5">◆</text>
    <text x="22" y="273" fill="var(--ink2,#A4B0BC)">mul_2x1_02</text>
    <line x1="135" y1="270" x2="238.3" y2="270" stroke="var(--cause,#E3C24A)" stroke-width="1.6"/>
    <polygon points="243.3,270 236.3,267 236.3,273" fill="var(--cause,#E3C24A)"/>
    <circle cx="130" cy="270" r="3.4" fill="var(--bg,#0E141A)" stroke="var(--muted,#6F7C88)" stroke-width="1.8"/>
    <circle cx="243.3" cy="270" r="3.8" fill="var(--accent,#4FB2C2)" stroke="var(--accent,#4FB2C2)"/>
    <!-- r8 mul_2x2_01 stretch 0 -> 9/12 -->
    <text x="18" y="293" fill="var(--cause,#E3C24A)" text-anchor="end" font-size="8.5">◆</text>
    <text x="22" y="293" fill="var(--ink2,#A4B0BC)">mul_2x2_01</text>
    <text x="96" y="293" class="mut" font-size="7">str</text>
    <line x1="135" y1="290" x2="252.5" y2="290" stroke="var(--cause,#E3C24A)" stroke-width="1.6"/>
    <polygon points="257.5,290 250.5,287 250.5,293" fill="var(--cause,#E3C24A)"/>
    <circle cx="130" cy="290" r="3.4" fill="var(--bg,#0E141A)" stroke="var(--muted,#6F7C88)" stroke-width="1.8"/>
    <circle cx="257.5" cy="290" r="3.8" fill="var(--accent,#4FB2C2)" stroke="var(--accent,#4FB2C2)"/>
  </g>
  <g class="mut" font-size="8.5" text-anchor="middle">
    <text x="130" y="311">0%</text><text x="215" y="311">50%</text><text x="300" y="311">100%</text>
  </g>

  <!-- ============ PANEL 2: fix-count bars (log) ============ -->
  <text x="20" y="346" class="ink2" font-size="10.5"># configs that reach it</text>
  <g stroke="var(--rule2,#27323D)" stroke-width="1" stroke-dasharray="2 3" opacity="0.6">
    <line x1="130" y1="356" x2="130" y2="510"/>
    <line x1="220.4" y1="356" x2="220.4" y2="510"/>
    <line x1="310.8" y1="356" x2="310.8" y2="510"/>
  </g>

  <g font-size="9">
    <!-- bars: start x130, height 8, rows step 19 from y364 -->
    <text x="20" y="371" class="mut">add_d3_05</text>
    <rect x="130" y="364.5" width="207.4" height="8" fill="var(--fourth,#6E92C4)" opacity="0.85"/><text x="342" y="372" class="mut">197</text>
    <text x="20" y="390" class="mut">div_1x2_01</text>
    <rect x="130" y="383.5" width="175.4" height="8" fill="var(--fourth,#6E92C4)" opacity="0.85"/><text x="310" y="391" class="mut">87</text>
    <text x="20" y="409" class="mut">div_1x2_06</text>
    <rect x="130" y="402.5" width="106.3" height="8" fill="var(--fourth,#6E92C4)" opacity="0.85"/><text x="241" y="410" class="mut">15</text>
    <text x="20" y="428" class="mut">add_d3_02</text>
    <rect x="130" y="421.5" width="100.7" height="8" fill="var(--fourth,#6E92C4)" opacity="0.85"/><text x="235" y="429" class="mut">13</text>
    <text x="20" y="447" class="mut">mul_2x1_06</text>
    <rect x="130" y="440.5" width="100.7" height="8" fill="var(--fourth,#6E92C4)" opacity="0.85"/><text x="235" y="448" class="mut">13</text>
    <text x="22" y="466" fill="var(--ink2,#A4B0BC)">sub_d3_00</text><text x="18" y="466" fill="var(--cause,#E3C24A)" text-anchor="end" font-size="8.5">◆</text>
    <rect x="130" y="459.5" width="76.4" height="8" fill="var(--cause,#E3C24A)" opacity="0.85"/><text x="211" y="467" fill="var(--cause,#E3C24A)">7</text>
    <text x="22" y="485" fill="var(--ink2,#A4B0BC)">mul_2x1_02</text><text x="18" y="485" fill="var(--cause,#E3C24A)" text-anchor="end" font-size="8.5">◆</text>
    <rect x="130" y="478.5" width="43.1" height="8" fill="var(--cause,#E3C24A)" opacity="0.85"/><text x="178" y="486" fill="var(--cause,#E3C24A)">3</text>
    <text x="22" y="504" fill="var(--ink2,#A4B0BC)">mul_2x2_01</text><text x="18" y="504" fill="var(--cause,#E3C24A)" text-anchor="end" font-size="8.5">◆</text>
    <rect x="130" y="497.5" width="27.2" height="8" fill="var(--cause,#E3C24A)" opacity="0.85"/><text x="162" y="505" fill="var(--cause,#E3C24A)">2</text>
  </g>
  <g class="mut" font-size="8.5" text-anchor="middle">
    <text x="130" y="522">1</text><text x="220.4" y="522">10</text><text x="310.8" y="522">100</text>
    <text x="240" y="534" letter-spacing="0.5">configs (log) · ◆ rare-fix specialist</text>
  </g>

  <!-- ============ headline callout: the real 907−131 bug ============ -->
  <rect x="20" y="552" width="360" height="70" rx="4" fill="none" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <text x="32" y="572" class="ink2" font-size="10"><tspan font-family="var(--font-mono)">907 − 131 = 776</tspan>, but the baseline never reaches it:</text>
  <text x="32" y="587" class="mut" font-size="9.5">it lands on <tspan fill="var(--neg,#B98AD6)">676</tspan> (9/15, hundreds-column slip) or <tspan fill="var(--neg,#B98AD6)">131</tspan> (6/15,</text>
  <text x="32" y="601" class="mut" font-size="9.5">echoes the subtrahend) — 0/15 correct, two error basins.</text>
  <text x="32" y="615" class="mut" font-size="9.5"><tspan fill="var(--cause,#E3C24A)">dampall_a120</tspan> snaps it to 776 on 12/12.</text>

  <!-- caption -->
  <text x="20" y="644" class="ink2" font-size="11">The action is discrete bug-flips, not a diffuse lift.</text>
  <text x="20" y="660" class="ink2" font-size="11">Fix-counts are <tspan fill="var(--cause,#E3C24A)">bimodal</tspan>: of 14 swing probes, 9 are</text>
  <text x="20" y="676" class="ink2" font-size="11">easy (≤21 configs) and 5 trivial (≥87) — nothing lands</text>
  <text x="20" y="692" class="ink2" font-size="11">between. The rare-fix probes are the genuine disjoint</text>
  <text x="20" y="708" class="ink2" font-size="11">specialists — what makes composition possible.</text>
</svg>
