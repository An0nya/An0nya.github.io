<svg viewBox="0 0 400 450" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .acc  { fill: var(--accent,#4FB2C2); }
    .cit  { fill: var(--cause,#E3C24A); }
    .vio  { fill: var(--neg,#B98AD6); }
    .sla  { fill: var(--fourth,#6E92C4); }
    .accs { stroke: var(--accent,#4FB2C2); fill:none; }
    .cits { stroke: var(--cause,#E3C24A); fill:none; }
    .vios { stroke: var(--neg,#B98AD6); fill:none; }
    .slas { stroke: var(--fourth,#6E92C4); fill:none; }
    .rule { stroke: var(--rule2,#27323D); }
    .axis { stroke: var(--ink2,#A4B0BC); }
  </style>
  <rect x="0" y="0" width="400" height="450" fill="var(--bg2,#141D26)"/>
<text class="ttl" x="40" y="24" font-size="15">The baseline saturation map</text>
<text class="mut" x="40" y="40" font-size="8">A channel can only measure what its baseline leaves room to measure</text>
<rect x="216.0" y="64" width="72.0" height="286" fill="var(--accent,#4FB2C2)" opacity="0.08"/>
<text x="252.0" y="58" text-anchor="middle" class="acc" font-size="8.5">usable band 0.4–0.7</text>
<line x1="120" y1="90" x2="360" y2="90" class="rule" stroke-width="1"/>
<text x="110" y="94" text-anchor="end" class="ink2" font-size="9.5">math-strict</text>
<circle cx="129.6" cy="90" r="5.5" fill="var(--bg,#0E141A)" stroke="var(--cause,#E3C24A)" stroke-width="2.2"/>
<text x="141.6" y="94" text-anchor="start" class="mut" font-size="8.0">0.04 · floored — dead</text>
<line x1="120" y1="168" x2="360" y2="168" class="rule" stroke-width="1"/>
<text x="110" y="172" text-anchor="end" class="ink2" font-size="9.5">multiple-choice</text>
<circle cx="352.8" cy="168" r="5.5" fill="var(--bg,#0E141A)" stroke="var(--neg,#B98AD6)" stroke-width="2.2"/>
<text x="340.8" y="172" text-anchor="end" class="mut" font-size="8.0">0.97 · ceilinged — damage only</text>
<line x1="120" y1="246" x2="360" y2="246" class="rule" stroke-width="1"/>
<text x="110" y="250" text-anchor="end" class="ink2" font-size="9.5">EQ</text>
<line x1="168.7" y1="246" x2="301.7" y2="246" class="vios" stroke-width="2.4" opacity="0.8"/>
<line x1="168.7" y1="241" x2="168.7" y2="251" class="vios" stroke-width="1.6"/><line x1="301.7" y1="241" x2="301.7" y2="251" class="vios" stroke-width="1.6"/>
<polygon points="235.2,241 240.2,246 235.2,251 230.2,246" class="vio"/>
<text x="309.7" y="250" class="vio" font-size="8.0">σ=0.277 · live,</text>
<text x="309.7" y="260" class="vio" font-size="8.0">but dirtiest</text>
<line x1="120" y1="324" x2="360" y2="324" class="rule" stroke-width="1"/>
<text x="110" y="328" text-anchor="end" class="ink2" font-size="9.5">easy-math</text>
<circle cx="235.2" cy="324" r="5.5" fill="var(--bg,#0E141A)" stroke="var(--accent,#4FB2C2)" stroke-width="2.2"/>
<text x="247.2" y="328" text-anchor="start" class="mut" font-size="8.0">0.48 · the usable channel</text>
<line x1="120" y1="368" x2="360" y2="368" class="axis" stroke-width="1"/>
<text x="120.0" y="384" text-anchor="middle" class="mut" font-size="8.5">0.0</text>
<text x="240.0" y="384" text-anchor="middle" class="mut" font-size="8.5">0.5</text>
<text x="360.0" y="384" text-anchor="middle" class="mut" font-size="8.5">1.0</text>
<text x="240" y="400" text-anchor="middle" class="ink2" font-size="8.5">baseline pass-rate</text>
<line x1="40" y1="390" x2="360" y2="390" class="rule" stroke-width="1"/>
<text x="40" y="418" class="ink2" font-size="9">Only <tspan class="acc">EQ &amp; easy-math</tspan> sit where a score can move,</text>
<text x="40" y="430" class="ink2" font-size="9">strict is floored, MC ceilinged.</text>
</svg>
