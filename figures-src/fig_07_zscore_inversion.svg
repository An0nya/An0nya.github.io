<svg viewBox="0 0 720 600" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>Why raw averages lie</title>
  <desc>Connectors ranked by raw mean fact-recall on the left, where overlapping error bars leave the order muddy because each model saw a differently-hard session mix, and by per-session z-score on the right, which normalizes out session difficulty and sharpens the ranking. Two connectors cross hardest between the two views — os-auto-thinking falling from raw #4 to z #26, and iq2-m rising from #15 to #2.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
  </style>

  <rect x="0" y="0" width="720" height="600" fill="var(--bg2,#141D26)"/>

  <!-- title + dek -->
  <text class="ttl" x="40" y="34" font-size="18">Raw averages are an illusion: the ranking reorders once difficulty is normalized</text>
  <text class="mut" x="40" y="55" font-size="11">31 rank-eligible summarizers · left rail = raw mean fact-recall · right rail = per-session z-score</text>

  <!-- rails -->
  <line x1="210" y1="78" x2="210" y2="552" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <line x1="510" y1="78" x2="510" y2="552" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <text x="210" y="72" text-anchor="middle" class="ink2" font-size="10.5" letter-spacing="1.2">RANKED BY RAW MEAN</text>
  <text x="510" y="72" text-anchor="middle" class="ink2" font-size="10.5" letter-spacing="1.2">RANKED BY z-SCORE</text>
  <text x="210" y="568" text-anchor="middle" class="mut" font-size="9" letter-spacing="0.5">the naive chart</text>
  <text x="510" y="568" text-anchor="middle" class="mut" font-size="9" letter-spacing="0.5">the normalized chart</text>

  <!-- muted connectors (29 of 31) -->
  <g stroke="var(--muted,#6F7C88)" stroke-width="1" opacity="0.30" fill="none">
    <line x1="210" y1="105" x2="510" y2="120"/>
    <line x1="210" y1="120" x2="510" y2="150"/>
    <line x1="210" y1="150" x2="510" y2="195"/>
    <line x1="210" y1="165" x2="510" y2="135"/>
    <line x1="210" y1="180" x2="510" y2="225"/>
    <line x1="210" y1="195" x2="510" y2="165"/>
    <line x1="210" y1="210" x2="510" y2="180"/>
    <line x1="210" y1="225" x2="510" y2="270"/>
    <line x1="210" y1="240" x2="510" y2="210"/>
    <line x1="210" y1="255" x2="510" y2="255"/>
    <line x1="210" y1="270" x2="510" y2="525"/>
    <line x1="210" y1="285" x2="510" y2="315"/>
    <line x1="210" y1="315" x2="510" y2="285"/>
    <line x1="210" y1="330" x2="510" y2="390"/>
    <line x1="210" y1="345" x2="510" y2="300"/>
    <line x1="210" y1="360" x2="510" y2="330"/>
    <line x1="210" y1="375" x2="510" y2="345"/>
    <line x1="210" y1="390" x2="510" y2="405"/>
    <line x1="210" y1="405" x2="510" y2="375"/>
    <line x1="210" y1="420" x2="510" y2="435"/>
    <line x1="210" y1="435" x2="510" y2="420"/>
    <line x1="210" y1="450" x2="510" y2="510"/>
    <line x1="210" y1="465" x2="510" y2="480"/>
    <line x1="210" y1="480" x2="510" y2="240"/>
    <line x1="210" y1="495" x2="510" y2="495"/>
    <line x1="210" y1="510" x2="510" y2="360"/>
    <line x1="210" y1="525" x2="510" y2="540"/>
    <line x1="210" y1="540" x2="510" y2="450"/>
  </g>

  <!-- rail nodes -->
  <g fill="var(--muted,#6F7C88)">
    <circle cx="210" cy="90" r="1.6"/><circle cx="210" cy="105" r="1.6"/><circle cx="210" cy="120" r="1.6"/><circle cx="210" cy="135" r="1.6"/><circle cx="210" cy="150" r="1.6"/><circle cx="210" cy="165" r="1.6"/><circle cx="210" cy="180" r="1.6"/><circle cx="210" cy="195" r="1.6"/><circle cx="210" cy="210" r="1.6"/><circle cx="210" cy="225" r="1.6"/><circle cx="210" cy="240" r="1.6"/><circle cx="210" cy="255" r="1.6"/><circle cx="210" cy="270" r="1.6"/><circle cx="210" cy="285" r="1.6"/><circle cx="210" cy="300" r="1.6"/><circle cx="210" cy="315" r="1.6"/><circle cx="210" cy="330" r="1.6"/><circle cx="210" cy="345" r="1.6"/><circle cx="210" cy="360" r="1.6"/><circle cx="210" cy="375" r="1.6"/><circle cx="210" cy="390" r="1.6"/><circle cx="210" cy="405" r="1.6"/><circle cx="210" cy="420" r="1.6"/><circle cx="210" cy="435" r="1.6"/><circle cx="210" cy="450" r="1.6"/><circle cx="210" cy="465" r="1.6"/><circle cx="210" cy="480" r="1.6"/><circle cx="210" cy="495" r="1.6"/><circle cx="210" cy="510" r="1.6"/><circle cx="210" cy="525" r="1.6"/><circle cx="210" cy="540" r="1.6"/>
    <circle cx="510" cy="90" r="1.6"/><circle cx="510" cy="105" r="1.6"/><circle cx="510" cy="120" r="1.6"/><circle cx="510" cy="135" r="1.6"/><circle cx="510" cy="150" r="1.6"/><circle cx="510" cy="165" r="1.6"/><circle cx="510" cy="180" r="1.6"/><circle cx="510" cy="195" r="1.6"/><circle cx="510" cy="210" r="1.6"/><circle cx="510" cy="225" r="1.6"/><circle cx="510" cy="240" r="1.6"/><circle cx="510" cy="255" r="1.6"/><circle cx="510" cy="270" r="1.6"/><circle cx="510" cy="285" r="1.6"/><circle cx="510" cy="300" r="1.6"/><circle cx="510" cy="315" r="1.6"/><circle cx="510" cy="330" r="1.6"/><circle cx="510" cy="345" r="1.6"/><circle cx="510" cy="360" r="1.6"/><circle cx="510" cy="375" r="1.6"/><circle cx="510" cy="390" r="1.6"/><circle cx="510" cy="405" r="1.6"/><circle cx="510" cy="420" r="1.6"/><circle cx="510" cy="435" r="1.6"/><circle cx="510" cy="450" r="1.6"/><circle cx="510" cy="465" r="1.6"/><circle cx="510" cy="480" r="1.6"/><circle cx="510" cy="495" r="1.6"/><circle cx="510" cy="510" r="1.6"/><circle cx="510" cy="525" r="1.6"/><circle cx="510" cy="540" r="1.6"/>
  </g>

  <!-- TOP anchor: #1 -> #1 stable -->
  <line x1="210" y1="90" x2="510" y2="90" stroke="var(--cause,#E3C24A)" stroke-width="1.5" opacity="0.75" stroke-dasharray="2 3"/>
  <text x="516" y="93" class="mut" font-size="9">#1 → #1  top stays put</text>

  <!-- PLUNGE: os-auto-thinking  raw#4 -> z#26 (violet, dashed, circle markers) -->
  <line x1="210" y1="135" x2="510" y2="465" stroke="var(--neg,#B98AD6)" stroke-width="2.6" stroke-dasharray="7 4"/>
  <circle cx="210" cy="135" r="4.6" fill="var(--bg,#0E141A)" stroke="var(--neg,#B98AD6)" stroke-width="2"/>
  <circle cx="510" cy="465" r="4.6" fill="var(--bg,#0E141A)" stroke="var(--neg,#B98AD6)" stroke-width="2"/>
  <text x="201" y="132" text-anchor="end" font-size="11" fill="var(--neg,#B98AD6)">qwen35-9b-os-auto-thinking</text>
  <text x="201" y="146" text-anchor="end" class="mut" font-size="9">#4 raw · n=7, easy mix</text>
  <text x="519" y="463" font-size="13" fill="var(--neg,#B98AD6)">#26 z</text>
  <text x="519" y="476" class="mut" font-size="9">difficulty normalized out</text>

  <!-- CLIMB: iq2-m  raw#15 -> z#2 (cyan, solid, triangle markers) -->
  <line x1="210" y1="300" x2="510" y2="105" stroke="var(--accent,#4FB2C2)" stroke-width="2.6"/>
  <polygon points="210,294.5 205.2,303 214.8,303" fill="var(--accent,#4FB2C2)"/>
  <polygon points="510,99.5 505.2,108 514.8,108" fill="var(--accent,#4FB2C2)"/>
  <text x="201" y="297" text-anchor="end" font-size="11" fill="var(--accent,#4FB2C2)">qwen3-6-27b-iq2-m</text>
  <text x="201" y="311" text-anchor="end" class="mut" font-size="9">#15 raw · n=10, harder mix · 2-bit</text>
  <text x="519" y="110" font-size="13" fill="var(--accent,#4FB2C2)">#2 z</text>
  <text x="519" y="124" class="mut" font-size="9">real margin shows on hard sessions</text>

  <!-- takeaway -->
  <text x="40" y="588" class="ink2" font-size="10.5">Crossing lines are rank inversions — the steeper the cross, the more the raw average was lying.</text>
</svg>
