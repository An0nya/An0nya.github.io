<svg viewBox="0 0 720 496" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>One law, two models, the predicted downshift</title>
  <desc>A two-panel Σα-response for MiniCPM5 and Granite on identical axes, each an inverted-U with its peak annotated — near 1.25 for MiniCPM5 and 0.75 for Granite — and a vertical guide marking the leftward shift. Granite's lower residual multiplier is carried as the cause named in advance, and the shared crater zone past Σα ≥ 3 is marked.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
  </style>

  <defs>
    <pattern id="crater" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--neg,#B98AD6)" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="720" height="496" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="40" y="32" font-size="18">One law, two models — the Σα peak shifts left, predicted in advance</text>
  <text class="mut" x="40" y="52" font-size="11">x = Σα (cumulative per-pass damping dose) · y = math Δ vs baseline · identical axes</text>
  <text class="mut" x="40" y="66" font-size="10">curve = response-law shape; the peak location and its leftward shift are the measured result</text>

  <!-- plot body shifted down to open breathing room under the header -->
  <g transform="translate(0,26)">

  <!-- ============ LEFT PANEL: MiniCPM5 ============ -->
  <text x="70" y="78" class="ink2" font-size="12" letter-spacing="0.5">MiniCPM5-1B · 24L dense</text>
  <!-- crater zone Σα>=3 -->
  <rect x="308.2" y="80" width="31.8" height="220" fill="url(#crater)"/>
  <rect x="308.2" y="80" width="31.8" height="220" fill="none" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <!-- baseline Δ=0 -->
  <line x1="70" y1="190" x2="340" y2="190" stroke="var(--rule2,#27323D)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="66" y="193" text-anchor="end" class="mut" font-size="9">0</text>
  <!-- y axis -->
  <line x1="70" y1="80" x2="70" y2="300" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <!-- x ticks -->
  <g class="mut" font-size="9" text-anchor="middle">
    <text x="70" y="315">0</text><text x="149.4" y="315">1</text><text x="228.8" y="315">2</text><text x="308.2" y="315">3</text>
    <text x="205" y="333" letter-spacing="1">Σα →</text>
  </g>
  <!-- peak guide -->
  <line x1="169.3" y1="98.3" x2="169.3" y2="300" stroke="var(--cause,#E3C24A)" stroke-width="1.3" stroke-dasharray="4 3" opacity="0.85"/>
  <text x="169.3" y="95" text-anchor="middle" font-size="10.5" fill="var(--cause,#E3C24A)">Σα ≈ 1.25</text>
  <!-- response curve: Catmull-Rom through the markers, horizontal apex -->
  <path d="M70,190 C76.62,181.6 93.15,154.88 109.7,139.6 C126.25,124.32 149.45,98.3 169.3,98.3 C189.15,98.3 205.65,115.92 228.8,139.6 C251.95,163.28 289.67,218.25 308.2,240.4 C326.73,262.55 334.7,267.15 340,272.5"
        fill="none" stroke="var(--accent,#4FB2C2)" stroke-width="2.4"/>
  <g fill="var(--bg,#0E141A)" stroke="var(--accent,#4FB2C2)" stroke-width="1.8">
    <circle cx="109.7" cy="139.6" r="3.2"/><circle cx="169.3" cy="98.3" r="3.6"/><circle cx="228.8" cy="139.6" r="3.2"/><circle cx="308.2" cy="240.4" r="3.2"/>
  </g>
  <text x="312" y="228" font-size="9" fill="var(--neg,#B98AD6)">craters ≥3</text>

  <!-- ============ RIGHT PANEL: Granite ============ -->
  <text x="420" y="78" class="ink2" font-size="12" letter-spacing="0.5">Granite-4.1-3B · 40L dense</text>
  <rect x="658.2" y="80" width="31.8" height="220" fill="url(#crater)"/>
  <rect x="658.2" y="80" width="31.8" height="220" fill="none" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <line x1="420" y1="190" x2="690" y2="190" stroke="var(--rule2,#27323D)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="416" y="193" text-anchor="end" class="mut" font-size="9">0</text>
  <line x1="420" y1="80" x2="420" y2="300" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <g class="mut" font-size="9" text-anchor="middle">
    <text x="420" y="315">0</text><text x="499.4" y="315">1</text><text x="578.8" y="315">2</text><text x="658.2" y="315">3</text>
    <text x="555" y="333" letter-spacing="1">Σα →</text>
  </g>
  <!-- ghost guide at 1.25 to show the leftward move -->
  <line x1="519.4" y1="120" x2="519.4" y2="300" stroke="var(--muted,#6F7C88)" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
  <text x="574.4" y="268" text-anchor="middle" class="mut" font-size="8.5">← MiniCPM peak (1.25)</text>
  <!-- peak guide -->
  <line x1="479.6" y1="133.2" x2="479.6" y2="300" stroke="var(--cause,#E3C24A)" stroke-width="1.3" stroke-dasharray="4 3" opacity="0.85"/>
  <text x="479.6" y="105" text-anchor="middle" font-size="10.5" fill="var(--cause,#E3C24A)">Σα ≈ 0.75</text>
  <!-- leftward-shift arrow -->
  <line x1="515" y1="132" x2="487" y2="132" stroke="var(--cause,#E3C24A)" stroke-width="1.3"/>
  <polygon points="483,132 490,128.5 490,135.5" fill="var(--cause,#E3C24A)"/>
  <!-- response curve: Catmull-Rom through the markers, dashed, horizontal apex -->
  <path d="M420,190 C425.3,183.58 441.87,160.97 451.8,151.5 C461.73,142.03 463.72,133.2 479.6,133.2 C495.48,133.2 523.95,172.9 547.1,190 C570.25,207.1 594.68,222.82 618.5,235.8 C642.32,248.78 678.08,262.55 690,267.9"
        fill="none" stroke="var(--accent,#4FB2C2)" stroke-width="2.4" stroke-dasharray="8 4"/>
  <g fill="var(--bg,#0E141A)" stroke="var(--accent,#4FB2C2)" stroke-width="1.8">
    <rect x="448.6" y="148.3" width="6.4" height="6.4"/><rect x="476.4" y="130" width="6.4" height="6.4"/><rect x="543.9" y="186.8" width="6.4" height="6.4"/><rect x="615.3" y="232.6" width="6.4" height="6.4"/>
  </g>
  <text x="662" y="248" font-size="9" fill="var(--neg,#B98AD6)">craters ≥3</text>
  <!-- residual annotation: the named-in-advance cause -->
  <text x="599" y="360" text-anchor="middle" font-size="10.5" fill="var(--cause,#E3C24A)">residual_multiplier = 0.22</text>
  <text x="599" y="374" text-anchor="middle" class="mut" font-size="9">smaller per-pass dose → earlier peak</text>

  <!-- caption -->
  <text x="40" y="360" class="ink2" font-size="11">Same inverted-U law on both. The peak moves 1.25 → 0.75 —</text>
  <text x="40" y="376" class="ink2" font-size="11">a leftward shift called in advance from Granite's</text>
  <text x="40" y="392" class="ink2" font-size="11">smaller residual multiplier, before the sweep ran.</text>

  <!-- legend -->
  <g transform="translate(40,418)">
    <line x1="0" y1="-3" x2="26" y2="-3" stroke="var(--accent,#4FB2C2)" stroke-width="2.4"/>
    <circle cx="13" cy="-3" r="3.2" fill="var(--bg,#0E141A)" stroke="var(--accent,#4FB2C2)" stroke-width="1.8"/>
    <text x="32" y="0" class="mut" font-size="9.5">MiniCPM (solid · ●)</text>
    <line x1="150" y1="-3" x2="176" y2="-3" stroke="var(--accent,#4FB2C2)" stroke-width="2.4" stroke-dasharray="8 4"/>
    <rect x="159.8" y="-6.2" width="6.4" height="6.4" fill="var(--bg,#0E141A)" stroke="var(--accent,#4FB2C2)" stroke-width="1.8"/>
    <text x="182" y="0" class="mut" font-size="9.5">Granite (dashed · ■)</text>
    <rect x="305" y="-9" width="14" height="12" fill="url(#crater)"/>
    <text x="324" y="0" class="mut" font-size="9.5">Σα ≥ 3 crater zone</text>
  </g>

  </g>
</svg>
