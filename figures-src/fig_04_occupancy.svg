<svg viewBox="0 0 720 442" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>The occupancy story</title>
  <desc>Aggregate decode throughput against concurrent streams, one curve per runtime: MLX climbs to about 1670 tok/s and saturates late, llama plateaus near 750 by 128 streams, and PyTorch stays low. All runtimes coincide at a single stream, so the MLX advantage is entirely about packing more concurrent streams; the faint per-line band is the spread across quants, tight enough to confirm throughput is quant-agnostic.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .mlx  { stroke: var(--cause,#E3C24A); fill: var(--cause,#E3C24A); }
    .lla  { stroke: var(--accent,#4FB2C2); fill: var(--accent,#4FB2C2); }
    .pyt  { stroke: var(--neg,#B98AD6); fill: var(--neg,#B98AD6); }
  </style>

  <rect x="0" y="0" width="720" height="442" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="40" y="30" font-size="18">MLX's batched-decode lead is occupancy, not faster kernels</text>
  <text class="mut" x="40" y="50" font-size="10">Decode tok/s vs concurrent streams &#183; MiniCPM5-1B, M4 Mini &#183; line = 4-bit quant, band = all-quant spread</text>

  <!-- gridlines -->
  <g stroke="var(--rule2,#27323D)" stroke-width="1">
    <line x1="88" y1="141" x2="655" y2="141"/>
    <line x1="88" y1="227" x2="655" y2="227"/>
    <line x1="88" y1="312" x2="655" y2="312"/>
  </g>
  <!-- axes -->
  <line x1="88" y1="95" x2="88" y2="395" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <line x1="88" y1="395" x2="660" y2="395" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <!-- y ticks -->
  <g class="mut" font-size="9" text-anchor="end">
    <text x="82" y="398">0</text>
    <text x="82" y="315">500</text>
    <text x="82" y="230">1000</text>
    <text x="82" y="144">1500</text>
  </g>
  <!-- x ticks -->
  <g class="mut" font-size="9.5" text-anchor="middle">
    <text x="100" y="409">1</text>
    <text x="192.5" y="409">8</text>
    <text x="285" y="409">32</text>
    <text x="377.5" y="409">64</text>
    <text x="470" y="409">128</text>
    <text x="562.5" y="409">192</text>
    <text x="655" y="409">256</text>
  </g>

  <!-- ===== bands ===== -->
  <polygon class="mlx" stroke="none" opacity="0.11"
    points="100,357.6 192.5,319.7 285,167.0 377.5,144.2 470,119.2 562.5,110.5 655,108.4 655,157.5 562.5,154.1 470,158.5 377.5,164.2 285,261.1 192.5,354.5 100,386.4"/>
  <polygon class="lla" stroke="none" opacity="0.13"
    points="100,373.6 192.5,355.4 285,280.8 377.5,266.6 470,261.6 562.5,262.0 655,264.7 655,280.5 562.5,278.8 470,277.1 377.5,277.2 285,293.0 192.5,370.3 100,386.4"/>

  <!-- ===== MLX central (solid, circles) ===== -->
  <polyline class="mlx" style="fill:none" stroke-width="2"
    points="100,368.4 192.5,320.4 285,167.2 377.5,154.0 470,149.0 562.5,144.9 655,151.2"/>
  <g class="mlx" stroke="none">
    <circle cx="100" cy="368.4" r="3"/><circle cx="192.5" cy="320.4" r="3"/><circle cx="285" cy="167.2" r="3"/><circle cx="377.5" cy="154.0" r="3"/><circle cx="470" cy="149.0" r="3"/><circle cx="562.5" cy="144.9" r="3"/><circle cx="655" cy="151.2" r="3"/>
  </g>

  <!-- ===== llama central (dashed, squares) ===== -->
  <polyline class="lla" style="fill:none" stroke-width="2" stroke-dasharray="6 4"
    points="100,377.2 192.5,365.7 285,281.9 377.5,272.1 470,271.4 562.5,272.4 655,275.0"/>
  <g class="lla" stroke="none">
    <rect x="97" y="374.2" width="6" height="6"/><rect x="189.5" y="362.7" width="6" height="6"/><rect x="282" y="278.9" width="6" height="6"/><rect x="374.5" y="269.1" width="6" height="6"/><rect x="467" y="268.4" width="6" height="6"/><rect x="559.5" y="269.4" width="6" height="6"/><rect x="652" y="272.0" width="6" height="6"/>
  </g>

  <!-- ===== pytorch central (dotted, triangles) — capped at 32 ===== -->
  <polyline class="pyt" style="fill:none" stroke-width="1.8" stroke-dasharray="2 3"
    points="100,389.2 192.5,385.6 285,331.9"/>
  <g class="pyt" stroke="none">
    <polygon points="100,386.2 96.5,392 103.5,392"/><polygon points="192.5,382.6 189,388.4 196,388.4"/><polygon points="285,328.9 281.5,334.7 288.5,334.7"/>
  </g>

  <!-- annotations -->
  <text class="ink2" x="475" y="100" font-size="10">MLX &#8594; 1671 @ 256, saturates late</text>
  <text class="ink2" x="395" y="258" font-size="10">llama.cpp plateaus by 128 (~750)</text>
  <text class="mut"  x="293" y="350" font-size="9">PyTorch capped @32</text>
  <text class="mut"  x="100" y="298" font-size="9">1 stream:</text>
  <text class="mut"  x="100" y="309" font-size="9">bands overlap,</text>
  <text class="mut"  x="100" y="320" font-size="9">50&#8211;125 tok/s &#8212;</text>
  <text class="mut"  x="100" y="331" font-size="9">no gap yet</text>

  <!-- legend (lower-right empty zone) -->
  <rect x="432" y="305" width="224" height="52" rx="3" fill="var(--bg2,#141D26)" opacity="0.88" stroke="var(--rule2,#27323D)"/>
  <g font-size="9.5">
    <line x1="442" y1="320" x2="466" y2="320" class="mlx" stroke-width="2"/><circle cx="454" cy="320" r="3" class="mlx" stroke="none"/>
    <text x="472" y="323" class="ink2">MLX &#183; 4-bit line, 12-quant band</text>
    <line x1="442" y1="335" x2="466" y2="335" class="lla" stroke-width="2" stroke-dasharray="6 4"/><rect x="451" y="332" width="6" height="6" class="lla" stroke="none"/>
    <text x="472" y="338" class="ink2">llama.cpp &#183; 22-quant band</text>
    <line x1="442" y1="350" x2="466" y2="350" class="pyt" stroke-width="1.8" stroke-dasharray="2 3"/><polygon points="454,347 450.5,352.8 457.5,352.8" class="pyt" stroke="none"/>
    <text x="472" y="353" class="ink2">PyTorch fp16</text>
  </g>

  <!-- axis titles + takeaway -->
  <text x="372" y="424" text-anchor="middle" class="mut" font-size="10">concurrent streams (decode)</text>
  <text x="22" y="245" transform="rotate(-90 22 245)" text-anchor="middle" class="mut" font-size="10">aggregate decode tok/s</text>
  <text x="40" y="438" class="ink2" font-size="10">Single-stream they tie; MLX's lead is filling a larger shared-KV batch &#8212; occupancy, not arithmetic.</text>
</svg>
