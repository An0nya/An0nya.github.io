<svg viewBox="0 0 400 566" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>The leaderboard flips when you divide by RAM</title>
  <desc>Two panels ranking the same eleven configurations, changing only the metric. Top: raw aggregate decode tok/s, where MLX configs win. Bottom: tok/s per GB of peak RAM, where every llama config now beats every MLX config by four to five times, with IQ3_M excluded as EOS-broken.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .val  { fill: var(--ink,#DCE4EC); font-size: 8.5px; }
  </style>

  <defs>
    <pattern id="mlxHatchM" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="var(--cause,#E3C24A)"/>
      <path d="M0,6 L6,0" stroke="var(--bg2,#141D26)" stroke-width="1.4"/>
    </pattern>
    <pattern id="pyDotM" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="var(--neg,#B98AD6)"/>
      <circle cx="3" cy="3" r="1.15" fill="var(--bg2,#141D26)"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="400" height="566" fill="var(--bg2,#141D26)"/>

  <!-- title (2 lines) + dek -->
  <text class="ttl" x="16" y="24" font-size="15">On 16 GB, the speed leaderboard</text>
  <text class="ttl" x="16" y="42" font-size="15">inverts once you divide by RAM</text>
  <text class="mut" x="16" y="58" font-size="9">MiniCPM5-1B &#183; M4 Mini &#183; peak batched decode</text>
  <text class="mut" x="16" y="69" font-size="9">same 11 configs, same order both panels &#183; --no-mmap</text>

  <!-- legend -->
  <g font-size="9">
    <rect x="16" y="82" width="10" height="8" fill="url(#mlxHatchM)"/>
    <text x="29" y="89" class="ink2">MLX</text>
    <rect x="68" y="82" width="10" height="8" fill="var(--accent,#4FB2C2)"/>
    <text x="81" y="89" class="ink2">llama.cpp</text>
    <rect x="158" y="82" width="10" height="8" fill="url(#pyDotM)"/>
    <text x="171" y="89" class="ink2">PyTorch</text>
  </g>

  <!-- ===================== PANEL A : RAW ===================== -->
  <text x="16" y="108" class="ink2" font-size="9.5" letter-spacing="0.8">RAW DECODE &#183; tok/s (peak batch)</text>
  <line x1="98" y1="113" x2="98" y2="283" stroke="var(--rule2,#27323D)" stroke-width="1"/>

  <!-- rows: barY = 119 + i*15 ; scale = 284/1800 = 0.15778 -->
  <g>
    <rect x="98" y="119" width="263.3" height="10" fill="url(#mlxHatchM)"/>
    <text x="92" y="127" text-anchor="end" font-size="9">MLX bf16</text><text x="365.3" y="127" class="val">1669</text>
    <rect x="98" y="134" width="234.0" height="10" fill="url(#mlxHatchM)"/>
    <text x="92" y="142" text-anchor="end" font-size="9">MLX 2-bit</text><text x="336" y="142" class="val">1483</text>
    <rect x="98" y="149" width="230.2" height="10" fill="url(#mlxHatchM)"/>
    <text x="92" y="157" text-anchor="end" font-size="9">MLX 4-bit</text><text x="332.2" y="157" class="val">1459</text>
    <rect x="98" y="164" width="228.0" height="10" fill="url(#mlxHatchM)"/>
    <text x="92" y="172" text-anchor="end" font-size="9">MLX OptiQ-4b</text><text x="330" y="172" class="val">1445</text>
    <rect x="98" y="179" width="226.4" height="10" fill="url(#mlxHatchM)"/>
    <text x="92" y="187" text-anchor="end" font-size="9">MLX 8-bit</text><text x="328.4" y="187" class="val">1435</text>
    <rect x="98" y="194" width="122.8" height="10" fill="var(--accent,#4FB2C2)"/>
    <text x="92" y="202" text-anchor="end" font-size="9">llama F16</text><text x="224.8" y="202" class="val">778</text>
    <rect x="98" y="209" width="117.5" height="10" fill="var(--accent,#4FB2C2)"/>
    <text x="92" y="217" text-anchor="end" font-size="9">llama Q8_0</text><text x="219.5" y="217" class="val">745</text>
    <rect x="98" y="224" width="115.3" height="10" fill="var(--accent,#4FB2C2)"/>
    <text x="92" y="232" text-anchor="end" font-size="9">llama IQ4_XS</text><text x="217.3" y="232" class="val">731</text>
    <rect x="98" y="239" width="114.5" height="10" fill="var(--accent,#4FB2C2)"/>
    <text x="92" y="247" text-anchor="end" font-size="9">llama IQ2_XS</text><text x="216.5" y="247" class="val">726</text>
    <rect x="98" y="254" width="113.8" height="10" fill="var(--accent,#4FB2C2)"/>
    <text x="92" y="262" text-anchor="end" font-size="9">llama Q4_K_M</text><text x="215.8" y="262" class="val">721</text>
    <rect x="98" y="269" width="58.1" height="10" fill="url(#pyDotM)"/>
    <text x="92" y="277" text-anchor="end" font-size="9">PyTorch fp16</text><text x="160.1" y="277" class="val">368</text>
  </g>
  <text x="98" y="295" class="mut" font-size="8.5">clean ramp &#8212; MLX takes the top five</text>

  <!-- ===================== PANEL B : PER-GB ===================== -->
  <text x="16" y="314" class="ink2" font-size="9.5" letter-spacing="0.8">PER GIGABYTE &#183; tok/s &#247; peak RAM</text>
  <line x1="98" y1="319" x2="98" y2="489" stroke="var(--rule2,#27323D)" stroke-width="1"/>

  <!-- rows: barY = 325 + i*15 ; scale = 284/650 = 0.43692 -->
  <g>
    <rect x="98" y="325" width="58.5" height="10" fill="url(#mlxHatchM)"/>
    <text x="92" y="333" text-anchor="end" font-size="9">MLX bf16</text><text x="160.5" y="333" class="val">134</text>
    <rect x="98" y="340" width="51.6" height="10" fill="url(#mlxHatchM)"/>
    <text x="92" y="348" text-anchor="end" font-size="9">MLX 2-bit</text><text x="153.6" y="348" class="val">118</text>
    <rect x="98" y="355" width="62.5" height="10" fill="url(#mlxHatchM)"/>
    <text x="92" y="363" text-anchor="end" font-size="9">MLX 4-bit</text><text x="164.5" y="363" class="val">143</text>
    <rect x="98" y="370" width="61.2" height="10" fill="url(#mlxHatchM)"/>
    <text x="92" y="378" text-anchor="end" font-size="9">MLX OptiQ-4b</text><text x="163.2" y="378" class="val">140</text>
    <rect x="98" y="385" width="58.1" height="10" fill="url(#mlxHatchM)"/>
    <text x="92" y="393" text-anchor="end" font-size="9">MLX 8-bit</text><text x="160.1" y="393" class="val">133</text>
    <rect x="98" y="400" width="90.4" height="10" fill="var(--accent,#4FB2C2)"/>
    <text x="92" y="408" text-anchor="end" font-size="9">llama F16</text><text x="192.4" y="408" class="val">207</text>
    <rect x="98" y="415" width="162.5" height="10" fill="var(--accent,#4FB2C2)"/>
    <text x="92" y="423" text-anchor="end" font-size="9">llama Q8_0</text><text x="264.5" y="423" class="val">372</text>
    <rect x="98" y="430" width="160.4" height="10" fill="var(--accent,#4FB2C2)"/>
    <text x="92" y="438" text-anchor="end" font-size="9">llama IQ4_XS</text><text x="262.4" y="438" class="val">367</text>
    <rect x="98" y="445" width="268.7" height="10" fill="var(--accent,#4FB2C2)"/>
    <text x="92" y="453" text-anchor="end" font-size="9">llama IQ2_XS</text><text x="370.7" y="453" class="val">615</text>
    <rect x="98" y="460" width="154.3" height="10" fill="var(--accent,#4FB2C2)"/>
    <text x="92" y="468" text-anchor="end" font-size="9">llama Q4_K_M</text><text x="256.3" y="468" class="val">353</text>
    <rect x="98" y="475" width="24.5" height="10" fill="url(#pyDotM)"/>
    <text x="92" y="483" text-anchor="end" font-size="9">PyTorch fp16</text><text x="126.5" y="483" class="val">56</text>
  </g>
  <text x="98" y="501" class="mut" font-size="8.5">ramp shattered &#8212; MLX now shortest above PyTorch</text>

  <!-- takeaway + caveat -->
  <text x="16" y="522" class="ink2" font-size="9">Every llama.cpp quant beats every MLX config</text>
  <text x="16" y="534" class="ink2" font-size="9">2&#8211;4&#215; per GB &#8212; the axis that fits on 16 GB.</text>
  <text x="16" y="548" class="mut" font-size="8">MLX RAM is a cumulative high-watermark (overstated);</text>
  <text x="16" y="558" class="mut" font-size="8">llama is per-process fresh. IQ3_M excluded (EOS-broken).</text>
</svg>
