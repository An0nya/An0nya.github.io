<svg viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>Single-α versus split</title>
  <desc>Math-probe score against dose for a single-α pass versus a split pass, each config measured against its own baseline. At the same total Σα the split stays above the single at every dose — the same knob budget, opposite outcomes — with a 0.27 swing at Σα = 1.5.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .obs  { stroke: var(--accent,#4FB2C2); fill: var(--accent,#4FB2C2); }
    .foil { stroke: var(--cause,#E3C24A); fill: var(--cause,#E3C24A); }
    .stk  { stroke: var(--neg,#B98AD6); fill: var(--neg,#B98AD6); }
  </style>
  <defs>
    <marker id="ahM" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink2,#A4B0BC)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="400" height="700" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="16" y="24" font-size="15">One pass can&#8217;t buy</text>
  <text class="ttl" x="16" y="42" font-size="15">what splitting buys</text>
  <text class="mut" x="16" y="58" font-size="8.5">MiniCPM5-1B &#183; L1 &#183; &#916; strict-math vs own baseline</text>
  <text class="mut" x="16" y="69" font-size="8.5">18 shared math probes &#183; each config vs its own file</text>

  <!-- gridlines -->
  <g stroke="var(--rule2,#27323D)" stroke-width="1">
    <line x1="48" y1="174.7" x2="384" y2="174.7"/>
    <line x1="48" y1="211.3" x2="384" y2="211.3"/>
    <line x1="48" y1="272" x2="384" y2="272"/>
    <line x1="48" y1="421.3" x2="384" y2="421.3"/>
    <line x1="48" y1="483" x2="384" y2="483"/>
  </g>

  <!-- y axis + labels -->
  <line x1="48" y1="150" x2="48" y2="520" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <g class="mut" font-size="8" text-anchor="end">
    <text x="44" y="177">+.15</text><text x="44" y="214">+.10</text><text x="44" y="275">+.05</text>
    <text x="44" y="362">0</text><text x="44" y="424">&#8722;.05</text><text x="44" y="486">&#8722;.10</text>
  </g>
  <text x="20" y="335" transform="rotate(-90 20 335)" text-anchor="middle" class="mut" font-size="8">&#916; strict-math vs baseline</text>

  <!-- baseline zero -->
  <line x1="48" y1="359.7" x2="384" y2="359.7" stroke="var(--ink2,#A4B0BC)" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="mut" x="384" y="354" text-anchor="end" font-size="8">&#916; = 0</text>

  <!-- x axis + labels -->
  <line x1="48" y1="520" x2="384" y2="520" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <g class="mut" font-size="8.5" text-anchor="middle">
    <text x="65.7" y="535">0.5</text><text x="154.1" y="535">1.0</text><text x="242.5" y="535">1.5</text><text x="330.9" y="535">2.0</text>
  </g>
  <text x="216" y="551" text-anchor="middle" class="mut" font-size="8.5">&#931;&#945;  (cumulative alpha on L1)</text>

  <!-- single damped pass (foil): citron dashed -->
  <polyline class="foil" style="fill:none" stroke-width="2" stroke-dasharray="6 4"
    points="65.7,364.0 83.4,325.4 101.1,329.7 118.8,346.8 136.4,342.5 154.1,364.0 171.8,398.2 207.1,458.2 242.5,501.0"/>
  <g class="foil">
    <circle cx="65.7" cy="364.0" r="2.5"/><circle cx="83.4" cy="325.4" r="2.5"/><circle cx="101.1" cy="329.7" r="2.5"/><circle cx="118.8" cy="346.8" r="2.5"/><circle cx="136.4" cy="342.5" r="2.5"/><circle cx="154.1" cy="364.0" r="2.5"/><circle cx="171.8" cy="398.2" r="2.5"/><circle cx="207.1" cy="458.2" r="2.5"/><circle cx="242.5" cy="501.0" r="2.5"/>
  </g>
  <text class="foil" x="83.4" y="318" text-anchor="middle" font-size="8" stroke="none">+.028</text>

  <!-- split k=2 (hero): cyan solid -->
  <polyline class="obs" style="fill:none" stroke-width="2"
    points="118.8,252.6 136.4,248.3 154.1,248.3 171.8,244.0 189.5,239.8 198.3,252.6 207.1,252.6 224.8,256.9 242.5,269.7 260.2,286.9 277.8,286.9 286.7,291.1 295.5,295.4 313.2,342.5 330.9,355.3 348.5,376.8 366.3,432.4"/>
  <g class="obs">
    <circle cx="118.8" cy="252.6" r="2.5"/><circle cx="136.4" cy="248.3" r="2.5"/><circle cx="154.1" cy="248.3" r="2.5"/><circle cx="171.8" cy="244.0" r="2.5"/><circle cx="189.5" cy="239.8" r="2.5"/><circle cx="198.3" cy="252.6" r="2.5"/><circle cx="207.1" cy="252.6" r="2.5"/><circle cx="224.8" cy="256.9" r="2.5"/><circle cx="242.5" cy="269.7" r="2.5"/><circle cx="260.2" cy="286.9" r="2.5"/><circle cx="277.8" cy="286.9" r="2.5"/><circle cx="286.7" cy="291.1" r="2.5"/><circle cx="295.5" cy="295.4" r="2.5"/><circle cx="313.2" cy="342.5" r="2.5"/><circle cx="330.9" cy="355.3" r="2.5"/><circle cx="348.5" cy="376.8" r="2.5"/><circle cx="366.3" cy="432.4" r="2.5"/>
  </g>

  <!-- stacks (violet, shape-coded) -->
  <g class="stk" stroke="none">
    <rect x="238.5" y="244.3" width="8" height="8"/>
    <polygon points="198.3,195.2 193.3,205.2 203.3,205.2"/>
    <polygon points="242.5,165.2 237.5,175.2 247.5,175.2"/>
    <polygon points="198.3,173.8 204.3,179.8 198.3,185.8 192.3,179.8"/>
  </g>

  <!-- same-dose swing @ Sigma 1.5 -->
  <line x1="242.5" y1="171.2" x2="242.5" y2="501.0" stroke="var(--ink2,#A4B0BC)" stroke-width="1.2"
        marker-start="url(#ahM)" marker-end="url(#ahM)"/>
  <text class="ink2" x="252" y="208" font-size="8.5">same &#931;&#945; = 1.5</text>
  <text class="ink2" x="252" y="220" font-size="8.5">swing <tspan class="obs" stroke="none">+0.27</tspan></text>

  <!-- legend (lower-left empty quadrant) -->
  <g font-size="8.5">
    <line x1="56" y1="456" x2="78" y2="456" class="foil" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="67" cy="456" r="2.5" class="foil" stroke="none"/>
    <text x="84" y="453" class="ink2">single damped pass</text>
    <text x="84" y="463" class="ink2">(&#931;&#945; = &#945;)</text>
    <line x1="56" y1="478" x2="78" y2="478" class="obs" stroke-width="2"/>
    <circle cx="67" cy="478" r="2.5" class="obs" stroke="none"/>
    <text x="84" y="475" class="ink2">split, k = 2</text>
    <text x="84" y="485" class="ink2">(&#931;&#945; sweep)</text>
    <g class="stk" stroke="none">
      <rect x="62" y="497" width="8" height="8"/>
      <polygon points="112,497 107,506 117,506"/>
      <polygon points="154,501.5 159,497 164,501.5 159,506"/>
    </g>
    <text x="84" y="504" class="ink2" font-size="8">k3</text>
    <text x="135" y="504" class="ink2" font-size="8">k4</text>
    <text x="170" y="504" class="ink2" font-size="8">k6 (stacks)</text>
  </g>

  <!-- takeaway -->
  <line x1="16" y1="572" x2="384" y2="572" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <text x="16" y="590" class="ink2" font-size="9">Same budget, opposite outcomes. A single &#945; buys</text>
  <text x="16" y="603" class="ink2" font-size="9">at most +0.03 and turns <tspan class="foil" stroke="none">harmful</tspan> when amplified.</text>
  <text x="16" y="616" class="ink2" font-size="9">Splitting the same &#931;&#945; across re-evaluated passes</text>
  <text x="16" y="629" class="ink2" font-size="9"><tspan class="obs" stroke="none">holds +0.15</tspan> &#8212; a place a single &#945; can&#8217;t reach.</text>
</svg>
