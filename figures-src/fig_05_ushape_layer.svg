<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
  </style>

  <rect x="0" y="0" width="720" height="520" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="40" y="34" font-size="18">The U-shaped layer the endpoint map can't see</text>
  <text class="mut" x="40" y="52" font-size="10.5">Granite-4.1-3B · math Δ on the gcore in-band probes vs baseline 0.628 · x = α: 0 prune → 1 base → 2 dup.</text>
  <text class="mut" x="40" y="66" font-size="10">Dense single-pass α-grid 0.5–1.5 (n=348/pt) is the measured curve; prune (α0) &amp; dup (α2) are structural endpoints.</text>

  <!-- axes -->
  <line x1="90" y1="100" x2="90" y2="320" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <line x1="90" y1="150" x2="662" y2="150" stroke="var(--rule2,#27323D)" stroke-width="1" stroke-dasharray="3 3"/>
  <g class="mut" font-size="9" text-anchor="end">
    <text x="84" y="119">+.05</text>
    <text x="84" y="153">Δ 0</text>
    <text x="84" y="187">−.05</text>
    <text x="84" y="221">−.10</text>
    <text x="84" y="289">−.20</text>
  </g>

  <!-- x ticks -->
  <g class="mut" font-size="9.5" text-anchor="middle">
    <text x="90" y="338">0</text><text x="230" y="338" font-size="8">0.5</text><text x="370" y="338">1</text><text x="510" y="338" font-size="8">1.5</text><text x="650" y="338">2</text>
    <text x="90" y="351" font-size="8.5">prune</text><text x="370" y="351" font-size="8.5">baseline</text><text x="650" y="351" font-size="8.5">dup</text>
    <text x="380" y="370" letter-spacing="1">α →</text>
  </g>

  <!-- ===== 3-point endpoint map (faint) ===== -->
  <polyline points="370,150 650,221.4" fill="none" stroke="var(--muted,#6F7C88)" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.7"/>
  <line x1="370" y1="150" x2="255" y2="321" stroke="var(--muted,#6F7C88)" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.85"/>
  <polygon points="251,328 254,313 262,318" fill="var(--muted,#6F7C88)"/>
  <g fill="var(--muted,#6F7C88)">
    <circle cx="370" cy="150" r="2.8"/><circle cx="650" cy="221.4" r="2.8"/>
  </g>
  <text x="650" y="237" text-anchor="middle" class="mut" font-size="8.5">dup_6 −.105</text>
  <text x="184" y="298" class="mut" font-size="8.5">prune_6 → 0.00</text>
  <text x="164" y="310" class="mut" font-size="8.5">Δ −0.63, off scale</text>

  <!-- ===== L5 dense curve (slate, dashed, squares) ===== -->
  <path d="M230.0,219.4 C248.7,206.9 267.3,193.3 286.0,182.0 C300.0,173.4 314.0,165.2 328.0,158.8 C337.3,154.6 346.7,151.6 356.0,148.6 C365.3,145.7 374.7,144.7 384.0,141.2 C393.3,137.6 402.7,131.0 412.0,127.6 C426.0,122.5 440.0,117.4 454.0,117.4 C472.7,117.4 491.3,126.4 510.0,131.0"
        fill="none" stroke="var(--fourth,#6E92C4)" stroke-width="2" stroke-dasharray="7 4"/>
  <g fill="var(--bg,#0E141A)" stroke="var(--fourth,#6E92C4)" stroke-width="1.5">
    <rect x="226.8" y="216.2" width="6.4" height="6.4"/><rect x="282.8" y="178.8" width="6.4" height="6.4"/><rect x="324.8" y="155.6" width="6.4" height="6.4"/><rect x="352.8" y="145.4" width="6.4" height="6.4"/><rect x="380.8" y="138.0" width="6.4" height="6.4"/><rect x="408.8" y="124.4" width="6.4" height="6.4"/><rect x="506.8" y="127.8" width="6.4" height="6.4"/>
  </g>
  <rect x="450.4" y="113.8" width="7.2" height="7.2" fill="var(--bg,#0E141A)" stroke="var(--fourth,#6E92C4)" stroke-width="2"/>
  <text x="468" y="113" font-size="9.5" fill="var(--fourth,#6E92C4)">L5 peaks α≈1.3 (+.048)</text>

  <!-- ===== L6 dense curve (cyan, solid, circles) ===== -->
  <path d="M230.0,143.2 C248.7,131.4 267.3,107.8 286.0,107.8 C300.0,107.8 314.0,117.5 328.0,123.5 C337.3,127.5 346.7,133.2 356.0,137.1 C365.3,140.9 374.7,146.6 384.0,146.6 C393.3,146.6 402.7,143.2 412.0,143.2 C426.0,143.2 440.0,143.2 454.0,164.3 C472.7,192.4 491.3,260.8 510.0,309.1"
        fill="none" stroke="var(--accent,#4FB2C2)" stroke-width="2.6"/>
  <g fill="var(--bg,#0E141A)" stroke="var(--accent,#4FB2C2)" stroke-width="1.8">
    <circle cx="230" cy="143.2" r="3.2"/><circle cx="328" cy="123.5" r="3.2"/><circle cx="356" cy="137.1" r="3.2"/><circle cx="384" cy="146.6" r="3.2"/><circle cx="412" cy="143.2" r="3.2"/><circle cx="454" cy="164.3" r="3.2"/><circle cx="510" cy="309.1" r="3.2"/>
  </g>
  <!-- L6 peak marker (citron) + guide + callout (in the gap above the plot) -->
  <line x1="286" y1="107.8" x2="286" y2="320" stroke="var(--cause,#E3C24A)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8"/>
  <circle cx="286" cy="107.8" r="4.4" fill="var(--bg,#0E141A)" stroke="var(--cause,#E3C24A)" stroke-width="2.2"/>
  <text x="286" y="86" text-anchor="middle" font-size="9" class="mut">top single-site math move</text>
  <text x="286" y="99" text-anchor="middle" font-size="10.5" fill="var(--cause,#E3C24A)">α≈0.7 → +0.062</text>
  <!-- α1.5 over-drive note -->
  <text x="518" y="306" font-size="8.5" fill="var(--neg,#B98AD6)">α1.5: −.234 (over-drive)</text>

  <!-- ===== FOOTER: caption column (left) + legend column (right) ===== -->
  <text x="40" y="394" class="ink2" font-size="11">Endpoints and the dense grid <tspan fill="var(--cause,#E3C24A)">disagree about the</tspan></text>
  <text x="40" y="409" class="ink2" font-size="11"><tspan fill="var(--cause,#E3C24A)">sign</tspan>. The 3-point prune/baseline/dup probe sees</text>
  <text x="40" y="424" class="ink2" font-size="11">only collapse on both sides of baseline — it reads</text>
  <text x="40" y="439" class="ink2" font-size="11">L6 as "touch it and it dies." The dense α-grid</text>
  <text x="40" y="454" class="ink2" font-size="11">finds the opposite: a partial damp (α≈0.7) is the</text>
  <text x="40" y="469" class="ink2" font-size="11">best single-site math move on the model.</text>
  <text x="40" y="491" class="mut" font-size="10.5">A two-point instrument doesn't lose precision — it returns the wrong direction.</text>

  <!-- legend (right column) -->
  <g transform="translate(470,402)" font-size="10">
    <line x1="0" y1="-3" x2="24" y2="-3" stroke="var(--accent,#4FB2C2)" stroke-width="2.6"/>
    <circle cx="12" cy="-3" r="3.2" fill="var(--bg,#0E141A)" stroke="var(--accent,#4FB2C2)" stroke-width="1.8"/>
    <text x="32" y="0" class="mut">L6 (● dense α-grid)</text>
  </g>
  <g transform="translate(470,424)" font-size="10">
    <line x1="0" y1="-3" x2="24" y2="-3" stroke="var(--fourth,#6E92C4)" stroke-width="2" stroke-dasharray="7 4"/>
    <rect x="8.4" y="-6.6" width="7.2" height="7.2" fill="var(--bg,#0E141A)" stroke="var(--fourth,#6E92C4)" stroke-width="1.5"/>
    <text x="32" y="0" class="mut">L5 (■ peak α1.3)</text>
  </g>
  <g transform="translate(470,446)" font-size="10">
    <line x1="0" y1="-3" x2="24" y2="-3" stroke="var(--muted,#6F7C88)" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="32" y="0" class="mut">3-pt map (endpoints only)</text>
  </g>
</svg>
