<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <defs>
    <pattern id="stripe" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--neg,#B98AD6)" stroke-width="1.1" opacity="0.5"/>
    </pattern>
  </defs>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .acc  { fill: var(--accent,#4FB2C2); }
    .vio  { fill: var(--neg,#B98AD6); }
    .accs { stroke: var(--accent,#4FB2C2); fill:none; }
    .vios { stroke: var(--neg,#B98AD6); fill:none; }
    .rule { stroke: var(--rule2,#27323D); }
    .axis { stroke: var(--ink2,#A4B0BC); }
    .lbl  { fill: var(--ink2,#A4B0BC); font-size: 9px; }
  </style>
  <rect x="0" y="0" width="760" height="400" fill="var(--bg2,#141D26)"/>
  <text class="ttl" x="40" y="34" font-size="18">Frequency isn't evidence</text>
  <text class="mut" x="40" y="53" font-size="10">Friction clusters by distinct-session count · bar height ≠ trust</text>

  <line x1="60" y1="300" x2="720" y2="300" class="axis" stroke-width="1"/>

  <!-- agent rushed : 9 : suspect -->
  <rect x="75.7" y="104.0" width="42" height="196.0" class="vios" stroke-width="1.4" fill="url(#stripe)" stroke-dasharray="3 2"/>
  <text x="96.7" y="88.0" text-anchor="middle" class="vio" font-size="9">⚑</text>
  <text x="96.7" y="99.0" text-anchor="middle" class="mut" font-size="8.5">9</text>
  <text x="96.7" y="312" text-anchor="middle" class="lbl">agent</text>
  <text x="96.7" y="324" text-anchor="middle" class="lbl">rushed</text>

  <!-- too preachy : 8 : suspect -->
  <rect x="149.0" y="125.8" width="42" height="174.2" class="vios" stroke-width="1.4" fill="url(#stripe)" stroke-dasharray="3 2"/>
  <text x="170.0" y="109.8" text-anchor="middle" class="vio" font-size="9">⚑</text>
  <text x="170.0" y="120.8" text-anchor="middle" class="mut" font-size="8.5">8</text>
  <text x="170.0" y="312" text-anchor="middle" class="lbl">too</text>
  <text x="170.0" y="324" text-anchor="middle" class="lbl">preachy</text>

  <!-- invented detour : 6 : suspect -->
  <rect x="222.3" y="169.3" width="42" height="130.7" class="vios" stroke-width="1.4" fill="url(#stripe)" stroke-dasharray="3 2"/>
  <text x="243.3" y="153.3" text-anchor="middle" class="vio" font-size="9">⚑</text>
  <text x="243.3" y="164.3" text-anchor="middle" class="mut" font-size="8.5">6</text>
  <text x="243.3" y="312" text-anchor="middle" class="lbl">invented</text>
  <text x="243.3" y="324" text-anchor="middle" class="lbl">detour</text>

  <!-- grep-first : 5 : trusted -->
  <rect x="295.7" y="191.1" width="42" height="108.9" class="accs" stroke-width="1.6" fill="var(--accent,#4FB2C2)" fill-opacity="0.18"/>
  <text x="316.7" y="185.1" text-anchor="middle" class="mut" font-size="8.5">5</text>
  <text x="316.7" y="312" text-anchor="middle" class="lbl">grep-</text>
  <text x="316.7" y="324" text-anchor="middle" class="lbl">first</text>

  <!-- over-formatted : 5 : suspect -->
  <rect x="369.0" y="191.1" width="42" height="108.9" class="vios" stroke-width="1.4" fill="url(#stripe)" stroke-dasharray="3 2"/>
  <text x="390.0" y="175.1" text-anchor="middle" class="vio" font-size="9">⚑</text>
  <text x="390.0" y="186.1" text-anchor="middle" class="mut" font-size="8.5">5</text>
  <text x="390.0" y="312" text-anchor="middle" class="lbl">over-</text>
  <text x="390.0" y="324" text-anchor="middle" class="lbl">formatted</text>

  <!-- verify premise : 4 : trusted -->
  <rect x="442.3" y="212.9" width="42" height="87.1" class="accs" stroke-width="1.6" fill="var(--accent,#4FB2C2)" fill-opacity="0.18"/>
  <text x="463.3" y="206.9" text-anchor="middle" class="mut" font-size="8.5">4</text>
  <text x="463.3" y="312" text-anchor="middle" class="lbl">verify</text>
  <text x="463.3" y="324" text-anchor="middle" class="lbl">premise</text>

  <!-- diagnostic≠directive : 4 : trusted -->
  <rect x="515.7" y="212.9" width="42" height="87.1" class="accs" stroke-width="1.6" fill="var(--accent,#4FB2C2)" fill-opacity="0.18"/>
  <text x="536.7" y="206.9" text-anchor="middle" class="mut" font-size="8.5">4</text>
  <text x="536.7" y="312" text-anchor="middle" class="lbl">diagnostic ≠</text>
  <text x="536.7" y="324" text-anchor="middle" class="lbl">directive</text>

  <!-- tool-trust gate : 3 : trusted -->
  <rect x="589.0" y="234.7" width="42" height="65.3" class="accs" stroke-width="1.6" fill="var(--accent,#4FB2C2)" fill-opacity="0.18"/>
  <text x="610.0" y="228.7" text-anchor="middle" class="mut" font-size="8.5">3</text>
  <text x="610.0" y="312" text-anchor="middle" class="lbl">tool-trust</text>
  <text x="610.0" y="324" text-anchor="middle" class="lbl">gate</text>

  <!-- under-documented : 3 : trusted -->
  <rect x="662.3" y="234.7" width="42" height="65.3" class="accs" stroke-width="1.6" fill="var(--accent,#4FB2C2)" fill-opacity="0.18"/>
  <text x="683.3" y="228.7" text-anchor="middle" class="mut" font-size="8.5">3</text>
  <text x="683.3" y="312" text-anchor="middle" class="lbl">under-</text>
  <text x="683.3" y="324" text-anchor="middle" class="lbl">documented</text>

  <!-- legend -->
  <rect x="530" y="77" width="14" height="12" class="vios" stroke-width="1.4" fill="url(#stripe)" stroke-dasharray="3 2"/>
  <text x="550" y="87" class="ink2" font-size="8.5">⚑ suspect — matches reader bias</text>
  <rect x="530" y="95" width="14" height="12" class="accs" stroke-width="1.6" fill="var(--accent,#4FB2C2)" fill-opacity="0.18"/>
  <text x="550" y="105" class="ink2" font-size="8.5">trusted — user-action backed</text>

  <line x1="40" y1="352" x2="720" y2="352" class="rule" stroke-width="1"/>
  <text x="40" y="370" class="ink2" font-size="11">The <tspan class="vio">tallest bars</tspan> are suspect (a biased reader repeating itself); some <tspan class="acc">short bars</tspan> are trusted.</text>
</svg>
