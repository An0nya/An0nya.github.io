<svg viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>Willingness to commit versus answer quality</title>
  <desc>Willingness-to-commit plotted against answer quality for three configurations. The untouched baseline sits low on both; forcing the model to commit lifts quality sharply with little change in willingness, while the surgical configuration sits high on willingness and only slightly higher on quality — most of its gain is getting the model to answer, not making it smarter.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .acc  { fill: var(--accent,#4FB2C2); }
    .cit  { fill: var(--cause,#E3C24A); }
    .vio  { fill: var(--neg,#B98AD6); }
    .sla  { fill: var(--fourth,#6E92C4); }
    .accs { stroke: var(--accent,#4FB2C2); fill:none; }
    .cits { stroke: var(--cause,#E3C24A); fill:none; }
    .vios { stroke: var(--neg,#B98AD6); fill:none; }
    .slas { stroke: var(--fourth,#6E92C4); fill:none; }
    .rule { stroke: var(--rule2,#27323D); }
    .axis { stroke: var(--ink2,#A4B0BC); }
  </style>
  <rect x="0" y="0" width="720" height="450" fill="var(--bg2,#141D26)"/>
<text class="ttl" x="40" y="34" font-size="18">Willingness vs capability</text>
<text class="mut" x="40" y="53" font-size="10">rate (commit) × m|g (quality given a guess) · the lift decomposed</text>
<line x1="80" y1="110" x2="80" y2="370" class="axis" stroke-width="1"/>
<line x1="80" y1="370" x2="680" y2="370" class="axis" stroke-width="1"/>
<text x="80.0" y="386" text-anchor="middle" class="mut" font-size="9">0.0</text>
<text x="240.0" y="386" text-anchor="middle" class="mut" font-size="9">0.2</text>
<text x="400.0" y="386" text-anchor="middle" class="mut" font-size="9">0.4</text>
<text x="560.0" y="386" text-anchor="middle" class="mut" font-size="9">0.6</text>
<text x="74" y="373.0" text-anchor="end" class="mut" font-size="9">0.0</text>
<text x="74" y="298.7" text-anchor="end" class="mut" font-size="9">0.2</text>
<text x="74" y="224.4" text-anchor="end" class="mut" font-size="9">0.4</text>
<text x="74" y="150.1" text-anchor="end" class="mut" font-size="9">0.6</text>
<text x="380" y="403" text-anchor="middle" class="ink2" font-size="10">rate — willingness to commit →</text>
<text x="26" y="240" transform="rotate(-90 26 240)" text-anchor="middle" class="ink2" font-size="10">m|g — quality given a guess →</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink2,#A4B0BC)"/></marker></defs>
<line x1="235.2" y1="296.1" x2="275.2" y2="176.1" class="slas" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="229.2" y="236" text-anchor="end" class="cit" font-size="9">force commit:</text>
<text x="229.2" y="248" text-anchor="end" class="cit" font-size="9">intuition already there</text>
<line x1="275.2" y1="176.1" x2="570.4" y2="153.8" class="accs" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="423" y="147" text-anchor="middle" class="acc" font-size="9">surgery: mostly compliance →</text>
<circle cx="235.2" cy="296.1" r="6.5" class="sla"/>
<text x="235.2" y="314.1" text-anchor="middle" class="ink2" font-size="9">bare baseline (0.19, 0.20)</text>
<circle cx="275.2" cy="176.1" r="6.5" class="cit"/>
<text x="297.2" y="194.1" text-anchor="middle" class="ink2" font-size="9">baseline, forced (0.24, 0.52)</text>
<circle cx="570.4" cy="153.8" r="6.5" class="acc"/>
<text x="570.4" y="141.8" text-anchor="middle" class="ink2" font-size="9">top RYS (0.61, 0.58)</text>
<line x1="40" y1="408" x2="680" y2="408" class="rule" stroke-width="1"/>
<text x="40" y="426" class="ink2" font-size="11">Most of the gain is <tspan class="acc">horizontal</tspan> (made it commit); only a small <tspan class="cit">vertical</tspan> residual is real compute.</text>
</svg>
