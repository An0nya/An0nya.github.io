<svg viewBox="0 0 720 588" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>The leaderboard flips when you divide by RAM</title>
  <desc>Two panels ranking the same eleven configurations, changing only the metric. Top: raw aggregate decode tok/s, where MLX configs win. Bottom: tok/s per GB of peak RAM, where every llama config now beats every MLX config by four to five times, with IQ3_M excluded as EOS-broken.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .val  { fill: var(--ink,#DCE4EC); font-size: 9px; }
  </style>

  <defs>
    <pattern id="mlxHatch" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="var(--cause,#E3C24A)"/>
      <path d="M0,6 L6,0" stroke="var(--bg2,#141D26)" stroke-width="1.4"/>
    </pattern>
    <pattern id="pyDot" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="6" fill="var(--neg,#B98AD6)"/>
      <circle cx="3" cy="3" r="1.15" fill="var(--bg2,#141D26)"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="720" height="588" fill="var(--bg2,#141D26)"/>

  <!-- title + dek -->
  <text class="ttl" x="40" y="32" font-size="18">On 16 GB, the speed leaderboard inverts once you divide by RAM</text>
  <text class="mut" x="40" y="51" font-size="10">MiniCPM5-1B &#183; M4 Mini &#183; peak batched decode &#183; same 11 configs, same order both panels &#183; RAM via --no-mmap</text>

  <!-- legend -->
  <g font-size="9.5">
    <rect x="455" y="64" width="11" height="9" fill="url(#mlxHatch)"/>
    <text x="470" y="72" class="ink2">MLX</text>
    <rect x="505" y="64" width="11" height="9" fill="var(--accent,#4FB2C2)"/>
    <text x="520" y="72" class="ink2">llama.cpp</text>
    <rect x="590" y="64" width="11" height="9" fill="url(#pyDot)"/>
    <text x="605" y="72" class="ink2">PyTorch</text>
  </g>

  <!-- ===================== PANEL A : RAW ===================== -->
  <text x="160" y="92" class="ink2" font-size="10.5" letter-spacing="1.2">RANKED BY RAW DECODE  &#183;  tok/s aggregate (RAM shown)</text>
  <line x1="160" y1="98" x2="160" y2="288" stroke="var(--rule2,#27323D)" stroke-width="1"/>

  <!-- rows: barY = 104 + i*17 ; scale = 520/1800 = 0.28889 -->
  <g>
    <rect x="160" y="104" width="482.1" height="11" fill="url(#mlxHatch)"/>
    <text x="150" y="113" text-anchor="end" font-size="9.5">MLX bf16</text>
    <text x="647.1" y="113" class="val">1669<tspan class="mut"> 12.5GB</tspan></text>

    <rect x="160" y="121" width="428.4" height="11" fill="url(#mlxHatch)"/>
    <text x="150" y="130" text-anchor="end" font-size="9.5">MLX 2-bit</text>
    <text x="593.4" y="130" class="val">1483<tspan class="mut"> 12.6GB</tspan></text>

    <rect x="160" y="138" width="421.5" height="11" fill="url(#mlxHatch)"/>
    <text x="150" y="147" text-anchor="end" font-size="9.5">MLX 4-bit</text>
    <text x="586.5" y="147" class="val">1459<tspan class="mut"> 10.2GB</tspan></text>

    <rect x="160" y="155" width="417.4" height="11" fill="url(#mlxHatch)"/>
    <text x="150" y="164" text-anchor="end" font-size="9.5">MLX OptiQ-4b</text>
    <text x="582.4" y="164" class="val">1445<tspan class="mut"> 10.3GB</tspan></text>

    <rect x="160" y="172" width="414.5" height="11" fill="url(#mlxHatch)"/>
    <text x="150" y="181" text-anchor="end" font-size="9.5">MLX 8-bit</text>
    <text x="579.5" y="181" class="val">1435<tspan class="mut"> 10.8GB</tspan></text>

    <rect x="160" y="189" width="224.8" height="11" fill="var(--accent,#4FB2C2)"/>
    <text x="150" y="198" text-anchor="end" font-size="9.5">llama F16</text>
    <text x="389.8" y="198" class="val">778<tspan class="mut"> 3.8GB</tspan></text>

    <rect x="160" y="206" width="215.2" height="11" fill="var(--accent,#4FB2C2)"/>
    <text x="150" y="215" text-anchor="end" font-size="9.5">llama Q8_0</text>
    <text x="380.2" y="215" class="val">745<tspan class="mut"> 2.0GB</tspan></text>

    <rect x="160" y="223" width="211.2" height="11" fill="var(--accent,#4FB2C2)"/>
    <text x="150" y="232" text-anchor="end" font-size="9.5">llama IQ4_XS</text>
    <text x="376.2" y="232" class="val">731<tspan class="mut"> 2.0GB</tspan></text>

    <rect x="160" y="240" width="209.7" height="11" fill="var(--accent,#4FB2C2)"/>
    <text x="150" y="249" text-anchor="end" font-size="9.5">llama IQ2_XS</text>
    <text x="374.7" y="249" class="val">726<tspan class="mut"> 1.2GB</tspan></text>

    <rect x="160" y="257" width="208.3" height="11" fill="var(--accent,#4FB2C2)"/>
    <text x="150" y="266" text-anchor="end" font-size="9.5">llama Q4_K_M</text>
    <text x="373.3" y="266" class="val">721<tspan class="mut"> 2.0GB</tspan></text>

    <rect x="160" y="274" width="106.3" height="11" fill="url(#pyDot)"/>
    <text x="150" y="283" text-anchor="end" font-size="9.5">PyTorch fp16</text>
    <text x="271.3" y="283" class="val">368<tspan class="mut"> 6.6GB</tspan></text>
  </g>
  <text x="160" y="300" class="mut" font-size="9">a clean descending ramp &#8212; MLX takes the top five</text>

  <!-- ===================== PANEL B : PER-GB ===================== -->
  <text x="160" y="318" class="ink2" font-size="10.5" letter-spacing="1.2">RANKED BY THROUGHPUT PER GIGABYTE  &#183;  tok/s &#247; peak RAM</text>
  <line x1="160" y1="324" x2="160" y2="514" stroke="var(--rule2,#27323D)" stroke-width="1"/>

  <!-- rows: barY = 330 + i*17 ; scale = 520/650 = 0.8 -->
  <g>
    <rect x="160" y="330" width="107.2" height="11" fill="url(#mlxHatch)"/>
    <text x="150" y="339" text-anchor="end" font-size="9.5">MLX bf16</text>
    <text x="272.2" y="339" class="val">134</text>

    <rect x="160" y="347" width="94.4" height="11" fill="url(#mlxHatch)"/>
    <text x="150" y="356" text-anchor="end" font-size="9.5">MLX 2-bit</text>
    <text x="259.4" y="356" class="val">118</text>

    <rect x="160" y="364" width="114.4" height="11" fill="url(#mlxHatch)"/>
    <text x="150" y="373" text-anchor="end" font-size="9.5">MLX 4-bit</text>
    <text x="279.4" y="373" class="val">143</text>

    <rect x="160" y="381" width="112.0" height="11" fill="url(#mlxHatch)"/>
    <text x="150" y="390" text-anchor="end" font-size="9.5">MLX OptiQ-4b</text>
    <text x="277" y="390" class="val">140</text>

    <rect x="160" y="398" width="106.4" height="11" fill="url(#mlxHatch)"/>
    <text x="150" y="407" text-anchor="end" font-size="9.5">MLX 8-bit</text>
    <text x="271.4" y="407" class="val">133</text>

    <rect x="160" y="415" width="165.6" height="11" fill="var(--accent,#4FB2C2)"/>
    <text x="150" y="424" text-anchor="end" font-size="9.5">llama F16</text>
    <text x="330.6" y="424" class="val">207</text>

    <rect x="160" y="432" width="297.6" height="11" fill="var(--accent,#4FB2C2)"/>
    <text x="150" y="441" text-anchor="end" font-size="9.5">llama Q8_0</text>
    <text x="462.6" y="441" class="val">372</text>

    <rect x="160" y="449" width="293.6" height="11" fill="var(--accent,#4FB2C2)"/>
    <text x="150" y="458" text-anchor="end" font-size="9.5">llama IQ4_XS</text>
    <text x="458.6" y="458" class="val">367</text>

    <rect x="160" y="466" width="492.0" height="11" fill="var(--accent,#4FB2C2)"/>
    <text x="150" y="475" text-anchor="end" font-size="9.5">llama IQ2_XS</text>
    <text x="657" y="475" class="val">615</text>

    <rect x="160" y="483" width="282.4" height="11" fill="var(--accent,#4FB2C2)"/>
    <text x="150" y="492" text-anchor="end" font-size="9.5">llama Q4_K_M</text>
    <text x="447.4" y="492" class="val">353</text>

    <rect x="160" y="500" width="44.8" height="11" fill="url(#pyDot)"/>
    <text x="150" y="509" text-anchor="end" font-size="9.5">PyTorch fp16</text>
    <text x="209.8" y="509" class="val">56</text>
  </g>
  <text x="160" y="526" class="mut" font-size="9">same order, ramp shattered &#8212; the top five (MLX) are now the shortest above PyTorch</text>

  <!-- takeaway + caveat -->
  <text x="40" y="548" class="ink2" font-size="10">Every llama.cpp quant beats every MLX config 2&#8211;4&#215; per GB. On 16 GB, per-GB is the axis that fits.</text>
  <text x="40" y="563" class="mut" font-size="9">MLX RAM is a cumulative high-watermark (overstated); llama is per-process fresh &#8212; gap direction is conservative.</text>
  <text x="40" y="575" class="mut" font-size="9">IQ3_M excluded (EOS-broken in this run).</text>
</svg>
