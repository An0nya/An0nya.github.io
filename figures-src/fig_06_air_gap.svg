<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
  </style>

  <defs>
    <pattern id="wallA" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="var(--muted,#6F7C88)" stroke-width="1" opacity="0.30"/>
    </pattern>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="var(--accent,#4FB2C2)"/>
    </marker>
    <marker id="arrloop" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L5,3 L0,6 Z" fill="var(--muted,#6F7C88)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="430" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="40" y="34" font-size="18">The air gap — two minds, one symbol-at-a-time wire</text>
  <text class="mut" x="40" y="55" font-size="11">Nothing crosses but the chosen symbols — no shared history, no shared lexicon.</text>

  <!-- ============ AGENT A (left) ============ -->
  <rect x="40" y="86" width="250" height="266" rx="6" fill="none" stroke="var(--rule2,#27323D)" stroke-width="1.5"/>
  <text x="60" y="112" class="ink2" font-size="13" letter-spacing="1">AGENT A</text>

  <!-- walled-off history -->
  <rect x="60" y="126" width="210" height="46" rx="3" fill="url(#wallA)" stroke="var(--muted,#6F7C88)" stroke-width="1" stroke-dasharray="3 3" opacity="0.85"/>
  <text x="165" y="154" text-anchor="middle" class="mut" font-size="11">private history</text>

  <!-- walled-off lexicon -->
  <rect x="60" y="182" width="210" height="46" rx="3" fill="url(#wallA)" stroke="var(--muted,#6F7C88)" stroke-width="1" stroke-dasharray="3 3" opacity="0.85"/>
  <text x="165" y="210" text-anchor="middle" class="mut" font-size="11">private lexicon</text>

  <!-- turn cycle loop -->
  <text x="165" y="256" text-anchor="middle" class="mut" font-size="10" letter-spacing="0.5">— turn cycle —</text>
  <g font-size="10" text-anchor="middle">
    <rect x="66" y="266" width="120" height="22" rx="3" fill="none" stroke="var(--rule2,#27323D)" stroke-width="1"/>
    <text x="126" y="281" class="ink2">assistant(tool_call)</text>
    <rect x="66" y="306" width="120" height="22" rx="3" fill="none" stroke="var(--rule2,#27323D)" stroke-width="1"/>
    <text x="126" y="321" class="ink2">tool(response)</text>
    <!-- loop arrows -->
    <path d="M186,277 C214,277 214,317 188,317" fill="none" stroke="var(--muted,#6F7C88)" stroke-width="1.2" marker-end="url(#arrloop)"/>
    <path d="M66,317 C44,317 44,277 64,277" fill="none" stroke="var(--muted,#6F7C88)" stroke-width="1.2" marker-end="url(#arrloop)"/>
  </g>

  <!-- ============ AGENT B (right, mirrored) ============ -->
  <rect x="430" y="86" width="250" height="266" rx="6" fill="none" stroke="var(--rule2,#27323D)" stroke-width="1.5"/>
  <text x="660" y="112" text-anchor="end" class="ink2" font-size="13" letter-spacing="1">AGENT B</text>

  <rect x="450" y="126" width="210" height="46" rx="3" fill="url(#wallA)" stroke="var(--muted,#6F7C88)" stroke-width="1" stroke-dasharray="3 3" opacity="0.85"/>
  <text x="555" y="154" text-anchor="middle" class="mut" font-size="11">private history</text>

  <rect x="450" y="182" width="210" height="46" rx="3" fill="url(#wallA)" stroke="var(--muted,#6F7C88)" stroke-width="1" stroke-dasharray="3 3" opacity="0.85"/>
  <text x="555" y="210" text-anchor="middle" class="mut" font-size="11">private lexicon</text>

  <text x="555" y="256" text-anchor="middle" class="mut" font-size="10" letter-spacing="0.5">— turn cycle —</text>
  <g font-size="10" text-anchor="middle">
    <rect x="534" y="266" width="120" height="22" rx="3" fill="none" stroke="var(--rule2,#27323D)" stroke-width="1"/>
    <text x="594" y="281" class="ink2">assistant(tool_call)</text>
    <rect x="534" y="306" width="120" height="22" rx="3" fill="none" stroke="var(--rule2,#27323D)" stroke-width="1"/>
    <text x="594" y="321" class="ink2">tool(response)</text>
    <path d="M654,277 C682,277 682,317 656,317" fill="none" stroke="var(--muted,#6F7C88)" stroke-width="1.2" marker-end="url(#arrloop)"/>
    <path d="M534,317 C512,317 512,277 532,277" fill="none" stroke="var(--muted,#6F7C88)" stroke-width="1.2" marker-end="url(#arrloop)"/>
  </g>

  <!-- ============ THE WIRE (the only crossing) ============ -->
  <line x1="290" y1="200" x2="430" y2="200" stroke="var(--accent,#4FB2C2)" stroke-width="2.4" marker-end="url(#arr)"/>
  <line x1="430" y1="216" x2="290" y2="216" stroke="var(--accent,#4FB2C2)" stroke-width="2.4" marker-end="url(#arr)"/>
  <text x="360" y="190" text-anchor="middle" font-size="11" fill="var(--accent,#4FB2C2)">transmit(message)</text>
  <text x="360" y="240" text-anchor="middle" class="mut" font-size="9.5">the only shared surface</text>

  <!-- gap marker -->
  <line x1="360" y1="100" x2="360" y2="180" stroke="var(--rule2,#27323D)" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="360" y1="252" x2="360" y2="352" stroke="var(--rule2,#27323D)" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- caption -->
  <text x="40" y="386" class="ink2" font-size="11">Internal state on both sides is walled off (hatched). Errors come back in-universe —</text>
  <text x="40" y="402" class="ink2" font-size="11">`channel_error`, never "invalid JSON" — so the model stays in the channel instead of debugging.</text>
</svg>
