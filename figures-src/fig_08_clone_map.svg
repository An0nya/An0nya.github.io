<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>Recovering a clone map by diffing routers against the base model</title>
  <desc>A grid of expert slots by layer. Cells are marked by whether each router column matches the base model or differs from it. Columns that differ — the overwritten victims — cluster in the low-index slots across 39 of 40 layers, while one layer is entirely unchanged. Because the router is full-precision in every quant, diffing it against the base recovers exactly which experts were cloned where, without the original surgery code.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .vlab { fill: var(--cause,#E3C24A); }
    .vic  { fill: var(--cause,#E3C24A); }
    .donor{ fill: var(--accent,#4FB2C2); }
  </style>

  <rect x="0" y="0" width="720" height="500" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="40" y="32" font-size="18">Recovering a clone map from the routers</text>
  <text class="mut" x="40" y="51" font-size="10">The router (ffn_gate_inp.weight) is F32 in every quant &#8212; so diffing it against the base recovers exactly which experts were overwritten.</text>

  <!-- ===== inset logic (left) ===== -->
  <text class="ink2" x="40" y="90" font-size="11" font-family="var(--font-serif,'Newsreader',Georgia,serif)">the diff rule</text>
  <g font-size="9">
    <rect x="40" y="104" width="14" height="14" rx="2" class="donor"/>
    <text x="62" y="114" class="ink2">column == base</text>
    <text x="62" y="126" class="mut">&#8594; donor (untouched)</text>

    <rect x="40" y="146" width="14" height="14" rx="2" class="vic"/>
    <text x="62" y="156" class="ink2">column &#8800; base</text>
    <text x="62" y="168" class="mut">&#8594; victim (overwritten</text>
    <text x="62" y="180" class="mut">&#160;&#160;&#160;with donor&#8217;s column)</text>
  </g>
  <text class="mut" x="40" y="212" font-size="9">donor &#8594; victim direction</text>
  <text class="mut" x="40" y="224" font-size="9">falls out definitively &#8212;</text>
  <text class="mut" x="40" y="236" font-size="9">no guessing.</text>

  <text class="vlab" x="40" y="276" font-size="10">39 of 40 layers recovered</text>
  <text class="mut" x="40" y="290" font-size="9">cleanly. 4 victims/layer,</text>
  <text class="mut" x="40" y="302" font-size="9">all in low slots 0&#8211;17;</text>
  <text class="mut" x="40" y="314" font-size="9">donors spread 1&#8211;229.</text>
  <text class="ink2" x="40" y="338" font-size="9">&#8594; confirms a &#8220;lowest-</text>
  <text class="ink2" x="40" y="350" font-size="9">&#160;&#160;&#160;firing expert = victim&#8221;</text>
  <text class="ink2" x="40" y="362" font-size="9">&#160;&#160;&#160;selection rule.</text>

  <!-- ===== the grid (right) ===== -->
  <!-- plot box x 360..660 (expert 0..230), y 70..430 (layer 0..39) -->
  <rect x="360" y="70" width="300" height="360" fill="none" stroke="var(--rule2,#27323D)" stroke-width="1"/>

  <!-- faint donor field: implies the untouched majority across 1..229 -->
  <rect x="360" y="70" width="300" height="360" fill="var(--accent,#4FB2C2)" opacity="0.05"/>
  <g stroke="var(--accent,#4FB2C2)" stroke-width="0.5" opacity="0.18">
    <line x1="392" y1="70" x2="392" y2="430"/>
    <line x1="450" y1="70" x2="450" y2="430"/>
    <line x1="520" y1="70" x2="520" y2="430"/>
    <line x1="590" y1="70" x2="590" y2="430"/>
  </g>
  <text class="donor" x="540" y="250" font-size="9" text-anchor="middle" opacity="0.6">donor field &#8212; ~226 untouched experts/layer</text>

  <!-- victim-zone bracket 0..17 -->
  <rect x="360" y="70" width="30" height="360" fill="var(--cause,#E3C24A)" opacity="0.07"/>
  <text class="vlab" x="375" y="446" font-size="8.5" text-anchor="middle">slots 0&#8211;17</text>

  <!-- axes labels -->
  <text class="mut" x="510" y="446" font-size="9" text-anchor="middle">expert slot index &#8594; (0 &#8230; 229)</text>
  <text x="345" y="250" transform="rotate(-90 345 250)" text-anchor="middle" class="mut" font-size="9">layer 0 &#8594; 39</text>
  <g class="mut" font-size="8" text-anchor="end">
    <text x="356" y="74">L0</text>
    <text x="356" y="254">L19</text>
    <text x="356" y="425">L38</text>
  </g>

