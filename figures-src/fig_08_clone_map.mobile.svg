<svg viewBox="0 0 400 720" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>Recovering a clone map by diffing routers against the base model</title>
  <desc>A grid of expert slots by layer. Cells are marked by whether each router column matches the base model or differs from it. Columns that differ — the overwritten victims — cluster in the low-index slots across 39 of 40 layers, while one layer is entirely unchanged. Because the router is full-precision in every quant, diffing it against the base recovers exactly which experts were cloned where, without the original surgery code.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .vlab { fill: var(--cause,#E3C24A); }
    .vic  { fill: var(--cause,#E3C24A); }
    .donor{ fill: var(--accent,#4FB2C2); }
  </style>

  <rect x="0" y="0" width="400" height="720" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="20" y="32" font-size="16">Recovering a clone map from routers</text>
  <text class="mut" x="20" y="50" font-size="9">The router is F32 in every quant &#8212; diff it against</text>
  <text class="mut" x="20" y="62" font-size="9">the base to recover which experts were overwritten.</text>

  <!-- diff rule legend -->
  <g font-size="9">
    <rect x="20" y="78" width="12" height="12" rx="2" class="donor"/>
    <text x="38" y="88" class="ink2">== base &#8594; donor</text>
    <rect x="170" y="78" width="12" height="12" rx="2" class="vic"/>
    <text x="188" y="88" class="ink2">&#8800; base &#8594; victim</text>
  </g>

  <!-- plot box x 70..330 (expert 0..230), y 130..560 (layer 0..39) -->
  <rect x="70" y="130" width="260" height="430" fill="none" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <rect x="70" y="130" width="260" height="430" fill="var(--accent,#4FB2C2)" opacity="0.05"/>
  <g stroke="var(--accent,#4FB2C2)" stroke-width="0.5" opacity="0.18">
    <line x1="120" y1="130" x2="120" y2="560"/>
    <line x1="190" y1="130" x2="190" y2="560"/>
    <line x1="260" y1="130" x2="260" y2="560"/>
  </g>
  <text class="donor" x="225" y="350" font-size="8.5" text-anchor="middle" opacity="0.6">donor field &#8212; ~226 untouched/layer</text>

  <!-- victim zone 0..17 -->
  <rect x="70" y="130" width="20" height="430" fill="var(--cause,#E3C24A)" opacity="0.08"/>
  <text class="vlab" x="80" y="576" font-size="8" text-anchor="middle">0&#8211;17</text>

  <text class="mut" x="225" y="576" font-size="8.5" text-anchor="middle">expert slot index &#8594; (0 &#8230; 229)</text>
  <text x="55" y="345" transform="rotate(-90 55 345)" text-anchor="middle" class="mut" font-size="8.5">layer 0 &#8594; 39</text>

