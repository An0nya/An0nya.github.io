<svg viewBox="0 0 400 470" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .acc  { fill: var(--accent,#4FB2C2); }
    .cit  { fill: var(--cause,#E3C24A); }
    .vio  { fill: var(--neg,#B98AD6); }
    .sla  { fill: var(--fourth,#6E92C4); }
    .accs { stroke: var(--accent,#4FB2C2); fill:none; }
    .cits { stroke: var(--cause,#E3C24A); fill:none; }
    .vios { stroke: var(--neg,#B98AD6); fill:none; }
    .slas { stroke: var(--fourth,#6E92C4); fill:none; }
    .rule { stroke: var(--rule2,#27323D); }
    .axis { stroke: var(--ink2,#A4B0BC); }
  </style>
  <rect x="0" y="0" width="400" height="470" fill="var(--bg2,#141D26)"/>
<text class="ttl" x="40" y="34" font-size="15">Willingness vs capability</text>
<text class="mut" x="40" y="52" font-size="8">rate (commit) × m|g (quality given a guess) · the lift decomposed</text>
<line x1="80" y1="130" x2="80" y2="390" class="axis" stroke-width="1"/>
<line x1="80" y1="390" x2="360" y2="390" class="axis" stroke-width="1"/>
<text x="80.0" y="406" text-anchor="middle" class="mut" font-size="8">0.0</text>
<text x="154.7" y="406" text-anchor="middle" class="mut" font-size="8">0.2</text>
<text x="229.3" y="406" text-anchor="middle" class="mut" font-size="8">0.4</text>
<text x="304.0" y="406" text-anchor="middle" class="mut" font-size="8">0.6</text>
<text x="74" y="393.0" text-anchor="end" class="mut" font-size="8">0.0</text>
<text x="74" y="318.7" text-anchor="end" class="mut" font-size="8">0.2</text>
<text x="74" y="244.4" text-anchor="end" class="mut" font-size="8">0.4</text>
<text x="74" y="170.1" text-anchor="end" class="mut" font-size="8">0.6</text>
<text x="220" y="423" text-anchor="middle" class="ink2" font-size="9">rate — willingness to commit →</text>
<text x="26" y="260" transform="rotate(-90 26 260)" text-anchor="middle" class="ink2" font-size="9">m|g — quality given a guess →</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink2,#A4B0BC)"/></marker></defs>
<line x1="152.4" y1="316.1" x2="171.1" y2="196.1" class="slas" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="146.4" y="250" text-anchor="end" class="cit" font-size="8">force commit:</text>
<text x="146.4" y="262" text-anchor="end" class="cit" font-size="8">intuition</text>
<text x="146.4" y="274" text-anchor="end" class="cit" font-size="8">already there</text>
<line x1="171.1" y1="196.1" x2="308.9" y2="173.8" class="accs" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="270" y="200" text-anchor="middle" class="acc" font-size="8">surgery: mostly compliance →</text>
<circle cx="152.4" cy="316.1" r="6.5" class="sla"/>
<text x="152.4" y="334.1" text-anchor="middle" class="ink2" font-size="8">bare baseline (0.19, 0.20)</text>
<circle cx="171.1" cy="196.1" r="6.5" class="cit"/>
<text x="164.1" y="214.1" text-anchor="middle" class="ink2" font-size="8">baseline, forced</text>
<text x="166.1" y="226.1" text-anchor="middle" class="ink2" font-size="8">(0.24, 0.52)</text>
<circle cx="308.9" cy="173.8" r="6.5" class="acc"/>
<text x="308.9" y="161.8" text-anchor="middle" class="ink2" font-size="8">top RYS (0.61, 0.58)</text>
<line x1="40" y1="428" x2="360" y2="428" class="rule" stroke-width="1"/>
<text x="40" y="446" class="ink2" font-size="9">Most of the gain is <tspan class="acc">horizontal</tspan> (made it commit); only a small <tspan class="cit">vertical</tspan> residual is real compute.</text>
</svg>
