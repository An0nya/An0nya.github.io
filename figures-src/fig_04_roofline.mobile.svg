<svg viewBox="0 0 406 330" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>The roofline crossover</title>
  <desc>The measured M5/M4 decode-throughput ratio across batch widths 64 to 384, rising from 1.44 toward about 2.3, with reference lines at the 1.27× bandwidth ratio and the 2.3× compute ratio. Sub-64 widths are hatched as unmeasured with no curve drawn through them — the crossover below width 64 is a stated, unrun prediction, bandwidth-limited when narrow and compute-limited as the batch grows.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
  </style>
  <defs>
    <pattern id="hatchUm" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0,7 L7,0" stroke="var(--muted,#6F7C88)" stroke-width="0.8" opacity="0.45"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="406" height="330" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="16" y="22" font-size="14">The M5/M4 speedup is GPU</text>
  <text class="ttl" x="16" y="39" font-size="14">compute, not bandwidth</text>
  <text class="mut" x="16" y="54" font-size="8.5">MLX decode ratio (M5 Air &#247; M4 Mini) vs batch width</text>
  <text class="mut" x="16" y="65" font-size="8.5">MiniCPM5-1B &#183; matched script + reboot, both machines</text>

  <!-- gridlines -->
  <g stroke="var(--rule2,#27323D)" stroke-width="1">
    <line x1="44" y1="210" x2="390" y2="210"/>
    <line x1="44" y1="150" x2="390" y2="150"/>
    <line x1="44" y1="90" x2="390" y2="90"/>
  </g>
  <line x1="44" y1="90" x2="44" y2="270" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <line x1="44" y1="270" x2="390" y2="270" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <g class="mut" font-size="8" text-anchor="end">
    <text x="40" y="273">1.0</text><text x="40" y="213">1.5</text><text x="40" y="153">2.0</text><text x="40" y="93">2.5</text>
  </g>
  <g class="mut" font-size="8.5" text-anchor="middle">
    <text x="110" y="283">64</text><text x="165.6" y="283">96</text><text x="221.2" y="283">128</text><text x="276.8" y="283">192</text><text x="332.4" y="283">256</text><text x="388" y="283">384</text>
  </g>

  <!-- unmeasured zone -->
  <rect x="45" y="90" width="50" height="180" fill="url(#hatchUm)"/>
  <text class="mut" x="70" y="180" font-size="8" text-anchor="middle" transform="rotate(-90 70 180)">&#60;64 unmeasured</text>

  <!-- reference lines -->
  <line x1="95" y1="210" x2="390" y2="210" stroke="var(--fourth,#6E92C4)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="ink2" x="130" y="207" font-size="8.5">1.27&#215; bandwidth ratio</text>
  <line x1="95" y1="114" x2="390" y2="114" stroke="var(--cause,#E3C24A)" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="ink2" x="100" y="111" font-size="8.5">~2.3&#215; observed plateau (compute-bound)</text>

  <!-- measured line + points -->
  <polyline style="fill:none" stroke="var(--accent,#4FB2C2)" stroke-width="2"
    points="110,217.2 165.6,132 221.2,134.4 276.8,154.8 332.4,121.2 388,115.2"/>
  <g fill="var(--accent,#4FB2C2)">
    <circle cx="110" cy="217.2" r="3.5"/><circle cx="165.6" cy="132" r="3.5"/><circle cx="221.2" cy="134.4" r="3.5"/><circle cx="276.8" cy="154.8" r="3.5"/><circle cx="332.4" cy="121.2" r="3.5"/><circle cx="388" cy="115.2" r="3.5"/>
  </g>
  <g class="ink2" font-size="8.5" text-anchor="middle">
    <text x="110" y="231">1.44</text><text x="165.6" y="124">2.15</text><text x="276.8" y="167">1.96</text><text x="384" y="105" text-anchor="end">2.29</text>
  </g>

  <text x="16" y="307" class="mut" font-size="8">M5 Air = fanless burst, on battery (sustained TBD);</text>
  <text x="16" y="318" class="mut" font-size="8">M4 sustained. Magnitude is a burst upper bound.</text>
</svg>
