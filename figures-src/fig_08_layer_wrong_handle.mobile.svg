<svg viewBox="0 0 340 620" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>The layer is the wrong handle on a Mixture-of-Experts model</title>
  <desc>On a dense model, duplicating a layer amplifies a unit of computation and capability shifts. On a mixture-of-experts model, the layer is a router selecting a few of many experts; duplicating the whole layer re-runs the router on a shifted input, mis-fires the expert selection, and breaks the output. The operable unit on an MoE is the expert, not the layer.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .ok   { fill: var(--accent,#4FB2C2); }
    .bad  { fill: var(--neg,#B98AD6); }
    .lyr  { fill: var(--bg2,#141D26); stroke: var(--rule2,#27323D); stroke-width: 1.2; }
    .lyrhi{ fill: none; stroke: var(--accent,#4FB2C2); stroke-width: 2; }
    .exp  { fill: var(--bg2,#141D26); stroke: var(--rule2,#27323D); stroke-width: 0.8; }
    .explit { fill: var(--accent,#4FB2C2); stroke: var(--accent,#4FB2C2); }
    .expmis { fill: none; stroke: var(--neg,#B98AD6); stroke-width: 1; }
    .gd   { stroke: var(--ink2,#A4B0BC); fill: none; }
    .gdbad{ stroke: var(--neg,#B98AD6); fill: none; }
  </style>

  <rect x="0" y="0" width="340" height="620" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="20" y="32" font-size="17">The layer is the wrong handle</text>
  <text class="mut" x="20" y="50" font-size="9">A layer is a computation you can repeat; an</text>
  <text class="mut" x="20" y="62" font-size="9">expert bank is a route you can&#8217;t repeat unbroken.</text>

  <defs>
    <marker id="arm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent,#4FB2C2)"/>
    </marker>
    <marker id="arbm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--neg,#B98AD6)"/>
    </marker>
  </defs>

  <!-- ===== TOP: DENSE ===== -->
  <text class="ink2" x="20" y="88" font-size="11" font-family="var(--font-serif,'Newsreader',Georgia,serif)">Dense &#183; duplicate a layer &#8594; amplify</text>

  <g>
    <rect class="lyr"  x="40"  y="100" width="90" height="20" rx="3"/>
    <rect class="lyrhi" x="40" y="124" width="90" height="20" rx="3"/>
    <rect class="lyr"  x="40"  y="148" width="90" height="20" rx="3"/>
    <text class="ok" x="85" y="138" font-size="8.5" text-anchor="middle">layer L</text>
  </g>
  <line x1="136" y1="134" x2="184" y2="134" class="gd" stroke-width="1.4" marker-end="url(#arm)"/>
  <text class="ok" x="160" y="127" font-size="8" text-anchor="middle">dup</text>
  <g>
    <rect class="lyr"  x="190" y="100" width="90" height="20" rx="3"/>
    <rect class="lyrhi" x="190" y="124" width="90" height="20" rx="3"/>
    <rect class="lyrhi" x="190" y="148" width="90" height="20" rx="3"/>
    <rect class="lyr"  x="190" y="172" width="90" height="20" rx="3"/>
    <text class="ok" x="235" y="138" font-size="8" text-anchor="middle">L</text>
    <text class="ok" x="235" y="162" font-size="8" text-anchor="middle">L&#8242;</text>
  </g>
  <text class="ok" x="85" y="190" font-size="10" text-anchor="middle">&#10003; capability shifts</text>

  <line x1="20" y1="206" x2="320" y2="206" stroke="var(--rule2,#27323D)" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ===== BOTTOM: MoE ===== -->
  <text class="ink2" x="20" y="232" font-size="11" font-family="var(--font-serif,'Newsreader',Georgia,serif)">MoE &#183; the same dup re-runs the router</text>

  <line x1="80" y1="244" x2="80" y2="266" class="gd" stroke-width="1.2" marker-end="url(#arm)"/>
  <rect x="52" y="266" width="56" height="20" rx="3" fill="var(--bg2,#141D26)" stroke="var(--accent,#4FB2C2)" stroke-width="1.5"/>
  <text class="ok" x="80" y="280" font-size="9" text-anchor="middle">router</text>

  <!-- expert bank 8x3, 8 lit -->
  <g>
    <rect class="explit" x="52" y="300" width="11" height="11" rx="2"/>
    <rect class="exp" x="67" y="300" width="11" height="11" rx="2"/>
    <rect class="exp" x="82" y="300" width="11" height="11" rx="2"/>
    <rect class="explit" x="97" y="300" width="11" height="11" rx="2"/>
    <rect class="exp" x="112" y="300" width="11" height="11" rx="2"/>
    <rect class="exp" x="127" y="300" width="11" height="11" rx="2"/>
    <rect class="explit" x="142" y="300" width="11" height="11" rx="2"/>
    <rect class="exp" x="157" y="300" width="11" height="11" rx="2"/>

    <rect class="exp" x="52" y="315" width="11" height="11" rx="2"/>
    <rect class="explit" x="67" y="315" width="11" height="11" rx="2"/>
    <rect class="exp" x="82" y="315" width="11" height="11" rx="2"/>
    <rect class="exp" x="97" y="315" width="11" height="11" rx="2"/>
    <rect class="explit" x="112" y="315" width="11" height="11" rx="2"/>
    <rect class="exp" x="127" y="315" width="11" height="11" rx="2"/>
    <rect class="exp" x="142" y="315" width="11" height="11" rx="2"/>
    <rect class="explit" x="157" y="315" width="11" height="11" rx="2"/>

    <rect class="exp" x="52" y="330" width="11" height="11" rx="2"/>
    <rect class="exp" x="67" y="330" width="11" height="11" rx="2"/>
    <rect class="explit" x="82" y="330" width="11" height="11" rx="2"/>
    <rect class="exp" x="97" y="330" width="11" height="11" rx="2"/>
    <rect class="exp" x="112" y="330" width="11" height="11" rx="2"/>
    <rect class="explit" x="127" y="330" width="11" height="11" rx="2"/>
    <rect class="exp" x="142" y="330" width="11" height="11" rx="2"/>
    <rect class="exp" x="157" y="330" width="11" height="11" rx="2"/>
  </g>
  <text class="mut" x="182" y="312" font-size="8">&#9632; ~8 of ~128</text>
  <text class="mut" x="182" y="324" font-size="8">experts lit</text>
  <text class="mut" x="182" y="336" font-size="8">per token</text>

  <line x1="80" y1="346" x2="80" y2="376" class="gdbad" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arbm)"/>
  <text class="bad" x="92" y="364" font-size="8">dup &#8594; router re-runs on</text>
  <text class="bad" x="92" y="375" font-size="8">an uncalibrated residual</text>

  <rect x="52" y="380" width="56" height="20" rx="3" fill="var(--bg2,#141D26)" stroke="var(--neg,#B98AD6)" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text class="bad" x="80" y="394" font-size="9" text-anchor="middle">router&#8242;</text>

  <g>
    <rect class="expmis" x="52" y="414" width="11" height="11" rx="2" stroke-dasharray="2 1.5"/>
    <rect class="exp" x="67" y="414" width="11" height="11" rx="2"/>
    <rect class="exp" x="82" y="414" width="11" height="11" rx="2"/>
    <rect class="expmis" x="97" y="414" width="11" height="11" rx="2" stroke-dasharray="2 1.5"/>
    <rect class="exp" x="112" y="414" width="11" height="11" rx="2"/>
    <rect class="expmis" x="127" y="414" width="11" height="11" rx="2" stroke-dasharray="2 1.5"/>
    <rect class="exp" x="142" y="414" width="11" height="11" rx="2"/>
    <rect class="exp" x="157" y="414" width="11" height="11" rx="2"/>
  </g>
  <text class="bad" x="182" y="420" font-size="8">wrong experts &#8212;</text>
  <text class="bad" x="182" y="432" font-size="8">null rates explode</text>

  <text class="bad" x="80" y="456" font-size="10" text-anchor="middle">&#10007; routing breaks</text>

  <!-- takeaway -->
  <line x1="20" y1="478" x2="320" y2="478" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <text x="20" y="500" class="ink2" font-size="10.5">Dense surgery works because a layer is a</text>
  <text x="20" y="515" class="ink2" font-size="10.5"><tspan class="ok">unit of computation</tspan> you can duplicate.</text>
  <text x="20" y="536" class="ink2" font-size="10.5">On an MoE the layer is a <tspan class="ok">router</tspan> + expert</text>
  <text x="20" y="551" class="ink2" font-size="10.5">bank; duplicating it re-runs the router on a</text>
  <text x="20" y="566" class="ink2" font-size="10.5">shifted residual and <tspan class="bad">breaks the output</tspan>.</text>
  <text x="20" y="587" class="mut" font-size="9.5">The operable unit of capacity is the</text>
  <text x="20" y="600" class="mut" font-size="9.5"><tspan class="ok">expert</tspan>, not the layer.</text>
</svg>
