<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>Depth geometry — 128 unrolled layers</title>
  <desc>Adjacent-layer cosine (left axis, solid) and delta-norm (right axis, dashed) across all 128 unrolled-layer transitions of the baseline HRM forward pass — two cycles, each cycle three L-submodules then H, 16 layers per module. A smooth residual highway sits at cosine 0.85-0.99 through most of the body, punctured by eight sharp dips exactly at the module-boundary transitions (marked with vertical rules), where cosine falls as low as 0.55 and delta-norm spikes as high as 399. A secondary panel below isolates the last pass's H module (16 states) against its last L submodule (16 states): H's per-layer cosine spans a wider range than L's, consistent with H being noisier per layer than L late in the pass.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .cosln{ fill:none; stroke: var(--accent,#4FB2C2); stroke-width:1.6; }
    .dnln { fill:none; stroke: var(--fourth,#6E92C4); stroke-width:1.3; stroke-dasharray:4 2.5; }
    .bnd  { stroke: var(--rule2,#27323D); stroke-width:1; stroke-dasharray:2 3; }
    .axis { stroke: var(--ink2,#A4B0BC); stroke-width:1; }
  </style>

  <rect x="0" y="0" width="900" height="560" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="40" y="34" font-size="18">Depth geometry — 128 unrolled layers, one prompt</text>
  <text class="mut" x="40" y="53" font-size="11">Adjacent-layer cosine (left axis, solid) and ‖Δ‖ (right axis, dashed)</text>
  <text class="mut" x="40" y="68" font-size="11">baseline config, 2 cycles × (L0,L1,L2,H) × 16 layers</text>

  <!-- ============ chart 1: full 128-transition sweep (shifted +15 for header clearance) ============ -->
  <g transform="translate(0,15)">
    <!-- boundary rules (module-transition dips, incl. embed->L0) -->
    <g class="bnd">
      <line x1="90.0" y1="78" x2="90.0" y2="300"/>
      <line x1="183.23" y1="78" x2="183.23" y2="300"/>
      <line x1="276.46" y1="78" x2="276.46" y2="300"/>
      <line x1="369.69" y1="78" x2="369.69" y2="300"/>
      <line x1="462.91" y1="78" x2="462.91" y2="300"/>
      <line x1="556.14" y1="78" x2="556.14" y2="300"/>
      <line x1="649.37" y1="78" x2="649.37" y2="300"/>
      <line x1="742.6" y1="78" x2="742.6" y2="300"/>
    </g>
    <text x="462.91" y="70" text-anchor="middle" class="mut" font-size="8.5">cycle 0→1 (c0.H→c1.L0)</text>

    <!-- axes -->
    <line x1="90" y1="78" x2="90" y2="300" class="axis"/>
    <line x1="830" y1="78" x2="830" y2="300" class="axis"/>
    <line x1="90" y1="300" x2="830" y2="300" class="axis"/>

    <!-- left axis ticks: cosine -->
    <g class="mut" font-size="9" text-anchor="end">
      <text x="84" y="303">0.5</text>
      <text x="84" y="258.6">0.6</text>
      <text x="84" y="214.2">0.7</text>
      <text x="84" y="169.8">0.8</text>
      <text x="84" y="125.4">0.9</text>
      <text x="84" y="81">1.0</text>
    </g>

    <!-- right axis ticks: delta norm -->
    <g class="mut" font-size="9" text-anchor="start">
      <text x="836" y="303">0</text>
      <text x="836" y="247.5">100</text>
      <text x="836" y="192">200</text>
      <text x="836" y="136.5">300</text>
      <text x="836" y="81">400</text>
    </g>

    <!-- x ticks -->
    <g class="mut" font-size="9" text-anchor="middle">
      <text x="90" y="316">1</text>
      <text x="462.91" y="316">64/65</text>
      <text x="830" y="316">128</text>
      <text x="830" y="334" text-anchor="end" letter-spacing="0.5">transition # (of 128)</text>
    </g>

