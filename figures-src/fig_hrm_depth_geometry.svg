    <!-- boundary markers on the cos line (dips are the module-injection points) -->
    <g fill="var(--bg,#0E141A)" stroke="var(--accent,#4FB2C2)" stroke-width="1.6">
      <circle cx="90.0" cy="265.76" r="3"/>
      <circle cx="183.23" cy="201.98" r="3"/>
      <circle cx="276.46" cy="162.17" r="3"/>
      <circle cx="369.69" cy="276.81" r="3"/>
      <circle cx="462.91" cy="142.33" r="3"/>
      <circle cx="556.14" cy="142.84" r="3"/>
      <circle cx="649.37" cy="241.43" r="3"/>
      <circle cx="742.6" cy="269.79" r="3"/>
    </g>

    <!-- legend: parked at 88-107% of the transition axis, y sits below the flat cosine highway
         (~83-92) so the solid line stays clear; the box only clips a ~3px sliver of the 742.6
         boundary's dip transition and the delta line's approach, which the opaque fill masks -->
    <g font-size="9.5" transform="translate(-225,63.4)">
      <rect x="645" y="128" width="175" height="62" rx="3" fill="var(--bg2,#141D26)" opacity="0.92" stroke="var(--rule2,#27323D)"/>
      <line x1="657" y1="148" x2="679" y2="148" class="cosln"/>
      <text x="685" y="151" class="ink2">adjacent cos (left)</text>
      <line x1="657" y1="164" x2="679" y2="164" class="dnln"/>
      <text x="685" y="167" class="ink2">‖Δ‖ (right, dashed)</text>
      <line x1="657" y1="180" x2="679" y2="180" class="bnd"/>
      <text x="685" y="183" class="mut">module boundary</text>
    </g>
  </g>

  <text x="40" y="204" text-anchor="middle" class="ink2" font-size="9.5" transform="rotate(-90 40 204)">adjacent cos ↑</text>
  <text x="874" y="204" text-anchor="middle" class="ink2" font-size="9.5" transform="rotate(90 874 204)">‖Δ‖ ↑</text>

  <!-- ============ chart 2: last-pass per-module depth (shifted +35 for spacing after chart 1) ============ -->
  <g transform="translate(0,35)">
    <text x="40" y="332" class="ink2" font-size="11">Last-pass per-module depth (cycle 1) — H (16 states) vs L2 (16 states, last L submodule)</text>
    <line x1="90" y1="348" x2="830" y2="348" class="axis"/>
    <line x1="90" y1="348" x2="90" y2="470" class="axis"/>
    <line x1="90" y1="470" x2="830" y2="470" class="axis"/>
    <g class="mut" font-size="9" text-anchor="end">
      <text x="84" y="473">0.80</text>
      <text x="84" y="412.5">0.90</text>
      <text x="84" y="351">1.00</text>
    </g>
    <g class="mut" font-size="9" text-anchor="middle">
      <text x="90" y="484">l0→1</text>
      <text x="460" y="484">layer transition (1 of 15, last pass)</text>
      <text x="830" y="484">l14→15</text>
    </g>

    <path fill="none" stroke="var(--accent,#4FB2C2)" stroke-width="1.6"
          d="M90.0,369.93 L142.86,371.81 L195.71,366.45 L248.57,359.26 L301.43,359.02 L354.29,357.53 L407.14,359.0 L460.0,360.58 L512.86,364.98 L565.71,369.16 L618.57,362.78 L671.43,360.79 L724.29,366.34 L777.14,392.75 L830.0,426.34"/>
    <path fill="none" stroke="var(--fourth,#6E92C4)" stroke-width="1.4" stroke-dasharray="4 2.5"
          d="M90.0,357.41 L142.86,357.06 L195.71,357.9 L248.57,354.7 L301.43,355.85 L354.29,356.43 L407.14,367.5 L460.0,360.37 L512.86,357.4 L565.71,358.85 L618.57,360.54 L671.43,359.54 L724.29,358.29 L777.14,380.79 L830.0,410.12"/>

    <g fill="var(--bg,#0E141A)" stroke="var(--accent,#4FB2C2)" stroke-width="1.6">
      <circle cx="90.0" cy="369.93" r="2.6"/><circle cx="142.86" cy="371.81" r="2.6"/><circle cx="195.71" cy="366.45" r="2.6"/><circle cx="248.57" cy="359.26" r="2.6"/><circle cx="301.43" cy="359.02" r="2.6"/><circle cx="354.29" cy="357.53" r="2.6"/><circle cx="407.14" cy="359.0" r="2.6"/><circle cx="460.0" cy="360.58" r="2.6"/><circle cx="512.86" cy="364.98" r="2.6"/><circle cx="565.71" cy="369.16" r="2.6"/><circle cx="618.57" cy="362.78" r="2.6"/><circle cx="671.43" cy="360.79" r="2.6"/><circle cx="724.29" cy="366.34" r="2.6"/><circle cx="777.14" cy="392.75" r="2.6"/><circle cx="830.0" cy="426.34" r="2.6"/>
    </g>
    <g fill="var(--bg,#0E141A)" stroke="var(--fourth,#6E92C4)" stroke-width="1.4">
      <rect x="86.6" y="353.71" width="7" height="7"/><rect x="139.46" y="353.36" width="7" height="7"/><rect x="192.31" y="354.2" width="7" height="7"/><rect x="245.17" y="351.0" width="7" height="7"/><rect x="298.03" y="352.15" width="7" height="7"/><rect x="350.89" y="352.73" width="7" height="7"/><rect x="403.74" y="363.8" width="7" height="7"/><rect x="456.6" y="356.67" width="7" height="7"/><rect x="509.46" y="353.7" width="7" height="7"/><rect x="562.31" y="355.15" width="7" height="7"/><rect x="615.17" y="356.84" width="7" height="7"/><rect x="668.03" y="355.84" width="7" height="7"/><rect x="720.89" y="354.59" width="7" height="7"/><rect x="773.74" y="377.09" width="7" height="7"/><rect x="826.6" y="406.42" width="7" height="7"/>
    </g>

    <!-- legend, sitting in the blank lower-left of the panel (below the H/L2 lines, clear of the late dip) -->
    <g font-size="9.5">
      <line x1="110" y1="408" x2="132" y2="408" stroke="var(--accent,#4FB2C2)" stroke-width="1.6"/>
      <text x="138" y="411" class="ink2">H, last pass (cycle 1)</text>
      <line x1="110" y1="424" x2="132" y2="424" stroke="var(--fourth,#6E92C4)" stroke-width="1.4" stroke-dasharray="4 2.5"/>
      <text x="138" y="427" class="ink2">L2, last pass (cycle 1)</text>
    </g>

    <text x="40" y="504" class="ink2" font-size="10.5">Final adjacent-cos in this run: H 0.872, L2 0.898 — both plotted verbatim above, neither hits the caption's 0.71.</text>
  </g>
</svg>
