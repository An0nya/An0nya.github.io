<svg viewBox="0 0 420 460" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>Friction clusters ranked by session span</title>
  <desc>A schematic bar chart of friction clusters ranked by how many sessions each spans, with cluster counts shown as representative. Some of the tallest bars are flagged suspect because they match the summarizing model's known editorial bias, while some shorter bars are trusted because a real user action backs them — frequency and trustworthiness are different axes.</desc>
  <defs>
    <pattern id="stripeM" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="var(--neg,#B98AD6)" stroke-width="1.1" opacity="0.5"/>
    </pattern>
  </defs>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .acc  { fill: var(--accent,#4FB2C2); }
    .vio  { fill: var(--neg,#B98AD6); }
    .accs { stroke: var(--accent,#4FB2C2); fill:none; }
    .vios { stroke: var(--neg,#B98AD6); fill:none; }
    .rule { stroke: var(--rule2,#27323D); }
    .axis { stroke: var(--ink2,#A4B0BC); }
    .lbl  { fill: var(--ink2,#A4B0BC); font-size: 7.5px; }
  </style>
  <rect x="0" y="0" width="420" height="460" fill="var(--bg2,#141D26)"/>
  <text class="ttl" x="20" y="28" font-size="14">Frequency isn't evidence</text>
  <text class="mut" x="20" y="46" font-size="8">Friction clusters by distinct-session count · bar height ≠ trust</text>

  <rect x="20" y="58" width="12" height="10" class="vios" stroke-width="1.3" fill="url(#stripeM)" stroke-dasharray="3 2"/>
  <text x="38" y="67" class="ink2" font-size="7.5">⚑ suspect — matches reader bias</text>
  <rect x="20" y="74" width="12" height="10" class="accs" stroke-width="1.4" fill="var(--accent,#4FB2C2)" fill-opacity="0.18"/>
  <text x="38" y="83" class="ink2" font-size="7.5">trusted — user-action backed</text>

  <line x1="20" y1="320" x2="400" y2="320" class="axis" stroke-width="1"/>

  <!-- agent rushed : 9 : suspect -->
  <rect x="51.5" y="120.0" width="25" height="200.0" class="vios" stroke-width="1.3" fill="url(#stripeM)" stroke-dasharray="3 2"/>
  <text x="64.0" y="106.0" text-anchor="middle" class="vio" font-size="8">⚑</text>
  <text x="64.0" y="116.0" text-anchor="middle" class="mut" font-size="7.5">9</text>
  <text x="64.0" y="330" text-anchor="end" class="lbl" transform="rotate(-30 64.0 330)">agent rushed</text>

  <!-- too preachy : 8 : suspect -->
  <rect x="91.5" y="142.2" width="25" height="177.8" class="vios" stroke-width="1.3" fill="url(#stripeM)" stroke-dasharray="3 2"/>
  <text x="104.0" y="128.2" text-anchor="middle" class="vio" font-size="8">⚑</text>
  <text x="104.0" y="138.2" text-anchor="middle" class="mut" font-size="7.5">8</text>
  <text x="104.0" y="330" text-anchor="end" class="lbl" transform="rotate(-30 104.0 330)">too preachy</text>

  <!-- invented detour : 6 : suspect -->
  <rect x="131.5" y="186.7" width="25" height="133.3" class="vios" stroke-width="1.3" fill="url(#stripeM)" stroke-dasharray="3 2"/>
  <text x="144.0" y="172.7" text-anchor="middle" class="vio" font-size="8">⚑</text>
  <text x="144.0" y="182.7" text-anchor="middle" class="mut" font-size="7.5">6</text>
  <text x="144.0" y="330" text-anchor="end" class="lbl" transform="rotate(-30 144.0 330)">invented detour</text>

  <!-- grep-first : 5 : trusted -->
  <rect x="171.5" y="208.9" width="25" height="111.1" class="accs" stroke-width="1.4" fill="var(--accent,#4FB2C2)" fill-opacity="0.18"/>
  <text x="184.0" y="202.9" text-anchor="middle" class="mut" font-size="7.5">5</text>
  <text x="184.0" y="330" text-anchor="end" class="lbl" transform="rotate(-30 184.0 330)">grep-first</text>

  <!-- over-formatted : 5 : suspect -->
  <rect x="211.5" y="208.9" width="25" height="111.1" class="vios" stroke-width="1.3" fill="url(#stripeM)" stroke-dasharray="3 2"/>
  <text x="224.0" y="194.9" text-anchor="middle" class="vio" font-size="8">⚑</text>
  <text x="224.0" y="204.9" text-anchor="middle" class="mut" font-size="7.5">5</text>
  <text x="224.0" y="330" text-anchor="end" class="lbl" transform="rotate(-30 224.0 330)">over-formatted</text>

  <!-- verify premise : 4 : trusted -->
  <rect x="251.5" y="231.1" width="25" height="88.9" class="accs" stroke-width="1.4" fill="var(--accent,#4FB2C2)" fill-opacity="0.18"/>
  <text x="264.0" y="225.1" text-anchor="middle" class="mut" font-size="7.5">4</text>
  <text x="264.0" y="330" text-anchor="end" class="lbl" transform="rotate(-30 264.0 330)">verify premise</text>

  <!-- diagnostic≠directive : 4 : trusted -->
  <rect x="291.5" y="231.1" width="25" height="88.9" class="accs" stroke-width="1.4" fill="var(--accent,#4FB2C2)" fill-opacity="0.18"/>
  <text x="304.0" y="225.1" text-anchor="middle" class="mut" font-size="7.5">4</text>
  <text x="304.0" y="330" text-anchor="end" class="lbl" transform="rotate(-30 304.0 330)">diagnostic ≠ directive</text>

  <!-- tool-trust gate : 3 : trusted -->
  <rect x="331.5" y="253.3" width="25" height="66.7" class="accs" stroke-width="1.4" fill="var(--accent,#4FB2C2)" fill-opacity="0.18"/>
  <text x="344.0" y="247.3" text-anchor="middle" class="mut" font-size="7.5">3</text>
  <text x="344.0" y="330" text-anchor="end" class="lbl" transform="rotate(-30 344.0 330)">tool-trust gate</text>

  <!-- under-documented : 3 : trusted -->
  <rect x="371.5" y="253.3" width="25" height="66.7" class="accs" stroke-width="1.4" fill="var(--accent,#4FB2C2)" fill-opacity="0.18"/>
  <text x="384.0" y="247.3" text-anchor="middle" class="mut" font-size="7.5">3</text>
  <text x="384.0" y="330" text-anchor="end" class="lbl" transform="rotate(-30 384.0 330)">under-documented</text>

  <line x1="20" y1="414" x2="400" y2="414" class="rule" stroke-width="1"/>
  <text x="20" y="430" class="ink2" font-size="8">The <tspan class="vio">tallest bars</tspan> are suspect (a biased reader repeating</text>
  <text x="20" y="442" class="ink2" font-size="8">itself); some <tspan class="acc">short bars</tspan> are trusted.</text>
</svg>
