<svg viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg"
     font-family="var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,monospace)">
  <title>Exposure, not capability</title>
  <desc>Left: degeneration rate rising with both copy count and Σα. Right: for the eq channel the aggregate score falls with copy count, but scoring only the non-derailed responses holds flat at or above the untouched baseline — the surgery's cost is derailment risk, not content quality.</desc>
  <style>
    .ttl  { font-family: var(--font-serif,'Newsreader',Georgia,serif); }
    text  { fill: var(--ink,#DCE4EC); }
    .mut  { fill: var(--muted,#6F7C88); }
    .ink2 { fill: var(--ink2,#A4B0BC); }
    .obs  { stroke: var(--accent,#4FB2C2); fill: var(--accent,#4FB2C2); }
  </style>
  <defs>
    <pattern id="cleanHatchM" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="var(--accent,#4FB2C2)" opacity="0.16"/>
      <path d="M0,6 L6,0" stroke="var(--accent,#4FB2C2)" stroke-width="1.4"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="400" height="700" fill="var(--bg2,#141D26)"/>

  <text class="ttl" x="16" y="24" font-size="15">Derailment is a probability tax,</text>
  <text class="ttl" x="16" y="42" font-size="15">not a capability loss</text>
  <text class="mut" x="16" y="58" font-size="8.5">MiniCPM5-1B &#183; L1 split-pass damping &#183; eq channel (96-tok)</text>
  <text class="mut" x="16" y="69" font-size="8.5">&#8220;derail&#8221; = special-token leak or repeated-line loop</text>

  <!-- Mini-A: derail vs k -->
  <text class="ink2" x="16" y="79" font-size="9.5">&#9312; derail % rises with copy-count k <tspan class="mut">(&#931;&#945; 1.5)</tspan></text>
  <g stroke="var(--rule2,#27323D)" stroke-width="1">
    <line x1="55" y1="151.3" x2="360" y2="151.3"/>
    <line x1="55" y1="122.7" x2="360" y2="122.7"/>
  </g>
  <line x1="55" y1="94" x2="55" y2="180" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <line x1="55" y1="180" x2="360" y2="180" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <g class="mut" font-size="8" text-anchor="end">
    <text x="50" y="183">0</text><text x="50" y="154">4</text><text x="50" y="126">8</text><text x="50" y="97">12</text>
  </g>
  <text x="34" y="137" transform="rotate(-90 34 137)" text-anchor="middle" class="mut" font-size="8">derail %</text>
  <g class="mut" font-size="8.5" text-anchor="middle">
    <text x="55" y="192">4</text><text x="131.2" y="192">6</text><text x="207.5" y="192">8</text><text x="283.8" y="192">10</text><text x="360" y="192">12</text>
  </g>
  <text x="207.5" y="204" text-anchor="middle" class="mut" font-size="8.5">copies k</text>
  <polyline class="obs" style="fill:none" stroke-width="2"
    points="55,180 131.2,174.1 207.5,165.1 283.8,156.1 360,144.2"/>
  <g class="obs" stroke="none">
    <circle cx="55" cy="180" r="2.8"/><circle cx="131.2" cy="174.1" r="2.8"/><circle cx="207.5" cy="165.1" r="2.8"/><circle cx="283.8" cy="156.1" r="2.8"/><circle cx="360" cy="144.2" r="2.8"/>
  </g>
  <text class="ink2" x="358" y="138" font-size="8.5" text-anchor="end">5.0%</text>

  <!-- Mini-B: derail vs Sigma-alpha -->
  <text class="ink2" x="16" y="225" font-size="9.5">&#9313; derail % rises with dose &#931;&#945; <tspan class="mut">(k 6)</tspan></text>
  <g stroke="var(--rule2,#27323D)" stroke-width="1">
    <line x1="55" y1="297.3" x2="360" y2="297.3"/>
    <line x1="55" y1="264.7" x2="360" y2="264.7"/>
  </g>
  <line x1="55" y1="232" x2="55" y2="330" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <line x1="55" y1="330" x2="360" y2="330" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <g class="mut" font-size="8" text-anchor="end">
    <text x="50" y="333">0</text><text x="50" y="300">4</text><text x="50" y="268">8</text><text x="50" y="235">12</text>
  </g>
  <text x="32" y="281" transform="rotate(-90 32 281)" text-anchor="middle" class="mut" font-size="8">derail %</text>
  <g class="mut" font-size="8.5" text-anchor="middle">
    <text x="55" y="342">1.5</text><text x="131.2" y="342">1.75</text><text x="207.5" y="342">2.0</text><text x="283.8" y="342">2.25</text><text x="360" y="342">2.5</text>
  </g>
  <text x="207.5" y="354" text-anchor="middle" class="mut" font-size="8.5">cumulative &#931;&#945;</text>
  <polyline class="obs" style="fill:none" stroke-width="2" stroke-dasharray="6 4"
    points="55,323.2 131.2,306.2 207.5,292.6 283.8,265.3 360,234.7"/>
  <g class="obs" stroke="none">
    <rect x="52" y="320.2" width="6" height="6"/><rect x="128.2" y="303.2" width="6" height="6"/><rect x="204.5" y="289.6" width="6" height="6"/><rect x="280.8" y="262.3" width="6" height="6"/><rect x="357" y="231.7" width="6" height="6"/>
  </g>
  <text class="ink2" x="358" y="229" font-size="8.5" text-anchor="end">11.7%</text>

  <!-- Bars: eq score Delta from baseline -->
  <text class="ink2" x="16" y="386" font-size="9.5">&#9314; eq score &#8212; change from baseline, per k</text>
  <rect x="16" y="392" width="13" height="10" fill="var(--cause,#E3C24A)"/>
  <text x="33" y="400" class="ink2" font-size="8.5">aggregate</text>
  <rect x="110" y="392" width="13" height="10" fill="url(#cleanHatchM)" stroke="var(--accent,#4FB2C2)" stroke-width="0.8"/>
  <text x="127" y="400" class="ink2" font-size="8.5">clean-only (derails dropped)</text>

  <g stroke="var(--rule2,#27323D)" stroke-width="1">
    <line x1="55" y1="449.3" x2="385" y2="449.3"/>
    <line x1="55" y1="537.9" x2="385" y2="537.9"/>
  </g>
  <line x1="55" y1="405" x2="55" y2="560" stroke="var(--ink2,#A4B0BC)" stroke-width="1"/>
  <g class="mut" font-size="7.5" text-anchor="end">
    <text x="50" y="408">+.020</text><text x="50" y="452">+.010</text><text x="50" y="540">&#8722;.010</text>
  </g>
  <!-- baseline zero line -->
  <line x1="55" y1="493.6" x2="385" y2="493.6" stroke="var(--ink2,#A4B0BC)" stroke-width="1.4" stroke-dasharray="2 2"/>
  <text class="ink2" x="55" y="575" font-size="8">dashed = baseline eq (.472)</text>

  <!-- bars (agg solid / clean hatch), width 12, agg left clean right of center -->
  <!-- base c65 -->
  <rect x="51" y="493.6" width="12" height="4.4" fill="var(--cause,#E3C24A)"/>
  <rect x="65" y="493.6" width="12" height="0" fill="url(#cleanHatchM)"/>
  <!-- k4 c123 -->
  <rect x="109" y="453.7" width="12" height="39.9" fill="var(--cause,#E3C24A)"/>
  <rect x="123" y="453.7" width="12" height="39.9" fill="url(#cleanHatchM)" stroke="var(--accent,#4FB2C2)" stroke-width="0.7"/>
  <!-- k6 c181 -->
  <rect x="167" y="431.6" width="12" height="62.0" fill="var(--cause,#E3C24A)"/>
  <rect x="181" y="413.9" width="12" height="79.7" fill="url(#cleanHatchM)" stroke="var(--accent,#4FB2C2)" stroke-width="0.7"/>
  <!-- k8 c239 agg dn -->
  <rect x="225" y="493.6" width="12" height="22.1" fill="var(--cause,#E3C24A)"/>
  <rect x="239" y="480.3" width="12" height="13.3" fill="url(#cleanHatchM)" stroke="var(--accent,#4FB2C2)" stroke-width="0.7"/>
  <!-- k10 c297 agg dn -->
  <rect x="283" y="493.6" width="12" height="44.3" fill="var(--cause,#E3C24A)"/>
  <rect x="297" y="467.0" width="12" height="26.6" fill="url(#cleanHatchM)" stroke="var(--accent,#4FB2C2)" stroke-width="0.7"/>
  <!-- k12 c355 agg dn -->
  <rect x="341" y="493.6" width="12" height="53.1" fill="var(--cause,#E3C24A)"/>
  <rect x="355" y="480.3" width="12" height="13.3" fill="url(#cleanHatchM)" stroke="var(--accent,#4FB2C2)" stroke-width="0.7"/>

  <g class="mut" font-size="8.5" text-anchor="middle">
    <text x="65" y="600">base</text><text x="123" y="600">k4</text><text x="181" y="600">k6</text><text x="239" y="600">k8</text><text x="297" y="600">k10</text><text x="355" y="600">k12</text>
  </g>
  <g class="mut" font-size="7" text-anchor="middle">
    <text x="65" y="610">0.8%</text><text x="123" y="610">0%</text><text x="181" y="610">0.8%</text><text x="239" y="610">2.1%</text><text x="297" y="610">3.3%</text><text x="355" y="610">5.0%</text>
  </g>
  <text x="220" y="622" text-anchor="middle" class="mut" font-size="8">copies k (derail rate under each)</text>

  <!-- takeaway -->
  <line x1="16" y1="644" x2="384" y2="644" stroke="var(--rule2,#27323D)" stroke-width="1"/>
  <text x="16" y="662" class="ink2" font-size="9">Past k6 the aggregate eq score falls &#8212; but the clean</text>
  <text x="16" y="674" class="ink2" font-size="9">responses hold at baseline. Not dumber, just derailing</text>
  <text x="16" y="686" class="ink2" font-size="9">more. The cost is <tspan class="obs" fill="var(--accent,#4FB2C2)">exposure</tspan>, not capability.</text>
</svg>
